name: Publish Windows beta direct download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-windows-beta-download.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified beta 2 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p windows-release
          gh run download 41302855220 --repo "${GITHUB_REPOSITORY}" --name "PontoView-Player-Windows-beta2" --dir windows-release
          test -s windows-release/PontoView-Player-Windows-1.0.0-beta.2-Setup.exe
          test -s windows-release/SHA256SUMS.txt
          cd windows-release
          sha256sum -c SHA256SUMS.txt
      - name: Publish explicitly unsigned test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-v1.0.0-beta.2-unsigned"
          exe="windows-release/PontoView-Player-Windows-1.0.0-beta.2-Setup.exe"
          sums="windows-release/SHA256SUMS.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" "$sums" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$exe" "$sums" --repo "$GITHUB_REPOSITORY" \
              --title "PontoView Player Windows 1.0.0 beta 2 (teste sem assinatura)" \
              --notes "Versão beta de testes, sem assinatura digital Authenticode. Não é versão comercial definitiva. Baixe apenas do repositório oficial, verifique o SHA-256 e execute testes em um equipamento de avaliação." \
              --prerelease --target "$GITHUB_SHA"
          fi
