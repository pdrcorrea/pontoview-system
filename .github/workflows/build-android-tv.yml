name: Build PontoView TV APK

on:
  push:
    branches:
      - main
      - player-core-v3
    paths:
      - "android-tv/**"
      - "frontend/src/player/Player.tsx"
      - "frontend/src/lib/playerVersion.ts"
      - "frontend/src/App.tsx"
      - "frontend/vite.player.config.ts"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://fpdojntvnhiszagczfqr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hd9GQaTeJ18o3pwMIZevJQ_EgVIOVOp
        run: |
          npm ci
          npm run build
          npx vite build --config vite.player.config.ts

      - name: Bundle Player frontend into APK
        run: |
          rm -rf android-tv/app/src/main/assets
          mkdir -p android-tv/app/src/main/assets
          cp -R frontend/dist-player/. android-tv/app/src/main/assets/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare production signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PV_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pontoview-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production signing is not configured; building technical preview."
          fi

      - name: Build APK
        working-directory: android-tv
        env:
          PV_KEYSTORE_PATH: ${{ runner.temp }}/pontoview-release.jks
          PV_KEYSTORE_PASSWORD: ${{ secrets.PV_ANDROID_KEYSTORE_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.PV_ANDROID_KEY_ALIAS }}
          PV_KEY_PASSWORD: ${{ secrets.PV_ANDROID_KEY_PASSWORD }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED_BUILD" = "true" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Prepare artifact
        env:
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED_BUILD" = "true" ]; then
            cp android-tv/app/build/outputs/apk/release/app-release.apk PontoView-Telas-v3.0.0-beta4.apk
          else
            cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-Telas-v3.0.0-beta4.apk
          fi
          sha256sum PontoView-Telas-v3.0.0-beta4.apk > PontoView-Telas-v3.0.0-beta4.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-Telas-v3.0.0-beta4
          path: |
            PontoView-Telas-v3.0.0-beta4.apk
            PontoView-Telas-v3.0.0-beta4.sha256
          retention-days: 30

      - name: Publish testing release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/player-core-v3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v3.0.0-beta4"
          APK="PontoView-Telas-v3.0.0-beta4.apk"
          SUM="PontoView-Telas-v3.0.0-beta4.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM"               --target "$GITHUB_SHA"               --title "PontoView Telas 3.0.0 beta 4"               --notes "Player Core v3: snapshots atômicos, biblioteca local, Google Drive como origem, operação offline e watchdog. Sem armazenamento central de mídia."               --prerelease
          fi

      - name: Publish update feed
        if: steps.signing.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/player-core-v3')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL="stable"
          if [ "$GITHUB_REF" = "refs/heads/player-core-v3" ]; then
            CHANNEL="beta"
          fi

          VERSION_NAME="3.0.0-beta4"
          VERSION_CODE="30004"
          TAG="android-v3.0.0-beta4"
          APK="PontoView-Telas-v3.0.0-beta4.apk"
          SUM="PontoView-Telas-v3.0.0-beta4.sha256"
          SHA256="$(awk '{print $1}' "$SUM")"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if ! gh release view android-updates >/dev/null 2>&1; then
            gh release create android-updates --title "PontoView Android Update Feed" --notes "Feed utilizado pelos Players PontoView para atualização segura."
          fi

          echo '{"schema":1}' > update-manifest.json
          gh release download android-updates -p update-manifest.json --clobber >/dev/null 2>&1 || true

          jq --arg channel "$CHANNEL" --arg versionName "$VERSION_NAME" --argjson versionCode "$VERSION_CODE" --arg url "$APK_URL" --arg sha256 "$SHA256" --arg publishedAt "$PUBLISHED_AT" '.schema = 1 | .[$channel] = {versionCode:$versionCode,versionName:$versionName,url:$url,sha256:$sha256,required:false,publishedAt:$publishedAt}' update-manifest.json > update-manifest.tmp
          mv update-manifest.tmp update-manifest.json
          gh release upload android-updates update-manifest.json --clobber
