name: Build PontoView TV APK

on:
  push:
    branches:
      - main
      - player-core-v3
    paths:
      - "android-tv/**"
      - "frontend/src/player/Player.tsx"
      - "frontend/src/lib/playerVersion.ts"
      - "frontend/src/App.tsx"
      - "frontend/vite.player.config.ts"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://fpdojntvnhiszagczfqr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hd9GQaTeJ18o3pwMIZevJQ_EgVIOVOp
        run: |
          npm ci
          npm run build
          npx vite build --config vite.player.config.ts

      - name: Bundle Player frontend into APK
        run: |
          rm -rf android-tv/app/src/main/assets
          mkdir -p android-tv/app/src/main/assets
          cp -R frontend/dist-player/. android-tv/app/src/main/assets/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-Telas-v3.0.0-beta3.apk
          sha256sum PontoView-Telas-v3.0.0-beta3.apk > PontoView-Telas-v3.0.0-beta3.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-Telas-v3.0.0-beta3
          path: |
            PontoView-Telas-v3.0.0-beta3.apk
            PontoView-Telas-v3.0.0-beta3.sha256
          retention-days: 30

      - name: Publish testing release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/player-core-v3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v3.0.0-beta3"
          APK="PontoView-Telas-v3.0.0-beta3.apk"
          SUM="PontoView-Telas-v3.0.0-beta3.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM"               --target "$GITHUB_SHA"               --title "PontoView Telas 3.0.0 beta 3"               --notes "Player Core v3: snapshots atômicos, biblioteca local, Google Drive como origem, operação offline e watchdog. Sem armazenamento central de mídia."               --prerelease
          fi
