name: Build PontoView TV APK

on:
  push:
    branches:
      - main
      - test/android-native-player-v4
    paths:
      - "android-tv/**"
      - "frontend/src/player/Player.tsx"
      - "frontend/src/lib/playerVersion.ts"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-Telas-v4.0.0-lab1.apk
          sha256sum PontoView-Telas-v4.0.0-lab1.apk > PontoView-Telas-v4.0.0-lab1.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-Telas-v4.0.0-lab1
          path: |
            PontoView-Telas-v4.0.0-lab1.apk
            PontoView-Telas-v4.0.0-lab1.sha256
          retention-days: 30

      - name: Publish testing release
        if: github.ref == 'refs/heads/test/android-native-player-v4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v4.0.0-lab1"
          APK="PontoView-Telas-v4.0.0-lab1.apk"
          SUM="PontoView-Telas-v4.0.0-lab1.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM"               --target "$GITHUB_SHA"               --title "PontoView Telas 4.0.0 LAB1"               --notes "Instalação independente para testes de Media3/ExoPlayer nativo. Não substitui o APK oficial. O player web requer implantação do código com identificação de laboratório."               --prerelease
          fi
