name: Build PontoView TV APK

on:
  push:
    branches:
      - main
      - experiment/android-player-native-v2
    paths:
      - "android-tv/**"
      - "frontend/src/player/Player.tsx"
      - "frontend/src/lib/playerVersion.ts"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-Player-Android-v4.1.0-experiment.apk
          sha256sum PontoView-Player-Android-v4.1.0-experiment.apk > PontoView-Player-Android-v4.1.0-experiment.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-Player-Android-v4.1.0-experiment
          path: |
            PontoView-Player-Android-v4.1.0-experiment.apk
            PontoView-Player-Android-v4.1.0-experiment.sha256
          retention-days: 30

      - name: Publish testing release
        if: github.ref == 'refs/heads/experiment/android-player-native-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v4.1.0-experiment"
          APK="PontoView-Player-Android-v4.1.0-experiment.apk"
          SUM="PontoView-Player-Android-v4.1.0-experiment.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM"               --target "$GITHUB_SHA"               --title "PontoView Player Android 4.1.0 Experimental"               --notes "Aplicativo de testes instalável separadamente do PontoView Telas. Reprodução de vídeos Drive por Media3 nativo, cache local, fallback web, monitor de travamentos e proteção contra quadro verde. Não substitui o APK oficial."               --prerelease
          fi
