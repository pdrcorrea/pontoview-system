name: Build PontoView TV APK

on:
  push:
    branches:
      - main
    paths:
      - "android-tv/**"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-Telas-v2.0.0-beta1.apk
          sha256sum PontoView-Telas-v2.0.0-beta1.apk > PontoView-Telas-v2.0.0-beta1.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-Telas-v2.0.0-beta1
          path: |
            PontoView-Telas-v2.0.0-beta1.apk
            PontoView-Telas-v2.0.0-beta1.sha256
          retention-days: 30

      - name: Publish testing release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v2.0.0-beta1"
          APK="PontoView-Telas-v2.0.0-beta1.apk"
          SUM="PontoView-Telas-v2.0.0-beta1.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM"               --target "$GITHUB_SHA"               --title "PontoView Telas 2.0.0 beta 1"               --notes "APK de testes com Media3/ExoPlayer, cache local de vídeo, otimização local de imagens, pré-carregamento e fallback WebView. Sem Cloudflare R2."               --prerelease
          fi
