name: Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android TV debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/pontoview-telas-beta11-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pontoview-telas-beta11-debug
          path: android-tv/app/build/outputs/apk/debug/pontoview-telas-beta11-debug.apk
          if-no-files-found: error
