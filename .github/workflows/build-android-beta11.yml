name: Build PontoView Android TV beta 11

on:
  push:
    branches:
      - feature/android-player-beta11
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-beta11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare beta APK and checksum
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk PontoView-AndroidTV-v2.0.0-beta11-debug.apk
          sha256sum PontoView-AndroidTV-v2.0.0-beta11-debug.apk > SHA256SUMS.txt
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PontoView-AndroidTV-beta11-debug
          path: |
            PontoView-AndroidTV-v2.0.0-beta11-debug.apk
            SHA256SUMS.txt
          retention-days: 30
