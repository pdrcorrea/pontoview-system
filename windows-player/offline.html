<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView | Reconectando</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#030b19;color:#e7eefb;font-family:Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:30px}
  section{max-width:640px}.mark{width:76px;height:76px;border:2px solid #3f87dd;border-radius:23px;display:grid;place-items:center;font-size:31px;font-weight:800;margin:0 auto 32px;color:#a9d1ff;background:#0b2547}
  h1{font-size:clamp(28px,4vw,52px);margin:0 0 20px}p{font-size:clamp(17px,2vw,24px);line-height:1.5;color:#aabbd0;margin:0}
  small{display:block;margin-top:28px;font-size:15px;color:#7099c9}
</style>
</head>
<body><section><div class="mark">P</div><h1>Conexão temporariamente indisponível</h1><p>O PontoView está tentando restabelecer a reprodução automaticamente.</p><small>Não é necessário reiniciar o computador.</small></section></body>
</html>
