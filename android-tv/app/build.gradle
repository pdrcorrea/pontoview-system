plugins {
    id "com.android.application"
}

android {
    namespace "com.pontoview.telas"

    def releaseStorePath = System.getenv("PV_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("PV_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("PV_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("PV_KEY_PASSWORD")
    compileSdk 36

    defaultConfig {
        applicationId "com.pontoview.telas"
        minSdk 24
        targetSdk 35
        versionCode 30004
        versionName "3.0.0-beta4"
    }

    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"direct\""
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", "\"play\""
        }
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    def media3Version = "1.11.0"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.webkit:webkit:1.12.1"
}
