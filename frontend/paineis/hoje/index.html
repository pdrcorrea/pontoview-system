<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Hoje</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/pontoview.css">
</head>
<body>
<div class="pv-ambient" aria-hidden="true"></div>
<div class="pv-shell">
  <header class="pv-header">
    <div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">calendar_today</span></div><div class="pv-title">Hoje</div></div>
    <div class="pv-source"><span class="material-symbols-outlined">schedule</span><span id="clock">--:--</span></div>
  </header>
  <main class="pv-stage">
    <section class="pv-copy">
      <div class="pv-kicker" id="weekday">Hoje</div>
      <h1 class="pv-headline" id="dateTitle">Carregando data...</h1>
      <p class="pv-body" id="todayNote"></p>
    </section>
    <section class="pv-cards" id="cards">
      <article class="pv-card"><div class="pv-card-label">Data especial</div><div class="pv-card-value" id="holiday">Dia comum</div><div class="pv-card-note" id="holidayNote">Sem feriado nacional hoje</div></article>
      <article class="pv-card"><div class="pv-card-label">Estação</div><div class="pv-card-value" id="season">--</div><div class="pv-card-note">Hemisfério Sul</div></article>
      <article class="pv-card"><div class="pv-card-label">Ano em curso</div><div class="pv-card-value" id="dayOfYear">--</div><div class="pv-card-note" id="daysLeft">--</div></article>
      <article class="pv-card"><div class="pv-card-label">Próximo feriado</div><div class="pv-card-value" id="nextHolidayDate">--</div><div class="pv-card-note" id="nextHolidayName">Consultando calendário nacional</div></article>
    </section>
  </main>
  <footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer>
</div>
<script src="../shared/pv.js"></script>
<script>
const els={clock:document.getElementById('clock'),weekday:document.getElementById('weekday'),dateTitle:document.getElementById('dateTitle'),todayNote:document.getElementById('todayNote'),holiday:document.getElementById('holiday'),holidayNote:document.getElementById('holidayNote'),season:document.getElementById('season'),dayOfYear:document.getElementById('dayOfYear'),daysLeft:document.getElementById('daysLeft'),nextHolidayDate:document.getElementById('nextHolidayDate'),nextHolidayName:document.getElementById('nextHolidayName')};
function localYMD(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function dayOfYear(d){const start=Date.UTC(d.getFullYear(),0,0),current=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return Math.floor((current-start)/86400000)}
function season(d){const md=(d.getMonth()+1)*100+d.getDate();if(md>=1221||md<=320)return 'Verão';if(md<=620)return 'Outono';if(md<=922)return 'Inverno';return 'Primavera'}
async function directData(){const year=new Date().getFullYear();let holidays=[];try{holidays=await PV.fetchJSON(`https://brasilapi.com.br/api/feriados/v1/${year}`)}catch{}return{holidays:Array.isArray(holidays)?holidays:[]}}
function render(data){const now=new Date(),holidays=Array.isArray(data.holidays)?data.holidays:[],today=localYMD(now),todayHoliday=holidays.find(h=>h.date===today),next=holidays.find(h=>h.date>today),long=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(now);els.weekday.textContent=PV.titleCase(new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(now));els.dateTitle.textContent=PV.titleCase(long);els.todayNote.textContent=todayHoliday?`Hoje é ${todayHoliday.name}.`:'Um novo dia para informar, conectar e fazer acontecer.';els.holiday.textContent=todayHoliday?'Feriado':'Dia comum';els.holidayNote.textContent=todayHoliday?todayHoliday.name:'Sem feriado nacional hoje';els.season.textContent=season(now);const doy=dayOfYear(now),total=dayOfYear(new Date(now.getFullYear(),11,31));els.dayOfYear.textContent=`${doy}º dia`;els.daysLeft.textContent=`${Math.max(0,total-doy)} dias restantes no ano`;if(next){const d=new Date(next.date+'T12:00:00');els.nextHolidayDate.textContent=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(d).replace('.','');els.nextHolidayName.textContent=next.name}else{els.nextHolidayDate.textContent='Novo ano';els.nextHolidayName.textContent='Próximo calendário em breve'}}
function updateClock(){els.clock.textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
async function load(){try{render(await PV.fromApi('/api/hoje',directData))}catch{render({holidays:[]})}updateClock()}
load();setInterval(updateClock,1000);
</script>
</body></html>
