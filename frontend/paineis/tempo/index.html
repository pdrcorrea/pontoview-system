<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Clima</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.weather{min-height:0;display:grid;grid-template-columns:minmax(0,48%) minmax(0,52%);gap:clamp(22px,3vw,48px)}.current{display:flex;flex-direction:column;justify-content:center;min-width:0}.hero{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);align-items:center;gap:clamp(12px,2vw,28px)}.orb{width:min(16vw,220px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.16),rgba(105,207,242,.07) 48%,rgba(255,255,255,.02) 72%);border:1px solid var(--pv-line);position:relative}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.orb:before{inset:12%;animation:pvRing 24s linear infinite}.orb:after{inset:26%;animation:pvRing 17s linear infinite reverse}.orb span{font-size:clamp(72px,7vw,112px);color:#d8f2ff;z-index:1}.now{min-width:0}.temp{font-size:clamp(78px,8vw,126px);line-height:.88;font-weight:300;letter-spacing:-.07em;white-space:nowrap}.condition{margin-top:14px;font-size:clamp(18px,1.6vw,26px);font-weight:650}.range{display:flex;gap:18px;margin-top:12px;font-size:clamp(13px,1.05vw,17px);color:var(--pv-soft)}.range b{color:#fff}.range .min{color:var(--pv-sky)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:clamp(22px,3vh,34px)}.metric{padding:14px;border-radius:20px;background:var(--pv-panel);border:1px solid var(--pv-line)}.metric-label{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pv-soft)}.metric-label span{font-size:21px;color:var(--pv-sky)}.metric-value{font-size:clamp(19px,1.7vw,28px);font-weight:650;margin-top:10px;white-space:nowrap}.forecast{display:flex;flex-direction:column;justify-content:center;min-width:0}.forecast-title{font-size:clamp(12px,1vw,16px);font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--pv-soft);margin-bottom:12px}.days{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:9px;min-height:0}.day{display:grid;grid-template-columns:82px 48px minmax(0,1fr) 112px;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:var(--pv-panel);border:1px solid var(--pv-line)}.day.today{background:var(--pv-panel-strong);border-color:rgba(105,207,242,.35)}.day-name{font-weight:700;text-transform:uppercase;font-size:clamp(12px,1vw,16px)}.day-date{font-size:10px;color:var(--pv-faint);margin-top:3px}.day-icon{font-size:34px;color:#d8f2ff}.day-desc{font-size:clamp(12px,1vw,16px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rain-note{font-size:10px;color:var(--pv-soft);margin-top:3px}.temps{display:flex;justify-content:flex-end;gap:12px;font-size:clamp(15px,1.25vw,20px);font-weight:650}.temps .min{color:var(--pv-sky)}.place{margin-top:5px;color:var(--pv-soft);font-size:12px}.credit{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--pv-faint)}.pv-footer{justify-content:space-between}.pv-footer-brand{position:absolute;left:50%;transform:translateX(-50%)}@media(orientation:portrait),(max-aspect-ratio:4/5){.weather{grid-template-columns:1fr;grid-template-rows:minmax(0,43%) minmax(0,57%)}.hero{grid-template-columns:minmax(130px,220px) minmax(0,1fr)}.orb{width:min(31vw,220px)}}@media(max-width:650px){.hero{grid-template-columns:120px minmax(0,1fr)}.orb{width:118px}.metrics{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:70px 40px minmax(0,1fr) 88px;padding:8px 10px}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">partly_cloudy_day</span></div><div><div class="pv-title">Previsão do Tempo</div><div class="place" id="place">Carregando localização...</div></div></div><div class="pv-source"><span class="material-symbols-outlined">schedule</span><span id="clock">--:--</span></div></header><main class="weather"><section class="current"><div class="hero"><div class="orb"><span class="material-symbols-outlined" id="wx">cloud</span></div><div class="now"><div class="temp" id="temp">--°</div><div class="condition" id="condition">Atualizando...</div><div class="range"><span>mín <b class="min" id="min">--°</b></span><span>máx <b id="max">--°</b></span></div></div></div><div class="metrics"><div class="metric"><div class="metric-label"><span class="material-symbols-outlined">device_thermostat</span>Sensação</div><div class="metric-value" id="feel">--°</div></div><div class="metric"><div class="metric-label"><span class="material-symbols-outlined">air</span>Vento</div><div class="metric-value" id="wind">--</div></div><div class="metric"><div class="metric-label"><span class="material-symbols-outlined">opacity</span>Umidade</div><div class="metric-value" id="humidity">--</div></div><div class="metric"><div class="metric-label"><span class="material-symbols-outlined">water_drop</span>Chuva</div><div class="metric-value" id="rain">--</div></div></div></section><section class="forecast"><div class="forecast-title">Próximos dias</div><div class="days" id="days"></div></section></main><footer class="pv-footer"><span class="credit">Dados: Open-Meteo</span><div class="pv-footer-brand">PontoView</div><span></span></footer></div><script src="../shared/pv.js"></script><script>
const $=id=>document.getElementById(id);const el={place:$('place'),clock:$('clock'),wx:$('wx'),temp:$('temp'),condition:$('condition'),min:$('min'),max:$('max'),feel:$('feel'),wind:$('wind'),humidity:$('humidity'),rain:$('rain'),days:$('days')};
const codeText=c=>({0:'Céu limpo',1:'Predomínio de sol',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa leve',53:'Garoa',55:'Garoa forte',61:'Chuva leve',63:'Chuva',65:'Chuva forte',71:'Neve leve',73:'Neve',75:'Neve forte',80:'Pancadas de chuva',81:'Pancadas de chuva',82:'Pancadas fortes',95:'Trovoadas',96:'Trovoadas com granizo',99:'Trovoadas com granizo'}[c]||'Tempo variável');
function icon(c,day=true){if(c===0||c===1)return day?'wb_sunny':'nightlight';if(c===2)return day?'partly_cloudy_day':'nightlight';if(c===3)return'cloud';if([45,48].includes(c))return'blur_on';if([51,53,55].includes(c))return'grain';if([61,63,65,80,81,82].includes(c))return'umbrella';if([71,73,75].includes(c))return'ac_unit';if([95,96,99].includes(c))return'thunderstorm';return'cloud'}
function tick(){el.clock.textContent=new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
async function location(){let lat=Number(PV.qs('lat','NaN')),lon=Number(PV.qs('lon','NaN')),city=PV.qs('cidade',''),uf=PV.qs('uf','');if(Number.isFinite(lat)&&Number.isFinite(lon))return{lat,lon,city,uf};try{const d=await PV.cachedJSON('https://ipwho.is/?lang=pt',24*60*60*1000);lat=Number(d.latitude);lon=Number(d.longitude);city=city||d.city||'';uf=uf||d.region_code||'';if(Number.isFinite(lat)&&Number.isFinite(lon))return{lat,lon,city,uf}}catch{}return{lat:-19.5394,lon:-40.6306,city:city||'Colatina',uf:uf||'ES'}}
function render(d){const c=d.current||{},daily=d.daily||{},day=Number(c.is_day)!==0;el.wx.textContent=icon(Number(c.weather_code),day);el.temp.textContent=Math.round(Number(c.temperature_2m))+'°';el.condition.textContent=codeText(Number(c.weather_code));el.min.textContent=Math.round(Number(daily.temperature_2m_min?.[0]))+'°';el.max.textContent=Math.round(Number(daily.temperature_2m_max?.[0]))+'°';el.feel.textContent=Math.round(Number(c.apparent_temperature))+'°';el.wind.textContent=Math.round(Number(c.wind_speed_10m))+' km/h';el.humidity.textContent=Math.round(Number(c.relative_humidity_2m))+'%';el.rain.textContent=(Number(c.precipitation)||0).toFixed(1).replace('.',',')+' mm';const names=['Hoje','Amanhã','Depois','+3 dias','+4 dias'];el.days.innerHTML='';for(let i=0;i<Math.min(5,daily.time?.length||0);i++){const date=new Date(daily.time[i]+'T12:00:00'),code=Number(daily.weather_code[i]);const row=document.createElement('div');row.className='day'+(i===0?' today':'');row.innerHTML=`<div><div class="day-name">${names[i]}</div><div class="day-date">${new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(date).replace('.','')}</div></div><span class="material-symbols-outlined day-icon">${icon(code,true)}</span><div><div class="day-desc">${codeText(code)}</div><div class="rain-note">Chuva: ${Math.round(Number(daily.precipitation_probability_max?.[i]||0))}%</div></div><div class="temps"><span class="min">${Math.round(Number(daily.temperature_2m_min[i]))}°</span><span>${Math.round(Number(daily.temperature_2m_max[i]))}°</span></div>`;el.days.appendChild(row)}}
async function load(){const loc=await location();el.place.textContent=[loc.city,loc.uf].filter(Boolean).join(' · ')||'Localização aproximada';const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`;try{render(await PV.cachedJSON(url,10*60*1000))}catch{el.condition.textContent='Previsão indisponível';el.place.textContent='Tente novamente no próximo refresh'}}tick();setInterval(tick,1000);load();
</script></body></html>
