<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Saudações</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
:root{--g1:#0b55ad;--g2:#08458f;--warm:#ffd88a}body{background:linear-gradient(145deg,var(--g1),var(--g2));transition:background 1.2s ease}.greeting{min-height:0;display:grid;grid-template-columns:minmax(0,58%) minmax(0,42%);gap:clamp(28px,3vw,50px)}.copy{min-height:0;display:flex;flex-direction:column;justify-content:center}.title{font-size:clamp(64px,8vw,138px);font-weight:650;line-height:.92;letter-spacing:-.065em;text-wrap:balance}.subtitle{margin-top:clamp(24px,3vh,36px);font-size:clamp(18px,1.55vw,25px);line-height:1.5;color:var(--pv-soft);max-width:46ch}.scene{min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:clamp(28px,3vw,44px);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.12),rgba(105,207,242,.06) 45%,rgba(255,255,255,.025) 72%);border:1px solid rgba(255,255,255,.12)}.celestial{width:min(25vw,340px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}.celestial::before,.celestial::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.celestial::before{inset:11%;animation:pvRing 28s linear infinite}.celestial::after{inset:25%;animation:pvRing 19s linear infinite reverse}.celestial span{font-size:clamp(110px,12vw,190px);color:var(--warm);z-index:2;animation:float 5s ease-in-out infinite}.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.34;animation:twinkle 3s ease-in-out infinite}.spark.a{left:18%;top:20%}.spark.b{right:16%;top:28%;animation-delay:-1s}.spark.c{left:26%;bottom:18%;animation-delay:-2s}.spark.d{right:26%;bottom:22%;animation-delay:-.5s}.wave{position:absolute;left:-10%;right:-10%;bottom:-17%;height:42%;border-radius:50% 50% 0 0;background:rgba(105,207,242,.07);transform:rotate(-3deg)}.greeting{animation:greetingIn .7s var(--pv-ease) both}@keyframes greetingIn{from{opacity:0;transform:translateY(12px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}@keyframes twinkle{50%{opacity:.9;transform:scale(1.7)}}@media(orientation:portrait),(max-aspect-ratio:4/5){.greeting{grid-template-columns:1fr;grid-template-rows:minmax(0,58%) minmax(0,42%);gap:22px}.title{font-size:clamp(68px,13vw,116px)}.celestial{width:min(48vw,350px)}}@media(orientation:landscape) and (max-height:760px){.greeting{gap:30px}.title{font-size:clamp(58px,7vw,104px)}.subtitle{font-size:16px;margin-top:18px}.celestial{width:min(22vw,260px)}.celestial span{font-size:108px}}@media(prefers-reduced-motion:reduce){.greeting,.celestial::before,.celestial::after,.celestial span,.spark{animation:none!important}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">waving_hand</span></div><div class="pv-title">Saudações</div></div></header><main class="greeting"><section class="copy"><div class="title" id="title">Bem-vindo</div><div class="subtitle" id="subtitle">Que o seu tempo aqui seja leve, agradável e bem informado.</div></section><section class="scene"><span class="spark a"></span><span class="spark b"></span><span class="spark c"></span><span class="spark d"></span><div class="celestial"><span class="material-symbols-outlined" id="sceneIcon">wb_sunny</span></div><div class="wave"></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),icon=document.getElementById('sceneIcon'),name=PV.qs('nome','');function state(){const h=new Date().getHours();if(h>=5&&h<12)return{g:'Bom dia',icon:'wb_sunny',key:'morning',g1:'#0b5db5',g2:'#08458f',warm:'#ffd88a',text:'Que o seu dia comece leve, acolhedor e cheio de boas possibilidades.'};if(h>=12&&h<18)return{g:'Boa tarde',icon:'sunny',key:'afternoon',g1:'#0a4e9f',g2:'#063b80',warm:'#ffd18a',text:'Que a sua tarde siga tranquila, produtiva e com bons encontros pelo caminho.'};return{g:'Boa noite',icon:'nightlight',key:'evening',g1:'#063a7c',g2:'#03275b',warm:'#cfe3ff',text:'Que a sua noite seja tranquila, acolhedora e agradável.'}}function render(){const s=state();document.documentElement.style.setProperty('--g1',s.g1);document.documentElement.style.setProperty('--g2',s.g2);document.documentElement.style.setProperty('--warm',s.warm);icon.textContent=s.icon;const options=[{t:s.g,sub:s.text},{t:name?`Bem-vindo, ${name}`:'Bem-vindo',sub:'Que o seu tempo aqui seja confortável, agradável e bem informado.'}];const x=PV.pickForRefresh(options,'saudacoes',i=>i.t);title.textContent=x.t;subtitle.textContent=x.sub}render();
</script></body></html>
