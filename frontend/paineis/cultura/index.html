<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Cultura</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
body{background:linear-gradient(145deg,#0b4b9b,#052f68 62%,#032553)}.culture-stage{min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,46%) minmax(0,54%);gap:clamp(24px,3vw,48px)}.culture-visual{position:relative;min-height:0;border-radius:clamp(24px,2.6vw,38px);overflow:hidden;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 35% 28%,rgba(105,207,242,.20),transparent 38%),rgba(255,255,255,.055)}.culture-image{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .75s var(--pv-ease),transform 8s ease}.culture-visual.has-image .culture-image{opacity:1;transform:scale(1.035)}.culture-visual:not(.has-image) .culture-image{opacity:0}.culture-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,28,68,.02),rgba(3,30,70,.68))}.art-fallback{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.art-fallback::before,.art-fallback::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.09)}.art-fallback::before{width:64%;aspect-ratio:1;animation:pvRing 26s linear infinite}.art-fallback::after{width:42%;aspect-ratio:1;animation:pvRing 18s linear infinite reverse}.art-fallback span{font-size:clamp(110px,12vw,200px);color:rgba(105,207,242,.30)}.culture-visual.has-image .art-fallback{display:none}.visual-caption{position:absolute;z-index:3;left:clamp(18px,2vw,28px);right:clamp(18px,2vw,28px);bottom:clamp(18px,2vw,28px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.visual-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:9px 12px;border-radius:999px;background:rgba(3,35,80,.74);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px)}.story{min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative;padding:clamp(8px,1vw,18px) 0}.story-kicker{display:flex;align-items:center;gap:10px;font-size:clamp(11px,.9vw,14px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pv-sky);margin-bottom:clamp(16px,2vh,24px)}.story-title{margin:0;font-size:clamp(46px,5.1vw,84px);line-height:.99;letter-spacing:-.055em;font-weight:650;text-wrap:balance}.story-text{margin:clamp(22px,3vh,34px) 0 0;font-size:clamp(17px,1.45vw,23px);line-height:1.58;color:rgba(247,251,255,.78);max-width:59ch;text-wrap:pretty}.story-meta{margin-top:clamp(24px,3vh,36px);display:flex;align-items:center;gap:14px}.page-count{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,251,255,.50);white-space:nowrap}.story-track{height:4px;flex:1;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.story-progress{height:100%;width:0;background:linear-gradient(90deg,var(--pv-sky),#fff)}.story-qr{display:flex;align-items:center;gap:10px;margin-top:20px;opacity:.88}.story-qr.hidden{display:none}.story-qr img{width:64px;height:64px;border-radius:10px;background:#fff}.story-qr-copy{font-size:11px;line-height:1.35;color:var(--pv-soft)}.story-qr-copy b{display:block;color:#fff;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}.culture-stage,.story-kicker,.story-title,.story-text,.story-meta,.story-qr{transition:opacity .62s var(--pv-ease),transform .62s var(--pv-ease),filter .62s var(--pv-ease)}.pv-shell.is-leaving .culture-stage{opacity:0;transform:translateY(12px) scale(.993);filter:blur(3px)}.pv-shell.is-entering .culture-stage{animation:pvEnterMedia .78s var(--pv-ease) both}@media (orientation:portrait),(max-aspect-ratio:4/5){.culture-stage{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,54%);gap:22px}.story{padding:0}.story-title{font-size:clamp(44px,8vw,72px)}.story-text{font-size:clamp(16px,2.6vw,21px);line-height:1.5}.visual-caption{bottom:16px}}@media (orientation:landscape) and (max-height:760px){.culture-stage{grid-template-columns:minmax(0,43%) minmax(0,57%);gap:30px}.story-title{font-size:clamp(38px,4.2vw,62px)}.story-text{font-size:15px;margin-top:16px;line-height:1.48}.story-meta{margin-top:18px}.story-qr{margin-top:12px}.story-qr img{width:52px;height:52px}}
</style></head><body><div class="pv-ambient" aria-hidden="true"></div><div class="pv-shell" id="shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">palette</span></div><div class="pv-title">Cultura</div></div><div class="pv-source"><span class="material-symbols-outlined">museum</span><span>Acervo aberto</span></div></header><main class="culture-stage"><section class="culture-visual" id="visual"><div class="art-fallback"><span class="material-symbols-outlined">gallery_thumbnail</span></div><img class="culture-image" id="image" alt=""><div class="visual-caption"><span class="visual-tag" id="category">Cultura brasileira</span></div></section><section class="story"><div class="story-kicker"><span class="material-symbols-outlined" id="storyIcon">auto_stories</span><span id="storyLabel">Descubra</span></div><h1 class="story-title" id="title">Arte, memória e identidade</h1><p class="story-text" id="text">Carregando conteúdo cultural...</p><div class="story-qr hidden" id="qr"><img id="qrImg" alt="QR Code"><div class="story-qr-copy"><b>Conheça mais</b><span>Abra o artigo completo no celular</span></div></div><div class="story-meta"><span class="page-count" id="pageCount">1 / 1</span><div class="story-track"><div class="story-progress" id="progress"></div></div></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const shell=document.getElementById('shell'),visual=document.getElementById('visual'),image=document.getElementById('image'),category=document.getElementById('category'),storyIcon=document.getElementById('storyIcon'),storyLabel=document.getElementById('storyLabel'),title=document.getElementById('title'),text=document.getElementById('text'),pageCount=document.getElementById('pageCount'),progress=document.getElementById('progress'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg');const PAGE_MS=26000;let pages=[],pageIndex=0,timer=null,stopProgress=null;const topics=[['Tarsila do Amaral','Arte brasileira'],['Candido Portinari','Arte brasileira'],['Aleijadinho','Arte brasileira'],['Anita Malfatti','Arte brasileira'],['Museu de Arte de São Paulo','Museus'],['Museu do Amanhã','Museus'],['Teatro Amazonas','Arquitetura'],['Oscar Niemeyer','Arquitetura'],['Bossa nova','Música'],['Samba','Música'],['Choro','Música'],['Cinema do Brasil','Cinema'],['Machado de Assis','Literatura'],['Clarice Lispector','Literatura'],['Semana de Arte Moderna','História da arte'],['Capoeira','Patrimônio cultural']];const fallback=[{title:'Arte que atravessa gerações',text:'A cultura brasileira reúne influências indígenas, africanas, europeias e de muitas outras comunidades. Essa mistura aparece na música, na arquitetura, na literatura, nas festas populares e nas artes visuais. Conhecer essas expressões ajuda a compreender como diferentes histórias se encontram e continuam transformando a identidade do país.',category:'Cultura brasileira',image:'',link:''},{title:'Museus preservam memória e ampliam repertórios',text:'Acervos públicos e privados conectam diferentes épocas e linguagens. Uma visita a um museu pode revelar objetos cotidianos, obras consagradas e histórias pouco conhecidas. O patrimônio cultural não é apenas aquilo que ficou no passado: ele também ajuda a formular novas perguntas sobre o presente.',category:'Patrimônio cultural',image:'',link:''}];function trim(t,max=860){t=PV.clean(t);return t.length>max?t.slice(0,max-1).replace(/\s+\S*$/,'')+'…':t}function splitText(t){const clean=trim(t);if(clean.length<330)return[clean];const sentences=clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean];const out=[];let part='';for(const s of sentences){if((part+s).length>360&&part){out.push(part.trim());part=s}else part+=s}if(part.trim())out.push(part.trim());return out.slice(0,3)}async function directData(){const titles=topics.map(x=>x[0]).join('|');const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1600&inprop=url&redirects=1&titles='+encodeURIComponent(titles);const data=await PV.fetchJSON(url);const map=new Map(topics.map(x=>[x[0].toLowerCase(),x[1]]));const list=Object.values(data?.query?.pages||{}).filter(p=>!p.missing).map(p=>({title:PV.clean(p.title),text:trim(p.extract),image:p.thumbnail?.source||'',link:p.fullurl||'',category:map.get(PV.clean(p.title).toLowerCase())||'Cultura brasileira'})).filter(x=>x.title&&x.text.length>100);return{items:list.length?list:fallback}}function setImage(url){image.onload=()=>visual.classList.add('has-image');image.onerror=()=>visual.classList.remove('has-image');if(url){image.src=url}else{image.removeAttribute('src');visual.classList.remove('has-image')}}function buildPages(item){const chunks=splitText(item.text);return chunks.map((chunk,i)=>({item,chunk,index:i,total:chunks.length}))}function renderPage(p){const item=p.item;category.textContent=item.category||'Cultura';title.textContent=item.title;setImage(item.image);text.textContent=p.chunk;pageCount.textContent=`${p.index+1} / ${p.total}`;storyLabel.textContent=p.index===0?'Conheça a história':'Continue a leitura';storyIcon.textContent=p.index===0?'palette':'auto_stories';if(item.link&&p.index===p.total-1){qrImg.src=PV.qrUrl(item.link);qr.classList.remove('hidden')}else qr.classList.add('hidden')}function schedule(){clearTimeout(timer);if(stopProgress)stopProgress();if(pages.length<=1){progress.style.width='100%';return}stopProgress=PV.startProgress(progress,PAGE_MS);timer=setTimeout(step,PAGE_MS)}async function step(){if(!pages.length)return;pageIndex=(pageIndex+1)%pages.length;await PV.transition(shell,async()=>renderPage(pages[pageIndex]));schedule()}async function load(){let items=fallback;try{const data=await PV.fromApi('/api/cultura',directData);if(Array.isArray(data.items)&&data.items.length)items=data.items}catch{}const item=PV.pickForRefresh(items,'cultura',x=>String(x.link||x.title));pages=buildPages(item||fallback[0]);pageIndex=0;renderPage(pages[0]);shell.classList.add('is-entering');schedule()}load();
</script></body></html>
