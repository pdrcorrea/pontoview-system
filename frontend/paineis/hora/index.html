<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Hora Exata</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
body{transition:background 1.2s ease}.clock-stage{min-height:0;display:grid;place-items:center;text-align:center}.clock-panel{display:flex;flex-direction:column;align-items:center;justify-content:center}.clock-icon{width:clamp(86px,8vw,126px);aspect-ratio:1;border-radius:36px;display:grid;place-items:center;margin-bottom:clamp(24px,3vh,38px);background:rgba(255,255,255,.07);border:1px solid var(--pv-line);position:relative;overflow:hidden}.clock-icon::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(105,207,242,.2),transparent 38%);animation:spin 8s linear infinite}.clock-icon span{font-size:clamp(48px,5vw,76px);color:var(--pv-sky);position:relative;z-index:1}.date{font-size:clamp(15px,1.45vw,23px);font-weight:650;letter-spacing:.17em;color:var(--pv-soft);text-transform:uppercase;margin-bottom:clamp(14px,2vh,24px)}.time{font-size:clamp(118px,18vw,248px);font-weight:300;line-height:.9;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.divider{width:clamp(80px,8vw,120px);height:4px;border-radius:99px;background:var(--pv-sky);margin:clamp(20px,3vh,34px) auto clamp(14px,2vh,22px)}.location{display:flex;align-items:center;gap:9px;font-size:clamp(13px,1.25vw,19px);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--pv-soft)}.location span:first-child{color:var(--pv-sky)}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.time{font-size:clamp(86px,25vw,150px)}.clock-icon{width:76px;border-radius:26px}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">schedule</span></div><div class="pv-title">Hora Exata</div></div></header><main class="clock-stage"><section class="clock-panel"><div class="clock-icon"><span class="material-symbols-outlined">schedule</span></div><div class="date" id="date">—</div><div class="time" id="time">--:--</div><div class="divider"></div><div class="location"><span class="material-symbols-outlined">location_on</span><span id="city">Localizando...</span></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const week=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'],months=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];const time=document.getElementById('time'),date=document.getElementById('date'),city=document.getElementById('city');function pad(n){return String(n).padStart(2,'0')}function tick(){const d=new Date();time.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;date.textContent=`${week[d.getDay()]}, ${pad(d.getDate())} DE ${months[d.getMonth()]}`;const h=d.getHours();document.body.style.background=h>=6&&h<12?'linear-gradient(145deg,#0b55ad,#08458f)':h>=12&&h<18?'linear-gradient(145deg,#084b9f,#063b80)':'linear-gradient(145deg,#063a7c,#03275b)'}async function locate(){try{const place=await PV.cached('hora-location',24*60*60*1000,async()=>{for(const url of ['https://ipwho.is/?lang=pt','https://ipapi.co/json/']){try{const d=await PV.fetchJSON(url);const c=d.city||d.cidade,r=d.region_code||d.region||d.state_code;if(c)return(c+(r?' · '+r:'')).toUpperCase()}catch{}}throw new Error('Localização indisponível')});city.textContent=place}catch{city.textContent='LOCAL NÃO IDENTIFICADO'}}tick();setInterval(tick,1000);locate();
</script></body></html>
