<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sustentabilidade • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#203129;--theme-muted:#607369;--theme-accent:#4f8f63;--theme-accent-2:#77aa86;--theme-soft:#bed8c4;--bg1:#f9fcfa;--bg2:#edf5ef;--bg3:#dfece2;--accent:#4f8f63}.stage{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:4vw;align-items:center}
.visual{display:grid;place-items:center}.icon-orbit{width:min(34vw,500px);aspect-ratio:1}.hero-icon{font-size:min(13vw,190px);color:var(--accent)}
.copy{padding-right:2vw}.copy h1{margin-top:24px;font-size:clamp(54px,6.5vw,110px);max-width:11ch}
.detail{margin:24px 0 0;max-width:42ch;font-size:clamp(18px,1.45vw,26px);font-weight:700;color:var(--muted);line-height:1.48}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);color:#417651;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:40% 60%;gap:0;padding-bottom:72px}.icon-orbit{width:min(62vw,390px)}.copy h1{font-size:clamp(48px,10.5vw,82px)}.detail{font-size:clamp(17px,3.9vw,25px)}}
</style></head><body><div class="app"><main class="stage"><section class="visual"><div class="icon-orbit"><span class="material-symbols-rounded hero-icon" id="icon"></span></div></section><section class="copy"><h1 id="title"></h1><p class="detail" id="detail"></p><div class="pill"><span class="material-symbols-rounded" style="font-size:18px" id="pillIcon"></span><span id="category"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script>
const items=[{"icon":"water_drop","category":"Água","title":"Feche a torneira enquanto não estiver usando.","detail":"Alguns segundos de atenção evitam desperdício sem exigir nenhum esforço extra."},{"icon":"lightbulb","category":"Energia","title":"Saiu do ambiente? Apague a luz.","detail":"Economizar energia começa em decisões pequenas e repetidas todos os dias."},{"icon":"recycling","category":"Resíduos","title":"Antes de descartar, veja se dá para reaproveitar.","detail":"Separar materiais corretamente facilita a reciclagem e reduz o volume de lixo."},{"icon":"local_drink","category":"Descartáveis","title":"Uma garrafa reutilizável pode evitar dezenas de copos.","detail":"Trocas simples no cotidiano diminuem o uso de materiais de vida muito curta."},{"icon":"shopping_bag","category":"Consumo","title":"Nem toda compra precisa ser imediata.","detail":"Perguntar “eu realmente preciso disso?” é uma das formas mais simples de consumir melhor."},{"icon":"eco","category":"Natureza","title":"Cuidar do entorno também conta.","detail":"Evite jogar resíduos no chão e preserve áreas verdes, mesmo as pequenas."}];
rotateItems(items,(x)=>{icon.textContent=x.icon;pillIcon.textContent=x.icon;category.textContent=x.category;title.textContent=x.title;detail.textContent=x.detail},10500);
</script></body></html>
