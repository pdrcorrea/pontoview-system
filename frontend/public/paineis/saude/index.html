<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Dicas de Saúde</title>
<style>
:root{--bg:#071724;--bg2:#0c2435;--sky:#69cff2;--text:#f5fbff;--soft:#b7c9d6;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071724;color:#f5fbff;font-family:Arial,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 18% 18%,rgba(105,207,242,.10),transparent 34%),linear-gradient(135deg,#071724,#0c2435)}
.shell{width:100%;height:100%;padding:4vh 4vw 3vh;display:flex;flex-direction:column}
.health{min-height:0;flex:1;display:flex;align-items:stretch;gap:3vw}
.visual{width:31%;min-width:220px;display:flex;align-items:center;justify-content:center}
.orb{width:25vw;height:25vw;max-width:360px;max-height:360px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.15),rgba(105,207,242,.08) 46%,rgba(255,255,255,.025) 70%);border:1px solid var(--line)}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
.orb:before{top:12%;right:12%;bottom:12%;left:12%}.orb:after{top:25%;right:25%;bottom:25%;left:25%}
.hero-svg{width:46%;height:46%;display:block;color:var(--sky)}
.tip{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;padding:3.4vw;border-radius:30px;background:rgba(255,255,255,.075);border:1px solid var(--line);position:relative;overflow:hidden}
.tip:after{content:"";position:absolute;right:-70px;bottom:-100px;width:260px;height:260px;border-radius:50%;border:22px solid rgba(105,207,242,.055)}
.kicker{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:2.4vh;position:relative;z-index:1}
.kicker svg{width:22px;height:22px;display:block}
.headline{font-size:5vw;max-font-size:78px;font-weight:650;line-height:1.05;letter-spacing:-.04em;position:relative;z-index:1}
.hint{margin-top:2.4vh;font-size:1.25vw;line-height:1.45;color:var(--soft);font-weight:500;max-width:900px;position:relative;z-index:1}
.footer{height:5vh;min-height:34px;display:flex;align-items:flex-end;font-size:13px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.58)}
@media (min-width:1500px){.headline{font-size:76px}.hint{font-size:20px}}
@media (orientation:portrait){.shell{padding:5vw}.health{flex-direction:column;gap:3vh}.visual{width:100%;height:34%;min-width:0}.orb{width:38vw;height:38vw;max-width:320px;max-height:320px}.tip{width:100%;padding:5vw}.headline{font-size:7.5vw}.hint{font-size:2.5vw}.kicker{font-size:16px}}
@media (max-height:600px) and (orientation:landscape){.shell{padding:3vh 3vw 2vh}.orb{width:33vh;height:33vh}.tip{padding:2.8vw}.headline{font-size:4.6vw}.hint{font-size:1.2vw}.footer{height:4vh}}
</style>
</head>
<body>
<div class="shell">
  <main class="health">
    <section class="visual">
      <div class="orb">
        <svg class="hero-svg" viewBox="0 0 120 120" aria-hidden="true"><path fill="currentColor" d="M60 8l36 14v28c0 27-15 48-36 62C39 98 24 77 24 50V22L60 8zm0 18a8 8 0 0 0-8 8v13H39a8 8 0 0 0 0 16h13v13a8 8 0 0 0 16 0V63h13a8 8 0 0 0 0-16H68V34a8 8 0 0 0-8-8z"/></svg>
      </div>
    </section>
    <section class="tip">
      <div class="kicker"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l8 3v6c0 6-3.5 10.2-8 13-4.5-2.8-8-7-8-13V5l8-3zm-1 5v3H8v4h3v3h4v-3h3v-4h-3V7h-4z"/></svg><span id="category">Bem-estar</span></div>
      <div class="headline" id="title">Cuide de você ao longo do dia.</div>
      <div class="hint" id="hint"></div>
    </section>
  </main>
  <footer class="footer">PontoView</footer>
</div>
<script>
(function(){
  var WORKER='https://saude.pedrhc258.workers.dev/api/health-tips';
  var local=[
    {category:'Hidratação',text:'Hidrate-se ao longo do dia. Pequenos goles com frequência ajudam a manter o hábito.',hint:'Deixe uma garrafa à vista e mantenha água acessível.'},
    {category:'Bem-estar',text:'Faça uma pausa rápida e respire com calma por alguns segundos.',hint:'Pausas curtas podem ajudar no conforto e na concentração.'},
    {category:'Movimento',text:'Se estiver sentado há muito tempo, levante e caminhe um pouco.',hint:'Movimentos curtos e alongamentos leves podem ajudar durante o dia.'},
    {category:'Higiene',text:'Higienize as mãos com atenção às palmas, dorso, dedos e unhas.',hint:'Sempre que possível, utilize água e sabão.'},
    {category:'Telas',text:'Descanse os olhos olhando para um ponto distante por alguns segundos.',hint:'Pequenas pausas ajudam a reduzir o desconforto diante de telas.'}
  ];
  var category=document.getElementById('category');
  var title=document.getElementById('title');
  var hint=document.getElementById('hint');

  function clean(value){return String(value==null?'':value).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');}
  function normalize(x){x=x||{};return{category:clean(x.category||x.categoria||'Saúde'),text:clean(x.text||x.title||x.titulo||''),hint:clean(x.hint||x.description||x.descricao||'')};}
  function indexFor(length){var d=new Date();var key=d.getFullYear()*400+(d.getMonth()+1)*31+d.getDate()+d.getHours();return length?key%length:0;}
  function render(item){item=normalize(item);category.innerHTML='';category.appendChild(document.createTextNode(item.category||'Saúde'));title.innerHTML='';title.appendChild(document.createTextNode(item.text||'Cuide de você ao longo do dia.'));hint.innerHTML='';if(item.hint){hint.appendChild(document.createTextNode(item.hint));hint.style.display='block';}else{hint.style.display='none';}}
  function choose(items){if(!items||!items.length)items=local;render(items[indexFor(items.length)]||local[0]);}
  function loadRemote(){
    if(!window.XMLHttpRequest){choose(local);return;}
    var xhr=new XMLHttpRequest();
    try{
      xhr.open('GET',WORKER,true);
      xhr.timeout=4500;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText);var remote=data instanceof Array?data:(data&&data.items instanceof Array?data.items:[]);choose(remote.length?local.concat(remote):local);}catch(e){choose(local);}}else{choose(local);}};
      xhr.onerror=function(){choose(local);};xhr.ontimeout=function(){choose(local);};xhr.send(null);
    }catch(e){choose(local);}
  }
  choose(local);
  loadRemote();
}());
</script>
</body>
</html>
