<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Dicas de Saúde</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.health{min-height:0;display:grid;grid-template-columns:minmax(0,31%) minmax(0,69%);gap:clamp(22px,3vw,46px)}.visual{display:grid;place-items:center}.orb{width:min(25vw,360px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.15),rgba(105,207,242,.08) 46%,rgba(255,255,255,.025) 70%);border:1px solid rgba(255,255,255,.1)}.orb::before,.orb::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.orb::before{inset:12%;animation:pvRing 22s linear infinite}.orb::after{inset:25%;animation:pvRing 16s linear infinite reverse}.hero-icon{font-size:clamp(100px,9vw,156px);color:var(--pv-sky);z-index:1;animation:float 4.8s ease-in-out infinite}.tip{min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,3.4vw,54px);border-radius:30px;background:rgba(255,255,255,.08);border:1px solid var(--pv-line);position:relative;overflow:hidden}.tip::after{content:"";position:absolute;right:-70px;bottom:-100px;width:260px;aspect-ratio:1;border-radius:50%;border:22px solid rgba(105,207,242,.06)}.kicker{display:flex;align-items:center;gap:10px;font-size:clamp(11px,.9vw,14px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pv-sky);margin-bottom:clamp(20px,2.4vh,30px);z-index:1}.headline{font-size:clamp(44px,4.9vw,78px);font-weight:650;line-height:1.05;letter-spacing:-.04em;text-wrap:balance;z-index:1}.hint{margin-top:clamp(20px,2.4vh,30px);font-size:clamp(15px,1.25vw,20px);line-height:1.45;color:var(--pv-soft);font-weight:500;max-width:900px;z-index:1}@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}.health{animation:healthIn .68s var(--pv-ease) both}@keyframes healthIn{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media(orientation:portrait),(max-aspect-ratio:4/5){.health{grid-template-columns:1fr;grid-template-rows:minmax(0,34%) minmax(0,66%);gap:22px}.orb{width:min(40vw,320px)}.headline{font-size:clamp(40px,7.5vw,68px)}}@media(orientation:landscape) and (max-height:760px){.health{grid-template-columns:minmax(0,29%) minmax(0,71%)}.orb{width:min(21vw,260px)}.hero-icon{font-size:98px}.tip{padding:26px 30px}.headline{font-size:clamp(36px,4vw,58px)}.hint{font-size:15px}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">health_and_safety</span></div><div class="pv-title">Dicas de Saúde</div></div></header><main class="health"><section class="visual"><div class="orb"><span class="material-symbols-outlined hero-icon" id="heroIcon">health_and_safety</span></div></section><section class="tip"><div class="kicker"><span class="material-symbols-outlined" id="tipIcon">health_and_safety</span><span id="category">Bem-estar</span></div><div class="headline" id="title">Cuide de você ao longo do dia.</div><div class="hint" id="hint"></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const WORKER='https://saude.pedrhc258.workers.dev/api/health-tips';const local=[{category:'Hidratação',icon:'water_drop',text:'Hidrate-se ao longo do dia. Pequenos goles com frequência ajudam a manter o hábito.',hint:'Deixe uma garrafa à vista e mantenha água acessível.'},{category:'Bem-estar',icon:'self_improvement',text:'Faça uma pausa rápida e respire com calma por alguns segundos.',hint:'Pausas curtas podem ajudar no conforto e na concentração.'},{category:'Movimento',icon:'directions_walk',text:'Se estiver sentado há muito tempo, levante e caminhe um pouco.',hint:'Movimentos curtos e alongamentos leves podem ajudar durante o dia.'},{category:'Higiene',icon:'wash',text:'Higienize as mãos com atenção às palmas, dorso, dedos e unhas.',hint:'Sempre que possível, utilize água e sabão.'},{category:'Telas',icon:'visibility',text:'Descanse os olhos olhando para um ponto distante por alguns segundos.',hint:'Pequenas pausas ajudam a reduzir o desconforto diante de telas.'}];const heroIcon=document.getElementById('heroIcon'),tipIcon=document.getElementById('tipIcon'),category=document.getElementById('category'),title=document.getElementById('title'),hint=document.getElementById('hint');function safe(x){return{category:PV.clean(x.category||x.categoria||'Saúde'),icon:PV.clean(x.icon||'health_and_safety'),text:PV.clean(x.text||x.title||x.titulo||''),hint:PV.clean(x.hint||x.description||x.descricao||'')}}function render(x){x=safe(x);heroIcon.textContent=x.icon;tipIcon.textContent=x.icon;category.textContent=x.category;title.textContent=x.text||'Cuide de você ao longo do dia.';hint.textContent=x.hint;hint.style.display=x.hint?'':'none'}async function fetchRemote(){return PV.fromApi('/api/saude',()=>PV.fetchJSON(WORKER))}async function load(){let items=[...local];try{const d=await fetchRemote();const r=Array.isArray(d)?d:Array.isArray(d.items)?d.items:[];if(r.length)items=[...local,...r.map(safe)]}catch{}render(PV.pickForRefresh(items,'saude',x=>x.text)||local[0])}load();
</script></body></html>
