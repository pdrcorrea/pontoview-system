<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dicas de Saúde • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#22322d;--theme-muted:#66766f;--theme-accent:#72a68c;--theme-accent-2:#92b8a3;--theme-soft:#bfd4c7;--bg1:#fbfcfa;--bg2:#f1f5f1;--bg3:#e7efe7;--accent:#72a68c}.stage{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:4vw;align-items:center}
.visual{display:grid;place-items:center}.icon-orbit{width:min(34vw,500px);aspect-ratio:1}.hero-icon{font-size:min(13vw,190px);color:var(--accent)}
.copy{padding-right:2vw}.copy h1{margin-top:24px;font-size:clamp(54px,6.5vw,110px);max-width:11ch}
.detail{margin:24px 0 0;max-width:42ch;font-size:clamp(18px,1.45vw,26px);font-weight:700;color:var(--muted);line-height:1.48}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.56);border:1px solid white;color:color-mix(in srgb,var(--accent) 72%,#1c3555);font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:40% 60%;gap:0;padding-bottom:72px}.icon-orbit{width:min(62vw,390px)}.copy h1{font-size:clamp(48px,10.5vw,82px)}.detail{font-size:clamp(17px,3.9vw,25px)}}
</style></head><body><div class="app"><main class="stage"><section class="visual"><div class="icon-orbit"><span class="material-symbols-rounded hero-icon" id="icon"></span></div></section><section class="copy"><h1 id="title"></h1><p class="detail" id="detail"></p><div class="pill"><span class="material-symbols-rounded" style="font-size:18px" id="pillIcon"></span><span id="category"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script>
const items=[{"icon":"water_drop","category":"Hidratação","title":"Água por perto facilita o hábito.","detail":"Deixe uma garrafa visível e beba pequenos goles ao longo do dia."},{"icon":"visibility","category":"Descanso visual","title":"Seus olhos também precisam de pausa.","detail":"A cada período diante de telas, olhe para um ponto distante por alguns segundos."},{"icon":"directions_walk","category":"Movimento","title":"Seu corpo gosta de pequenas pausas.","detail":"Se estiver sentado há muito tempo, levante, caminhe um pouco e mude de posição."},{"icon":"bedtime","category":"Sono","title":"Uma rotina previsível ajuda a desacelerar.","detail":"Tente manter horários semelhantes para dormir e acordar, inclusive nos dias mais tranquilos."},{"icon":"self_improvement","category":"Respiração","title":"Alguns segundos de calma já mudam o ritmo.","detail":"Inspire devagar, solte o ar com tranquilidade e perceba como o corpo responde."},{"icon":"restaurant","category":"Alimentação","title":"Comer com atenção também é cuidado.","detail":"Faça as refeições sem tanta pressa e observe sinais de fome e saciedade."}];
rotateItems(items,(x)=>{icon.textContent=x.icon;pillIcon.textContent=x.icon;category.textContent=x.category;title.textContent=x.title;detail.textContent=x.detail},10500);
</script></body></html>
