<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economia • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#23282c;--theme-muted:#6c7378;--theme-accent:#6c7a86;--theme-accent-2:#97a2ab;--theme-soft:#bcc5cc;--bg1:#fbfbfb;--bg2:#f1f3f4;--bg3:#e7eaec}
.stage{grid-template-rows:auto 1fr auto;gap:24px}.head{display:flex;justify-content:space-between;align-items:center}.updated{font-size:12px;font-weight:900;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.5vw,24px);align-items:stretch}
.metric{border-radius:clamp(24px,2.5vw,36px);padding:clamp(24px,2.4vw,40px);display:flex;flex-direction:column;justify-content:space-between;min-width:0}.metric.primary{grid-column:span 2}
.metric .label{font-size:clamp(12px,1vw,15px);font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.metric .value{font-size:clamp(46px,5vw,84px);font-weight:900;letter-spacing:-.065em;line-height:.9;margin-top:20px;font-variant-numeric:tabular-nums}.metric.primary .value{font-size:clamp(70px,7.5vw,128px)}
.metric .note{margin-top:18px;font-size:clamp(14px,1.1vw,18px);font-weight:800;color:var(--muted)}.up{color:#26895d!important}.down{color:#bd5d65!important}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800;font-size:12px}.source{display:flex;align-items:center;gap:8px}
@media(orientation:portrait){.stage{padding-bottom:70px}.board{grid-template-columns:repeat(2,1fr)}.metric.primary{grid-column:span 2}.metric .value{font-size:clamp(42px,9vw,70px)}.metric.primary .value{font-size:clamp(66px,14vw,112px)}}
</style></head><body><div class="app"><div class="boot"><div class="loader-card"><div class="loader-mark" aria-hidden="true"><svg viewBox="40 30 215 205"><circle class="core" cx="144.5" cy="136.5" r="47.5" fill="#aebbc5"/><g class="arcs" fill="#8f9ca6"><path d="M190 45 L188 48 L189 55 L208 68 L220 83 L226 98 L228 108 L233 111 L238 110 L242 105 L240 93 L238 90 L237 85 L227 67 L213 53 L204 47 L196 43 Z"/><path d="M55 144 L51 148 L52 163 L56 177 L65 194 L74 204 L89 215 L104 222 L109 221 L112 218 L113 215 L112 211 L107 207 L101 205 L91 199 L81 190 L73 179 L69 170 L66 158 L65 148 L63 145 L59 143 Z"/></g></svg></div><strong>Preparando Conteúdo</strong><div class="loader-bar"></div></div></div>
<main class="stage"><header class="head"><div class="kicker"><span class="material-symbols-rounded">monitoring</span><span>Economia agora</span></div><div class="updated" id="updated"></div></header>
<section class="board">
<article class="metric primary glass"><div><div class="label">Dólar comercial</div><div class="value" id="usd">--</div></div><div class="note" id="usdNote">Variação indisponível</div></article>
<article class="metric glass"><div><div class="label">Euro</div><div class="value" id="eur">--</div></div><div class="note" id="eurNote">Variação indisponível</div></article>
<article class="metric glass"><div><div class="label">Selic</div><div class="value" id="selic">--</div></div><div class="note">Taxa básica anual</div></article>
<article class="metric glass"><div><div class="label">IPCA</div><div class="value" id="ipca">--</div></div><div class="note">Inflação oficial</div></article>
<article class="metric glass"><div><div class="label">Bitcoin</div><div class="value" id="btc">--</div></div><div class="note" id="btcNote">Variação indisponível</div></article>
</section>
<footer class="foot"><div class="source"><span class="material-symbols-rounded">public</span><span>Dados públicos</span></div></footer></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script src="../shared/pv.js?v=8"></script><script>
const els={usd:document.getElementById('usd'),eur:document.getElementById('eur'),btc:document.getElementById('btc'),selic:document.getElementById('selic'),ipca:document.getElementById('ipca'),usdNote:document.getElementById('usdNote'),eurNote:document.getElementById('eurNote'),btcNote:document.getElementById('btcNote'),updated:document.getElementById('updated')};
function fmt(v,d=2){return Number.isFinite(Number(v))?PV.formatNumber(Number(v),d):'--'}
function setQuote(valueEl,noteEl,item,prefix='R$ ',digits=2){if(!item){valueEl.textContent='--';noteEl.textContent='Variação indisponível';noteEl.className='note';return}valueEl.textContent=prefix+fmt(item.value,digits);const c=Number(item.change);noteEl.className='note '+(c>0?'up':c<0?'down':'');noteEl.textContent=Number.isFinite(c)?`${c>0?'▲':c<0?'▼':'•'} ${Math.abs(c).toFixed(2).replace('.',',')}%`:'Variação indisponível'}
function latestRate(rates,key){return (rates||[]).find(x=>String(x.nome||x.name||'').toLowerCase().includes(key))}
async function directData(){const [qres,rres]=await Promise.allSettled([PV.fetchJSON('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL'),PV.fetchJSON('https://brasilapi.com.br/api/taxas/v1')]);const q=qres.status==='fulfilled'?qres.value:{};return{quotes:[q.USDBRL&&{code:'USD',value:Number(q.USDBRL.bid),change:Number(q.USDBRL.pctChange),updated:q.USDBRL.create_date},q.EURBRL&&{code:'EUR',value:Number(q.EURBRL.bid),change:Number(q.EURBRL.pctChange),updated:q.EURBRL.create_date},q.BTCBRL&&{code:'BTC',value:Number(q.BTCBRL.bid),change:Number(q.BTCBRL.pctChange),updated:q.BTCBRL.create_date}].filter(Boolean),rates:rres.status==='fulfilled'&&Array.isArray(rres.value)?rres.value:[]}}
async function load(){let data={quotes:[],rates:[]};try{data=await PV.fromApi('/api/economia',directData)}catch(e){try{data=await directData()}catch(_){}}const q=c=>(data.quotes||[]).find(x=>x.code===c);setQuote(els.usd,els.usdNote,q('USD'));setQuote(els.eur,els.eurNote,q('EUR'));setQuote(els.btc,els.btcNote,q('BTC'),'R$ ',0);const s=latestRate(data.rates,'selic'),i=latestRate(data.rates,'ipca');els.selic.textContent=s?fmt(s.valor!=null?s.valor:s.value,2)+'%':'--';els.ipca.textContent=i?fmt(i.valor!=null?i.valor:i.value,2)+'%':'--';const stamp=(q('USD')||q('EUR')||q('BTC')||{}).updated;if(stamp)els.updated.textContent='Atualizado '+String(stamp).slice(11,16);showLoader(350)}
load();
</script></body></html>
