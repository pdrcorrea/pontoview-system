<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Economia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css">
<style>
body{background:linear-gradient(145deg,#084b9e,#04336f 64%,#032658)}.market{min-height:0;display:grid;grid-template-columns:minmax(0,47%) minmax(0,53%);gap:clamp(28px,3.3vw,52px)}.hero-market{min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}.hero-symbol{width:clamp(76px,7vw,110px);height:clamp(76px,7vw,110px);border-radius:30px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-bottom:clamp(24px,3vh,38px);position:relative;overflow:hidden}.hero-symbol::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(105,207,242,.25),transparent 35%);animation:spinGlow 5s linear infinite}.hero-symbol span{position:relative;z-index:1;font-size:clamp(42px,4vw,64px);color:var(--pv-sky)}.market-label{font-size:clamp(11px,.9vw,14px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pv-sky);margin-bottom:12px}.market-value{font-size:clamp(62px,7vw,118px);font-weight:450;letter-spacing:-.065em;line-height:.9;font-variant-numeric:tabular-nums}.market-name{margin-top:20px;font-size:clamp(18px,1.5vw,24px);font-weight:600;color:var(--pv-soft)}.trend{margin-top:22px;display:inline-flex;align-items:center;gap:10px;width:max-content;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.12);font-size:clamp(13px,1.05vw,17px);font-weight:700}.trend .material-symbols-outlined{font-size:24px}.trend.up{color:#a9f4d8;border-color:rgba(85,226,169,.22);background:rgba(40,178,124,.10)}.trend.down{color:#ffc5c5;border-color:rgba(255,120,120,.22);background:rgba(203,66,66,.10)}.trend.up .material-symbols-outlined{animation:rise 1.8s ease-in-out infinite}.trend.down .material-symbols-outlined{animation:fall 1.8s ease-in-out infinite}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(13px,1.5vw,20px);align-content:center}.asset{position:relative;padding:clamp(18px,2vw,28px);border-radius:clamp(22px,2vw,30px);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);overflow:hidden;min-width:0}.asset-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(105,207,242,.10);margin-bottom:22px}.asset-icon span{font-size:28px;color:var(--pv-sky)}.asset-code{font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--pv-sky)}.asset-value{margin-top:8px;font-size:clamp(30px,3.4vw,56px);font-weight:650;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}.asset-note{margin-top:10px;font-size:clamp(12px,1vw,15px);color:var(--pv-soft);display:flex;align-items:center;gap:6px}.asset-note.up{color:#9ff0cf}.asset-note.down{color:#ffc2c2}.asset-note span{font-size:17px}.asset::after{content:"";position:absolute;right:-24px;bottom:-30px;width:100px;aspect-ratio:1;border-radius:50%;border:12px solid rgba(105,207,242,.05)}@keyframes spinGlow{to{transform:rotate(360deg)}}@keyframes rise{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}@keyframes fall{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px)}}.market{animation:marketIn .7s var(--pv-ease) both}@keyframes marketIn{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media (orientation:portrait),(max-aspect-ratio:4/5){.market{grid-template-columns:1fr;grid-template-rows:minmax(0,43%) minmax(0,57%);gap:24px}.hero-symbol{margin-bottom:20px}.market-value{font-size:clamp(68px,13vw,112px)}.market-grid{grid-template-columns:repeat(2,1fr)}}@media (orientation:landscape) and (max-height:760px){.market{gap:30px}.hero-symbol{width:66px;height:66px;border-radius:22px;margin-bottom:18px}.hero-symbol span{font-size:36px}.market-value{font-size:clamp(54px,6vw,88px)}.market-name{margin-top:12px}.trend{margin-top:14px}.asset{padding:16px}.asset-icon{width:38px;height:38px;margin-bottom:14px}.asset-value{font-size:clamp(26px,2.8vw,42px)}}
</style></head><body><div class="pv-ambient" aria-hidden="true"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">monitoring</span></div><div class="pv-title">Economia</div></div><div class="pv-source"><span class="material-symbols-outlined">sync</span><span id="updated">Dados públicos</span></div></header><main class="market"><section class="hero-market" id="hero"><div class="hero-symbol"><span class="material-symbols-outlined" id="heroIcon">attach_money</span></div><div class="market-label" id="heroLabel">Cotação</div><div class="market-value" id="heroValue">--</div><div class="market-name" id="heroName">Atualizando indicadores</div><div class="trend" id="heroTrend"><span class="material-symbols-outlined">remove</span><span>Sem variação</span></div></section><section class="market-grid"><article class="asset"><div class="asset-icon"><span class="material-symbols-outlined">attach_money</span></div><div class="asset-code">Dólar</div><div class="asset-value" id="usd">--</div><div class="asset-note" id="usdNote"><span class="material-symbols-outlined">remove</span><span>USD / BRL</span></div></article><article class="asset"><div class="asset-icon"><span class="material-symbols-outlined">euro</span></div><div class="asset-code">Euro</div><div class="asset-value" id="eur">--</div><div class="asset-note" id="eurNote"><span class="material-symbols-outlined">remove</span><span>EUR / BRL</span></div></article><article class="asset"><div class="asset-icon"><span class="material-symbols-outlined">account_balance</span></div><div class="asset-code">Selic</div><div class="asset-value" id="selic">--</div><div class="asset-note"><span class="material-symbols-outlined">percent</span><span>Taxa oficial</span></div></article><article class="asset"><div class="asset-icon"><span class="material-symbols-outlined">shopping_cart</span></div><div class="asset-code">IPCA</div><div class="asset-value" id="ipca">--</div><div class="asset-note"><span class="material-symbols-outlined">analytics</span><span>Inflação oficial</span></div></article></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const hero=document.getElementById('hero');const e={heroIcon:document.getElementById('heroIcon'),heroLabel:document.getElementById('heroLabel'),heroValue:document.getElementById('heroValue'),heroName:document.getElementById('heroName'),heroTrend:document.getElementById('heroTrend'),usd:document.getElementById('usd'),eur:document.getElementById('eur'),selic:document.getElementById('selic'),ipca:document.getElementById('ipca'),usdNote:document.getElementById('usdNote'),eurNote:document.getElementById('eurNote'),updated:document.getElementById('updated')};let data={quotes:[],rates:[]};const icons={USD:'attach_money',EUR:'euro',BTC:'currency_bitcoin'};function fmt(v,d=2){return Number.isFinite(Number(v))?PV.formatNumber(Number(v),d):'--'}function rateBy(name){return data.rates.find(x=>String(x.nome||x.name||'').toLowerCase().includes(name))}async function directData(){const [qres,rres]=await Promise.allSettled([PV.fetchJSON('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL'),PV.fetchJSON('https://brasilapi.com.br/api/taxas/v1')]);const q=qres.status==='fulfilled'?qres.value:{};const quotes=[q.USDBRL&&{code:'USD',label:'Dólar americano',value:Number(q.USDBRL.bid),change:Number(q.USDBRL.pctChange),updated:q.USDBRL.create_date},q.EURBRL&&{code:'EUR',label:'Euro',value:Number(q.EURBRL.bid),change:Number(q.EURBRL.pctChange),updated:q.EURBRL.create_date},q.BTCBRL&&{code:'BTC',label:'Bitcoin',value:Number(q.BTCBRL.bid),change:Number(q.BTCBRL.pctChange),updated:q.BTCBRL.create_date}].filter(Boolean);return{quotes,rates:rres.status==='fulfilled'&&Array.isArray(rres.value)?rres.value:[]}}function note(el,item){const c=Number(item?.change);const cls=c>0?'up':c<0?'down':'';const icon=c>0?'trending_up':c<0?'trending_down':'remove';el.className='asset-note '+cls;el.innerHTML=`<span class="material-symbols-outlined">${icon}</span><span>${Number.isFinite(c)?(c>=0?'+':'')+fmt(c,2)+'%':'Variação indisponível'}</span>`}function updateCards(){const usd=data.quotes.find(x=>x.code==='USD'),eur=data.quotes.find(x=>x.code==='EUR');e.usd.textContent=usd?'R$ '+fmt(usd.value,2):'--';e.eur.textContent=eur?'R$ '+fmt(eur.value,2):'--';note(e.usdNote,usd);note(e.eurNote,eur);const selic=rateBy('selic'),ipca=rateBy('ipca');e.selic.textContent=selic?fmt(selic.valor??selic.value,2)+'%':'--';e.ipca.textContent=ipca?fmt(ipca.valor??ipca.value,2)+'%':'--'}function renderHero(item){if(!item){e.heroValue.textContent='--';e.heroName.textContent='Novos dados em breve';return}const c=Number(item.change),cls=c>0?'up':c<0?'down':'';hero.className='hero-market '+cls;e.heroIcon.textContent=icons[item.code]||'monitoring';e.heroLabel.textContent=item.code==='BTC'?'Ativo digital':'Cotação';e.heroValue.textContent='R$ '+fmt(item.value,item.code==='BTC'?0:2);e.heroName.textContent=item.label;const icon=c>0?'trending_up':c<0?'trending_down':'remove';e.heroTrend.className='trend '+cls;e.heroTrend.innerHTML=`<span class="material-symbols-outlined">${icon}</span><span>${Number.isFinite(c)?(c>=0?'+':'')+fmt(c,2)+'% no período':'Variação indisponível'}</span>`;if(item.updated)e.updated.textContent='Atualizado '+item.updated.slice(11,16)}async function load(){try{data=await PV.fromApi('/api/economia',directData)}catch{data={quotes:[],rates:[]}}updateCards();const item=PV.pickForRefresh(data.quotes,'economia',x=>x.code);renderHero(item)}load();
</script></body></html>
