<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Orientações</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.orientation{min-height:0;display:grid;grid-template-columns:minmax(0,30%) minmax(0,70%);gap:clamp(24px,3.2vw,52px);animation:orientationIn .68s var(--pv-ease) both}.visual{display:grid;place-items:center}.orb{width:min(27vw,390px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.15),rgba(105,207,242,.08) 46%,rgba(255,255,255,.025) 70%);border:1px solid rgba(255,255,255,.1)}.orb::before,.orb::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07)}.orb::before{inset:12%;animation:pvRing 22s linear infinite}.orb::after{inset:25%;animation:pvRing 16s linear infinite reverse}.orb span{font-size:clamp(108px,11vw,176px);color:var(--pv-sky);animation:float 4.8s ease-in-out infinite}.message{min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,3.6vw,58px);border-radius:30px;background:rgba(255,255,255,.075);border:1px solid var(--pv-line);position:relative;overflow:hidden}.message::after{content:"";position:absolute;right:-80px;bottom:-110px;width:280px;aspect-ratio:1;border-radius:50%;border:24px solid rgba(105,207,242,.055)}.primary{font-size:clamp(52px,6vw,98px);font-weight:700;line-height:1.02;letter-spacing:-.045em;text-wrap:balance;position:relative;z-index:1}@keyframes float{50%{transform:translateY(-7px) rotate(-2deg)}}@keyframes orientationIn{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media(orientation:portrait),(max-aspect-ratio:4/5){.orientation{grid-template-columns:1fr;grid-template-rows:minmax(0,34%) minmax(0,66%);gap:22px}.orb{width:min(42vw,340px)}.primary{font-size:clamp(48px,8.8vw,82px)}}@media(orientation:landscape) and (max-height:760px){.orb{width:min(21vw,260px)}.orb span{font-size:104px}.message{padding:30px 36px}.primary{font-size:clamp(46px,5.4vw,78px)}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">info</span></div><div class="pv-title">Orientações</div></div></header><main class="orientation"><section class="visual"><div class="orb"><span class="material-symbols-outlined">info</span></div></section><section class="message"><div class="primary" id="message">Aguarde ser chamado</div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const items=['Respeite a ordem de atendimento','Aguarde ser chamado','Em caso de dúvidas, procure um atendente','Mantenha seus dados atualizados','Atenção aos avisos disponíveis neste ambiente','Mantenha o ambiente organizado','Respeite o espaço das outras pessoas','Evite falar ao celular em voz alta','Mantenha o volume do celular no modo silencioso','Colabore para um ambiente mais agradável','Seja gentil e paciente','Cuide de seus pertences pessoais','Atenção à sinalização do local','Em caso de emergência, siga as orientações da equipe','Mantenha as áreas de circulação livres','Higienize as mãos sempre que possível','Caso não se sinta bem, informe um responsável','Respeito é fundamental para uma boa convivência','Pequenas atitudes tornam o ambiente melhor','Sua compreensão é importante'];const message=document.getElementById('message');message.textContent=PV.pickForRefresh(items,'orientacoes',x=>x)||items[0];
</script></body></html>
