<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orientações • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#352823;--theme-muted:#75655d;--theme-accent:#b66e4f;--theme-accent-2:#cf8b6a;--theme-soft:#e7c3b1;--bg1:#fffaf8;--bg2:#f9f1ed;--bg3:#f1e2da;--accent:#b66e4f}.stage{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:4vw;align-items:center}
.visual{display:grid;place-items:center}.icon-orbit{width:min(34vw,500px);aspect-ratio:1}.hero-icon{font-size:min(13vw,190px);color:var(--accent)}
.copy{padding-right:2vw}.copy h1{margin-top:24px;font-size:clamp(54px,6.5vw,110px);max-width:11ch}
.detail{margin:24px 0 0;max-width:42ch;font-size:clamp(18px,1.45vw,26px);font-weight:700;color:var(--muted);line-height:1.48}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);color:#95593f;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:40% 60%;gap:0;padding-bottom:72px}.icon-orbit{width:min(62vw,390px)}.copy h1{font-size:clamp(48px,10.5vw,82px)}.detail{font-size:clamp(17px,3.9vw,25px)}}
</style></head><body><div class="app"><main class="stage"><section class="visual"><div class="icon-orbit"><span class="material-symbols-rounded hero-icon" id="icon"></span></div></section><section class="copy"><h1 id="title"></h1><p class="detail" id="detail"></p><div class="pill"><span class="material-symbols-rounded" style="font-size:18px" id="pillIcon"></span><span id="category"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script>
const items=[{"icon":"volume_off","category":"Convivência","title":"Um ambiente mais silencioso acolhe melhor.","detail":"Mantenha o celular no silencioso e evite chamadas em voz alta."},{"icon":"hourglass_top","category":"Atendimento","title":"Cada pessoa tem seu momento de ser chamada.","detail":"Aguarde a chamada e mantenha atenção aos avisos da equipe."},{"icon":"accessible_forward","category":"Circulação","title":"Caminhos livres ajudam todo mundo.","detail":"Evite deixar bolsas, carrinhos ou objetos nas áreas de passagem."},{"icon":"sentiment_satisfied","category":"Gentileza","title":"Pequenas atitudes deixam a espera mais leve.","detail":"Respeite o espaço das outras pessoas e trate a equipe com cordialidade."},{"icon":"medical_information","category":"Informação","title":"Se precisar, pergunte.","detail":"Em caso de dúvida sobre o atendimento, procure um profissional do local."},{"icon":"back_hand","category":"Cuidado","title":"Cuide dos seus pertences.","detail":"Mantenha itens pessoais por perto durante todo o período de espera."}];
rotateItems(items,(x)=>{icon.textContent=x.icon;pillIcon.textContent=x.icon;category.textContent=x.category;title.textContent=x.title;detail.textContent=x.detail},10500);
</script></body></html>
