<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Calendário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eee9e2;
  --bg2:#e3dbd1;
  --ink:#17191c;
  --muted:#48423c;
  --soft:#595148;
  --line:rgba(23,25,28,.21);
  --accent:#302e2b;
  --accent2:#5a5147;
  --today1:#333c46;
  --today2:#171f29;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Inter,"Nunito Sans","Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 20%,rgba(210,203,194,.20),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(194,186,175,.14),transparent 24%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
.scene{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:100svh;
  overflow:hidden;
  isolation:isolate;
}
.scene::before{
  content:"";
  position:absolute;
  width:clamp(120px,14vw,240px);
  aspect-ratio:1;
  right:clamp(-86px,-4vw,-34px);
  top:clamp(-74px,-4vw,-30px);
  border-radius:32%;
  background:linear-gradient(135deg,rgba(215,208,199,.46),rgba(242,239,234,.18));
  transform:rotate(18deg);
  filter:blur(3px);
  z-index:-1;
}
.scene::after{
  content:"";
  position:absolute;
  width:clamp(90px,9vw,155px);
  aspect-ratio:1;
  left:clamp(-52px,-3vw,-18px);
  bottom:clamp(-52px,-3vw,-18px);
  border-radius:50%;
  background:linear-gradient(135deg,rgba(219,211,202,.58),rgba(196,188,176,.22));
  filter:blur(2px);
  z-index:-1;
}
.brand{
  position:absolute;
  right:clamp(7px,.45vw,13px);
  top:50%;
  transform:translateY(-50%) rotate(90deg);
  transform-origin:right center;
  color:rgba(23,25,28,.31);
  font-size:clamp(7px,.58vw,11px);
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  user-select:none;
}
.layout{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  align-items:center;
  gap:clamp(28px,5vw,88px);
  padding:clamp(30px,4.8vw,86px);
}
.left{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
}
.year{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:clamp(12px,2vh,28px);
  font-size:clamp(11px,.95vw,18px);
  font-weight:800;
  letter-spacing:.16em;
  color:var(--accent);
}
.year::before{
  content:"";
  width:clamp(28px,2.8vw,50px);
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,rgba(142,132,120,.45),rgba(142,132,120,0));
}
.day{
  font-size:clamp(96px,15.5vw,255px);
  line-height:.72;
  letter-spacing:-.095em;
  font-weight:800;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.month{
  margin-top:clamp(10px,1.7vh,20px);
  font-size:clamp(40px,5.6vw,92px);
  line-height:.92;
  letter-spacing:-.06em;
  font-weight:800;
}
.weekday{
  margin-top:clamp(8px,1.4vh,16px);
  font-size:clamp(16px,1.5vw,28px);
  color:var(--muted);
  font-weight:650;
}
.season{
  margin-top:clamp(18px,2.5vh,34px);
  padding-top:clamp(12px,1.7vh,22px);
  border-top:1px solid var(--line);
  width:min(100%,500px);
  color:var(--soft);
  font-size:clamp(9px,.72vw,12px);
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.season strong{
  display:block;
  margin-top:5px;
  color:var(--ink);
  font-size:clamp(14px,1vw,20px);
  letter-spacing:0;
  text-transform:none;
  font-weight:700;
}
.right{
  min-width:0;
  width:100%;
  animation:fadeUp .85s .08s cubic-bezier(.2,.8,.2,1) both;
}
.calendar-wrap{position:relative;width:100%;padding:clamp(6px,.8vw,14px)}
.calendar{
  position:relative;
  width:100%;
  padding:clamp(16px,1.8vw,28px) clamp(14px,1.6vw,24px);
  border-radius:clamp(20px,2vw,28px);
  border:1px solid rgba(38,39,38,.25);
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(244,240,234,.94));
  box-shadow:0 18px 44px rgba(49,44,39,.14),inset 0 1px 0 rgba(255,255,255,.72);
  backdrop-filter:blur(7px);
}
.calendar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.25),transparent 24%),
    radial-gradient(circle at 84% 86%,rgba(243,239,233,.18),transparent 26%);
  pointer-events:none;
}
.cal-head{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  margin-bottom:clamp(12px,1.7vh,20px);
}
.cal-title{
  min-width:0;
  font-size:clamp(22px,2.25vw,42px);
  font-weight:800;
  letter-spacing:-.04em;
  white-space:nowrap;
}
.cal-sub{
  font-size:clamp(10px,.82vw,14px);
  color:var(--soft);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.11em;
  white-space:nowrap;
}
.weekdays,.grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:clamp(3px,.42vw,7px);
}
.weekdays{margin-bottom:clamp(5px,.8vh,9px)}
.weekdays div{
  text-align:center;
  color:var(--muted);
  font-size:clamp(10px,.8vw,14px);
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.cell{
  position:relative;
  min-width:0;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:clamp(8px,.9vw,14px);
  color:var(--ink);
  font-size:clamp(13px,1.12vw,22px);
  font-weight:750;
}
.cell.muted{color:rgba(23,25,28,.43)}
.cell.today{
  color:#fff;
  background:linear-gradient(145deg,var(--today1),var(--today2));
  box-shadow:0 8px 18px rgba(24,31,41,.24);
}
.cell.today::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:calc(clamp(8px,.9vw,14px) + 4px);
  border:2px solid rgba(24,31,41,.32);
}
.cell.event:not(.today)::after,
.cell.today.event::after{
  content:"";
  position:absolute;
  bottom:10%;
  width:clamp(4px,.4vw,6px);
  height:clamp(4px,.4vw,6px);
  border-radius:50%;
  background:var(--accent2);
}
.cell.today.event::after{background:#ffffff}
.next{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:clamp(12px,1.7vh,22px);
  padding-top:clamp(11px,1.5vh,20px);
  border-top:1px solid var(--line);
}
.next-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  flex:0 0 auto;
}
.next-copy{min-width:0}
.next-label{
  margin-bottom:3px;
  color:var(--soft);
  font-size:clamp(8px,.65vw,11px);
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.next-value{
  font-size:clamp(12px,.92vw,17px);
  line-height:1.3;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* TVs e monitores 16:9 menores */
@media (max-width:1100px), (max-height:650px){
  .layout{
    gap:clamp(18px,3.5vw,44px);
    padding:clamp(22px,3.4vw,46px);
  }
  .day{font-size:clamp(82px,13vw,170px)}
  .month{font-size:clamp(34px,4.6vw,62px)}
  .weekday{font-size:clamp(14px,1.35vw,20px)}
  .season{margin-top:16px;padding-top:12px}
  .calendar-wrap{padding:4px}
  .calendar{padding:14px 13px;border-radius:20px}
  .cal-title{font-size:clamp(20px,2.1vw,30px)}
  .cal-head{margin-bottom:10px}
  .weekdays,.grid{gap:3px}
  .cell{font-size:clamp(11px,1vw,16px);border-radius:8px}
  .next{margin-top:10px;padding-top:10px}
}

/* Telas horizontais com pouca altura: tudo precisa caber em uma única tela */
@media (orientation:landscape) and (max-height:520px){
  .layout{
    grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
    gap:20px;
    padding:16px 24px;
  }
  .year{margin-bottom:8px;font-size:10px}
  .year::before{width:26px}
  .day{font-size:clamp(72px,18vh,118px)}
  .month{margin-top:8px;font-size:clamp(30px,8vh,46px)}
  .weekday{margin-top:6px;font-size:14px}
  .season{margin-top:12px;padding-top:9px;font-size:8px}
  .season strong{margin-top:3px;font-size:13px}
  .calendar{padding:11px 12px;border-radius:17px}
  .cal-head{margin-bottom:7px}
  .cal-title{font-size:20px}
  .cal-sub{font-size:7px}
  .weekdays{margin-bottom:4px}
  .weekdays div{font-size:7px}
  .weekdays,.grid{gap:2px}
  .cell{font-size:11px;border-radius:6px}
  .next{margin-top:7px;padding-top:7px;gap:7px}
  .next-label{font-size:7px;margin-bottom:1px}
  .next-value{font-size:11px}
  .brand{font-size:7px}
}

/* Tablet/vertical: reorganiza por blocos e usa a altura disponível */
@media (max-aspect-ratio:4/5){
  .scene{overflow:hidden}
  .layout{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
    align-content:center;
    align-items:start;
    gap:clamp(14px,2.5vh,28px);
    padding:clamp(22px,5vw,48px);
  }
  .left{align-items:flex-start}
  .year{margin-bottom:10px}
  .day{font-size:clamp(88px,22vw,190px)}
  .month{font-size:clamp(38px,9vw,76px);margin-top:10px}
  .weekday{font-size:clamp(15px,3vw,23px);margin-top:7px}
  .season{
    display:flex;
    align-items:baseline;
    gap:10px;
    width:auto;
    margin-top:12px;
    padding-top:10px;
  }
  .season strong{display:inline;margin-top:0}
  .right{width:100%;min-height:0}
  .calendar-wrap{padding:0;width:100%}
  .calendar{padding:clamp(13px,3vw,22px)}
  .cal-title{font-size:clamp(22px,5vw,38px)}
  .cell{font-size:clamp(12px,2.7vw,23px)}
}

/* Celulares e players muito estreitos */
@media (max-width:600px){
  .layout{
    gap:12px;
    padding:18px;
  }
  .brand{display:none}
  .year{font-size:10px;margin-bottom:8px}
  .day{font-size:clamp(76px,24vw,130px)}
  .month{font-size:clamp(34px,10vw,56px);margin-top:8px}
  .weekday{font-size:14px}
  .season{font-size:8px;margin-top:10px;padding-top:8px}
  .season strong{font-size:13px}
  .calendar{padding:12px;border-radius:18px}
  .cal-head{margin-bottom:8px}
  .cal-title{font-size:clamp(20px,6vw,28px)}
  .cal-sub{display:none}
  .weekdays,.grid{gap:2px}
  .weekdays{margin-bottom:4px}
  .weekdays div{font-size:7px;letter-spacing:0}
  .cell{font-size:clamp(10px,3vw,15px);border-radius:7px}
  .next{margin-top:8px;padding-top:8px}
  .next-label{font-size:7px}
  .next-value{font-size:11px}
}

/* Última proteção para telas realmente pequenas em altura */
@media (max-width:600px) and (max-height:720px){
  .layout{padding:12px 16px;gap:8px}
  .day{font-size:72px}
  .month{font-size:31px;margin-top:6px}
  .weekday{font-size:12px;margin-top:5px}
  .season{margin-top:7px;padding-top:6px}
  .calendar{padding:9px 11px}
  .cal-title{font-size:18px}
  .cell{font-size:10px}
  .next{margin-top:6px;padding-top:6px}
}
</style>
</head>
<body>
<main class="scene">
  <div class="brand">PontoView</div>
  <section class="layout">
    <section class="left">
      <div class="year" id="year">----</div>
      <div class="day" id="day">--</div>
      <div class="month" id="month">mês</div>
      <div class="weekday" id="weekday">dia da semana</div>
      <div class="season">Estação <strong id="season">--</strong></div>
    </section>
    <section class="right">
      <div class="calendar-wrap">
        <div class="calendar">
          <div class="cal-head">
            <div class="cal-title" id="calTitle">Calendário</div>
            <div class="cal-sub">Calendário do mês</div>
          </div>
          <div class="weekdays">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>
          <div class="grid" id="calendar"></div>
          <div class="next">
            <div class="next-dot"></div>
            <div class="next-copy">
              <div class="next-label">Próxima data</div>
              <div class="next-value" id="nextEvent">Consultando calendário...</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </section>
</main>
<script src="../shared/pv.js?v=8"></script>
<script src="../shared/today-observances.js?v=1"></script>
<script>
const months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const weekdays=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
let panelData={holidays:[]};
let renderedDateKey='';
function pad(n){return String(n).padStart(2,'0')}
function localYMD(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function getSeason(d){
  const md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1221||md<=320)return 'Verão';
  if(md<=620)return 'Outono';
  if(md<=922)return 'Inverno';
  return 'Primavera';
}
function observancesForDate(date){
  return (window.PV_TODAY_OBSERVANCES&&typeof window.PV_TODAY_OBSERVANCES.forDate==='function')
    ? window.PV_TODAY_OBSERVANCES.forDate(date)
    : [];
}
function holidayForDate(date){
  const holidays=Array.isArray(panelData.holidays)?panelData.holidays:[];
  return holidays.find(item=>item.date===localYMD(date))||null;
}
function hasEvent(date){return Boolean(holidayForDate(date)||observancesForDate(date).length)}
function renderCalendar(now){
  const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate(),start=first.getDay();
  const grid=document.getElementById('calendar');
  grid.innerHTML='';
  for(let i=0;i<42;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    let d,currentMonth=true;
    if(i<start){d=prevDays-start+i+1;currentMonth=false;cell.classList.add('muted')}
    else if(i>=start+days){d=i-(start+days)+1;currentMonth=false;cell.classList.add('muted')}
    else d=i-start+1;
    cell.textContent=d;
    if(currentMonth){
      const date=new Date(y,m,d,12);
      if(d===now.getDate())cell.classList.add('today');
      if(hasEvent(date))cell.classList.add('event');
    }
    grid.appendChild(cell);
  }
}
function upcomingEvents(now){
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
  const candidates=[];
  const holidays=Array.isArray(panelData.holidays)?panelData.holidays:[];
  holidays.forEach(item=>{
    const date=new Date(item.date+'T12:00:00');
    if(date>=start)candidates.push({date,name:item.name,priority:0});
  });
  const items=(window.PV_TODAY_OBSERVANCES&&Array.isArray(window.PV_TODAY_OBSERVANCES.items))
    ? window.PV_TODAY_OBSERVANCES.items : [];
  [now.getFullYear(),now.getFullYear()+1].forEach(year=>{
    items.forEach(item=>{
      const date=new Date(year,item.month-1,item.day,12);
      if(date>=start)candidates.push({date,name:item.name,priority:1});
    });
  });
  return candidates.sort((a,b)=>a.date-b.date||a.priority-b.priority);
}
function render(now=new Date()){
  const month=months[now.getMonth()];
  document.getElementById('year').textContent=now.getFullYear();
  document.getElementById('day').textContent=pad(now.getDate());
  document.getElementById('month').textContent=month;
  document.getElementById('weekday').textContent=weekdays[now.getDay()];
  document.getElementById('season').textContent=getSeason(now);
  document.getElementById('calTitle').textContent=month.charAt(0).toUpperCase()+month.slice(1)+' '+now.getFullYear();
  const next=upcomingEvents(now)[0];
  document.getElementById('nextEvent').textContent=next
    ? `${pad(next.date.getDate())} ${months[next.date.getMonth()].slice(0,3)} • ${next.name}`
    : 'Nenhuma próxima data cadastrada';
  renderCalendar(now);
  renderedDateKey=localYMD(now);
}
async function directData(){
  const year=new Date().getFullYear();
  let holidays=[];
  try{holidays=await PV.fetchJSON(`https://brasilapi.com.br/api/feriados/v1/${year}`)}catch{}
  return {holidays:Array.isArray(holidays)?holidays:[]};
}
async function load(){
  try{panelData=await PV.fromApi('/api/hoje',directData)}catch{panelData={holidays:[]}}
  if(!panelData||!Array.isArray(panelData.holidays))panelData={holidays:[]};
  render(new Date());
}
load();
setInterval(()=>{
  const now=new Date();
  if(localYMD(now)!==renderedDateKey)load();
},60000);
</script>
</body>
</html>
