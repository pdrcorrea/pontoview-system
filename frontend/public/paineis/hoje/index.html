<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Calendário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;
  --bg2:#f2eee8;
  --ink:#17191c;
  --muted:#746f68;
  --soft:#9a9389;
  --line:rgba(23,25,28,.09);
  --accent:#5c5851;
  --accent2:#898176;
  --today1:#5f5a53;
  --today2:#373a38;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Inter,"Nunito Sans","Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 20%,rgba(210,203,194,.20),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(194,186,175,.14),transparent 24%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
.scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  isolation:isolate;
}
.scene::before{
  content:"";
  position:absolute;
  width:clamp(160px,14vw,240px);
  aspect-ratio:1;
  right:clamp(-86px,-4vw,-34px);
  top:clamp(-74px,-4vw,-30px);
  border-radius:32%;
  background:linear-gradient(135deg,rgba(215,208,199,.46),rgba(242,239,234,.18));
  transform:rotate(18deg);
  filter:blur(3px);
  z-index:-1;
}
.scene::after{
  content:"";
  position:absolute;
  width:clamp(105px,9vw,155px);
  aspect-ratio:1;
  left:clamp(-52px,-3vw,-18px);
  bottom:clamp(-52px,-3vw,-18px);
  border-radius:50%;
  background:linear-gradient(135deg,rgba(219,211,202,.58),rgba(196,188,176,.22));
  filter:blur(2px);
  z-index:-1;
}
.brand{
  position:absolute;
  right:clamp(8px,.45vw,13px);
  top:50%;
  transform:translateY(-50%) rotate(90deg);
  transform-origin:right center;
  color:rgba(23,25,28,.15);
  font-size:clamp(8px,.58vw,11px);
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  user-select:none;
}
.layout{
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(430px,.92fr);
  align-items:center;
  gap:clamp(42px,5.5vw,90px);
  padding:clamp(42px,5.3vw,92px);
}
.left{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
}
.year{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:clamp(18px,2.2vh,30px);
  font-size:clamp(13px,.98vw,18px);
  font-weight:850;
  letter-spacing:.16em;
  color:var(--accent);
}
.year::before{
  content:"";
  width:clamp(36px,2.8vw,50px);
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,rgba(142,132,120,.45),rgba(142,132,120,0));
}
.day{
  font-size:clamp(145px,17vw,275px);
  line-height:.72;
  letter-spacing:-.095em;
  font-weight:850;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.month{
  margin-top:clamp(16px,2vh,22px);
  font-size:clamp(58px,6.2vw,100px);
  line-height:.92;
  letter-spacing:-.06em;
  font-weight:780;
}
.weekday{
  margin-top:clamp(12px,1.6vh,18px);
  font-size:clamp(21px,1.65vw,29px);
  color:var(--muted);
  font-weight:560;
}
.season{
  margin-top:clamp(26px,3vh,38px);
  padding-top:clamp(18px,2vh,24px);
  border-top:1px solid var(--line);
  width:min(100%,540px);
  color:var(--soft);
  font-size:clamp(11px,.8vw,13px);
  font-weight:820;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.season strong{
  display:block;
  margin-top:6px;
  color:var(--ink);
  font-size:clamp(17px,1.15vw,21px);
  letter-spacing:0;
  text-transform:none;
  font-weight:680;
}
.right{
  min-width:0;
  animation:fadeUp .85s .08s cubic-bezier(.2,.8,.2,1) both;
}
.calendar-wrap{position:relative;padding:clamp(14px,1.2vw,18px)}
.calendar{
  position:relative;
  padding:clamp(20px,2vw,30px) clamp(18px,1.8vw,28px);
  border-radius:28px;
  border:1px solid rgba(23,25,28,.045);
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.14));
  box-shadow:0 8px 24px rgba(58,54,48,.035),inset 0 1px 0 rgba(255,255,255,.30);
  backdrop-filter:blur(7px);
}
.calendar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:28px;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.25),transparent 24%),
    radial-gradient(circle at 84% 86%,rgba(243,239,233,.18),transparent 26%);
  pointer-events:none;
}
.cal-head{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  margin-bottom:clamp(16px,2vh,22px);
}
.cal-title{font-size:clamp(30px,2.4vw,44px);font-weight:770;letter-spacing:-.04em}
.cal-sub{
  font-size:clamp(10px,.74vw,12px);
  color:var(--soft);
  text-transform:uppercase;
  font-weight:820;
  letter-spacing:.12em;
  white-space:nowrap;
}
.weekdays,.grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:clamp(5px,.48vw,8px);
}
.weekdays{margin-bottom:10px}
.weekdays div{
  text-align:center;
  color:var(--muted);
  font-size:clamp(9px,.65vw,11px);
  font-weight:820;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.cell{
  position:relative;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:var(--ink);
  font-size:clamp(16px,1.14vw,20px);
  font-weight:680;
}
.cell.muted{color:rgba(23,25,28,.17)}
.cell.today{
  color:#fff;
  background:linear-gradient(145deg,var(--today1),var(--today2));
  box-shadow:0 8px 16px rgba(56,53,49,.11);
}
.cell.today::before{
  content:"";
  position:absolute;
  inset:-5px;
  border-radius:18px;
  border:1px solid rgba(122,113,102,.12);
}
.cell.event:not(.today)::after{
  content:"";
  position:absolute;
  bottom:11%;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--accent2);
}
.cell.today.event::after{
  content:"";
  position:absolute;
  bottom:11%;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#e9e2d9;
}
.next{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:clamp(18px,2.2vh,24px);
  padding-top:clamp(16px,2vh,22px);
  border-top:1px solid var(--line);
}
.next-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  flex:0 0 auto;
}
.next-copy{min-width:0}
.next-label{
  margin-bottom:4px;
  color:var(--soft);
  font-size:clamp(10px,.72vw,12px);
  font-weight:820;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.next-value{
  font-size:clamp(15px,1vw,18px);
  line-height:1.35;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-aspect-ratio:4/5){
  .layout{
    grid-template-columns:1fr;
    grid-template-rows:auto auto;
    gap:clamp(26px,4vh,48px);
    padding:clamp(34px,7vw,68px);
    align-content:center;
  }
  .right{width:min(100%,760px);justify-self:center}
  .day{font-size:clamp(158px,29vw,320px)}
  .month{font-size:clamp(64px,10.5vw,116px)}
  .cell{font-size:clamp(20px,3vw,30px)}
}
@media (max-width:720px){
  .layout{padding:22px;gap:22px}
  .calendar{padding:18px}
  .cal-sub{display:none}
}
</style>
</head>
<body>
<main class="scene">
  <div class="brand">PontoView</div>

  <section class="layout">
    <section class="left">
      <div class="year" id="year">----</div>
      <div class="day" id="day">--</div>
      <div class="month" id="month">mês</div>
      <div class="weekday" id="weekday">dia da semana</div>

      <div class="season">
        Estação
        <strong id="season">--</strong>
      </div>
    </section>

    <section class="right">
      <div class="calendar-wrap">
        <div class="calendar">
          <div class="cal-head">
            <div class="cal-title" id="calTitle">Calendário</div>
            <div class="cal-sub">Calendário do mês</div>
          </div>

          <div class="weekdays">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>

          <div class="grid" id="calendar"></div>

          <div class="next">
            <div class="next-dot"></div>
            <div class="next-copy">
              <div class="next-label">Próxima data</div>
              <div class="next-value" id="nextEvent">Consultando calendário...</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </section>
</main>

<script src="../shared/pv.js?v=8"></script>
<script src="../shared/today-observances.js?v=1"></script>
<script>
const months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const weekdays=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
let panelData={holidays:[]};
let renderedDateKey='';

function pad(n){return String(n).padStart(2,'0')}
function localYMD(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function titleCase(text){return text ? text.charAt(0).toUpperCase()+text.slice(1) : text}

function getSeason(d){
  const md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1221||md<=320)return 'Verão';
  if(md<=620)return 'Outono';
  if(md<=922)return 'Inverno';
  return 'Primavera';
}

function observancesForDate(date){
  return (window.PV_TODAY_OBSERVANCES&&typeof window.PV_TODAY_OBSERVANCES.forDate==='function')
    ? window.PV_TODAY_OBSERVANCES.forDate(date)
    : [];
}

function holidayForDate(date){
  const key=localYMD(date);
  const holidays=Array.isArray(panelData.holidays)?panelData.holidays:[];
  return holidays.find(item=>item.date===key)||null;
}

function hasEvent(date){
  return Boolean(holidayForDate(date)||observancesForDate(date).length);
}

function renderCalendar(now){
  const y=now.getFullYear();
  const m=now.getMonth();
  const first=new Date(y,m,1);
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const start=first.getDay();
  const grid=document.getElementById('calendar');
  grid.innerHTML='';

  for(let i=0;i<42;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    let d;
    let currentMonth=true;

    if(i<start){
      d=prevDays-start+i+1;
      currentMonth=false;
      cell.classList.add('muted');
    }else if(i>=start+days){
      d=i-(start+days)+1;
      currentMonth=false;
      cell.classList.add('muted');
    }else{
      d=i-start+1;
    }

    cell.textContent=d;

    if(currentMonth){
      const date=new Date(y,m,d,12);
      if(d===now.getDate())cell.classList.add('today');
      if(hasEvent(date))cell.classList.add('event');
    }

    grid.appendChild(cell);
  }
}

function upcomingEvents(now){
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
  const candidates=[];
  const holidays=Array.isArray(panelData.holidays)?panelData.holidays:[];

  for(const holiday of holidays){
    if(!holiday||!holiday.date)continue;
    const date=new Date(`${holiday.date}T12:00:00`);
    if(Number.isNaN(date.getTime())||date<start)continue;
    candidates.push({date,name:holiday.name||'Feriado nacional',priority:0});
  }

  const items=window.PV_TODAY_OBSERVANCES?.items||[];
  for(const item of items){
    let date=new Date(now.getFullYear(),item.month-1,item.day,12);
    if(date<start)date=new Date(now.getFullYear()+1,item.month-1,item.day,12);
    candidates.push({date,name:item.name,priority:1});
  }

  return candidates.sort((a,b)=>{
    const diff=a.date-b.date;
    return diff!==0?diff:a.priority-b.priority;
  });
}

function renderNextEvent(now){
  const next=upcomingEvents(now)[0];
  const el=document.getElementById('nextEvent');
  if(!next){
    el.textContent='Nenhuma data em destaque encontrada';
    return;
  }
  const label=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(next.date).replace('.','');
  el.textContent=`${label} • ${next.name}`;
}

function render(now=new Date()){
  const month=months[now.getMonth()];
  document.getElementById('year').textContent=now.getFullYear();
  document.getElementById('day').textContent=pad(now.getDate());
  document.getElementById('month').textContent=month;
  document.getElementById('weekday').textContent=weekdays[now.getDay()];
  document.getElementById('season').textContent=getSeason(now);
  document.getElementById('calTitle').textContent=`${titleCase(month)} ${now.getFullYear()}`;
  renderCalendar(now);
  renderNextEvent(now);
  renderedDateKey=localYMD(now);
}

async function directData(){
  const year=new Date().getFullYear();
  let holidays=[];
  try{
    holidays=await PV.fetchJSON(`https://brasilapi.com.br/api/feriados/v1/${year}`);
  }catch{}
  return{holidays:Array.isArray(holidays)?holidays:[]};
}

async function load(){
  try{
    panelData=await PV.fromApi('/api/hoje',directData);
  }catch{
    panelData=await directData();
  }
  if(!panelData||!Array.isArray(panelData.holidays))panelData={holidays:[]};
  render(new Date());
}

load();

setInterval(()=>{
  const now=new Date();
  if(localYMD(now)!==renderedDateKey)load();
},60000);
</script>
</body>
</html>
