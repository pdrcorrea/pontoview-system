<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cultura • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#342835;--theme-muted:#77677b;--theme-accent:#9a6b86;--theme-accent-2:#b98aa4;--theme-soft:#d8bfd0;--bg1:#fcfafc;--bg2:#f4eef3;--bg3:#eadfe8;--blue:#9a6b86;--cyan:#d8bfd0}
.stage{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:4vw;align-items:center}.copy{transition:opacity .34s ease,transform .34s ease}.copy.changing{opacity:0;transform:translateY(8px)}
.poster{height:min(78vh,740px);border-radius:clamp(28px,3vw,44px);position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(154,107,134,.12),rgba(255,255,255,.55));display:grid;place-items:center}
.poster:before,.poster:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(154,107,134,.16)}.poster:before{width:75%;aspect-ratio:1}.poster:after{width:48%;aspect-ratio:1}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}.poster.has-image img{opacity:1}.poster.has-image:after{content:"";position:absolute;inset:0;width:auto;aspect-ratio:auto;border:0;border-radius:0;background:linear-gradient(180deg,rgba(45,30,43,.02),rgba(45,30,43,.28))}
.poster-icon{font-size:min(20vw,280px);color:rgba(154,107,134,.24);animation:float 6s ease-in-out infinite}.poster.has-image .poster-icon{opacity:0}
.copy h1{font-size:clamp(50px,5.6vw,96px);margin-top:18px;max-width:10ch}.copy p{font-size:clamp(18px,1.45vw,25px);max-width:44ch;margin:24px 0 0;font-weight:700}
.meta{display:flex;align-items:center;gap:11px;margin-top:28px;font-weight:900;color:#9a6b86}.meta .material-symbols-rounded{font-size:22px}.page{margin-left:auto;color:var(--muted)}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:44% 56%;gap:22px;padding-bottom:72px}.poster{height:100%}.copy h1{font-size:clamp(44px,9vw,74px)}.copy p{font-size:clamp(16px,3.6vw,22px)}}
</style></head><body><div class="app"><div class="boot"><div class="loader-card"><div class="loader-mark" aria-hidden="true"><svg viewBox="40 30 215 205"><circle class="core" cx="144.5" cy="136.5" r="47.5" fill="#aebbc5"/><g class="arcs" fill="#8f9ca6"><path d="M190 45 L188 48 L189 55 L208 68 L220 83 L226 98 L228 108 L233 111 L238 110 L242 105 L240 93 L238 90 L237 85 L227 67 L213 53 L204 47 L196 43 Z"/><path d="M55 144 L51 148 L52 163 L56 177 L65 194 L74 204 L89 215 L104 222 L109 221 L112 218 L113 215 L112 211 L107 207 L101 205 L91 199 L81 190 L73 179 L69 170 L66 158 L65 148 L63 145 L59 143 Z"/></g></svg></div><strong>Preparando Conteúdo</strong><div class="loader-bar"></div></div></div>
<main class="stage"><section class="poster glass" id="poster"><img id="image" alt=""><span class="material-symbols-rounded poster-icon" id="icon">palette</span></section><section class="copy" id="copy"><div class="kicker"><span class="material-symbols-rounded">palette</span><span id="category"></span></div><h1 id="title"></h1><p class="body" id="text"></p><div class="meta"><span class="material-symbols-rounded">auto_stories</span><span id="why"></span><span class="page" id="page"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script src="../shared/pv.js?v=8"></script><script>
const poster=document.getElementById('poster'),image=document.getElementById('image'),icon=document.getElementById('icon'),copy=document.getElementById('copy'),category=document.getElementById('category'),title=document.getElementById('title'),text=document.getElementById('text'),why=document.getElementById('why'),page=document.getElementById('page');
const topics=[['Tarsila do Amaral','Arte brasileira','brush'],['Candido Portinari','Arte brasileira','brush'],['Chiquinha Gonzaga','Música','piano'],['Pixinguinha','Música brasileira','library_music'],['Teatro Amazonas','Patrimônio','theater_comedy'],['Oscar Niemeyer','Arquitetura','architecture'],['Machado de Assis','Literatura','menu_book'],['Semana de Arte Moderna','História da arte','palette']];
const fallback=[{title:'Tarsila ajudou a inventar um Brasil em cores',text:'As formas simplificadas e as cores intensas de Tarsila do Amaral criaram uma imagem do país que ainda parece moderna. Abaporu virou um dos símbolos do modernismo brasileiro.',category:'Arte brasileira',icon:'brush',why:'Uma obra pode mudar a forma como um país se enxerga.',image:''},{title:'O choro nasceu antes do samba gravado',text:'Surgido no Rio de Janeiro no século XIX, o choro combinou flauta, cavaquinho e violões em melodias cheias de improviso. Pixinguinha ajudou a transformar essa linguagem em referência nacional.',category:'Música brasileira',icon:'library_music',why:'Tradição também pode ser invenção.',image:''}];
let items=[],itemIndex=0,pages=[],pageIndex=0,timer=null;const PAGE_MS=15000;
function clean(t){return PV.clean(t||'').replace(/\s+/g,' ').trim()}
function splitText(t){const s=clean(t).match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean(t)];const out=[];let p='';for(const x of s){if((p+x).length>340&&p){out.push(p.trim());p=x}else p+=x}if(p.trim())out.push(p.trim());return out.slice(0,3)}
function setImage(item){category.textContent=item.category||'Cultura';icon.textContent=item.icon||'palette';image.onload=()=>poster.classList.add('has-image');image.onerror=()=>poster.classList.remove('has-image');if(item.image){image.src=item.image}else{image.removeAttribute('src');poster.classList.remove('has-image')}}
function setItem(index){itemIndex=index%items.length;const item=items[itemIndex];pages=splitText(item.text);pageIndex=0;setImage(item);renderPage(false)}
function renderPage(animate=true){const item=items[itemIndex],doRender=()=>{title.textContent=item.title;text.textContent=pages[pageIndex]||item.text;why.textContent=item.why||'Conheça um pouco mais desta história.';page.textContent=(pageIndex+1)+' / '+pages.length};if(!animate){doRender();return}copy.classList.add('changing');setTimeout(()=>{doRender();copy.classList.remove('changing')},230)}
function step(){if(pageIndex<pages.length-1){pageIndex++;renderPage(true)}else{setItem((itemIndex+1)%items.length)}timer=setTimeout(step,PAGE_MS)}
async function directData(){const titles=topics.map(x=>x[0]).join('|');const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1600&inprop=url&redirects=1&titles='+encodeURIComponent(titles);const data=await PV.fetchJSON(url),pages=data&&data.query&&data.query.pages?Object.values(data.query.pages):[];return pages.filter(p=>!p.missing).map(p=>{const meta=topics.find(x=>clean(x[0]).toLowerCase()===clean(p.title).toLowerCase())||['','Cultura','palette'];return{title:clean(p.title),text:clean(p.extract),image:p.thumbnail&&p.thumbnail.source||'',category:meta[1],icon:meta[2],why:'Uma história que ajuda a ampliar o repertório.'}}).filter(x=>x.title&&x.text.length>120)}
async function load(){try{const data=await PV.fromApi('/api/cultura',async()=>({items:await directData()}));items=Array.isArray(data.items)&&data.items.length?data.items:fallback}catch(e){try{items=await directData()}catch(_){items=fallback}}if(!items.length)items=fallback;setItem(0);showLoader(350);timer=setTimeout(step,PAGE_MS)}
load();
</script></body></html>
