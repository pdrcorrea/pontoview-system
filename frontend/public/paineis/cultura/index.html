.stage{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(24px,4vw,68px);align-items:center;min-height:100dvh}.poster{height:min(78vh,740px);min-height:0;aspect-ratio:4/5;border-radius:clamp(26px,3vw,44px);position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(154,107,134,.12),rgba(255,255,255,.55));display:grid;place-items:center}.poster:before,.poster:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(154,107,134,.16)}.poster:before{width:75%;aspect-ratio:1}.poster:after{width:48%;aspect-ratio:1}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease}.poster.has-image img{opacity:1}.poster.has-image:after{content:"";position:absolute;inset:0;width:auto;aspect-ratio:auto;border:0;border-radius:0;background:linear-gradient(180deg,rgba(45,30,43,.02),rgba(45,30,43,.28))}.poster-icon{font-size:min(18vw,260px);color:rgba(154,107,134,.24)}.poster.has-image .poster-icon{opacity:0}.copy{min-width:0}.copy h1{font-size:clamp(42px,4.9vw,88px);line-height:.96;margin-top:18px;max-width:11ch;letter-spacing:-.045em;text-wrap:balance}.copy p{font-size:clamp(16px,1.28vw,23px);line-height:1.48;max-width:44ch;margin:22px 0 0;font-weight:700}.meta{display:flex;align-items:center;gap:10px;margin-top:clamp(20px,2.2vw,28px);font-weight:900;color:#9a6b86;font-size:clamp(12px,.95vw,15px)}.meta .material-symbols-rounded{font-size:1.45em}
@media(max-width:1180px),(max-height:700px){.stage{gap:clamp(18px,3vw,38px)}.poster{height:min(72vh,620px);border-radius:28px}.copy h1{font-size:clamp(36px,4.5vw,68px);margin-top:14px}.copy p{font-size:clamp(14px,1.2vw,19px);margin-top:18px}.meta{margin-top:18px}.kicker{font-size:clamp(11px,.9vw,13px)}}

const poster=document.getElementById('poster'),image=document.getElementById('image'),icon=document.getElementById('icon'),category=document.getElementById('category'),title=document.getElementById('title'),text=document.getElementById('text'),why=document.getElementById('why');
const items=[{"id":"tarsila-abaporu","category":"Arte brasileira","icon":"brush","wiki":"Abaporu","title":"Abaporu ajudou a dar forma a uma ideia de Brasil moderno.","text":"Tarsila do Amaral pintou Abaporu em 1928. A figura de proporções inesperadas inspirou o movimento antropofágico, que defendia absorver influências estrangeiras e transformá-las em uma linguagem artística brasileira.","why":"Arte brasileira"},{"id":"portinari-guerra-paz","category":"Arte brasileira","icon":"gallery_thumbnail","wiki":"Guerra e Paz (Candido Portinari)","title":"Dois enormes painéis brasileiros recebem visitantes na sede da ONU.","text":"Candido Portinari produziu Guerra e Paz entre 1952 e 1956. As obras, com cerca de 14 metros de altura cada, foram presenteadas pelo Brasil às Nações Unidas e contrapõem sofrimento e esperança.","why":"Arte monumental"},{"id":"semana-22","category":"Modernismo","icon":"palette","wiki":"Semana de Arte Moderna","title":"Três dias de apresentações ajudaram a sacudir a arte brasileira.","text":"A Semana de Arte Moderna de 1922 reuniu exposições, música, conferências e literatura no Theatro Municipal de São Paulo. O evento virou símbolo da busca por novas linguagens e por uma arte menos presa a modelos tradicionais.","why":"Modernismo brasileiro"},{"id":"niemeyer-curvas","category":"Arquitetura","icon":"architecture","wiki":"Oscar Niemeyer","title":"Oscar Niemeyer transformou curvas em uma assinatura da arquitetura brasileira.","text":"O arquiteto explorou concreto armado para criar formas leves e curvas em projetos como Pampulha e os edifícios monumentais de Brasília. Sua obra ajudou a projetar a arquitetura moderna brasileira internacionalmente.","why":"Arquitetura brasileira"},{"id":"brasilia-patrimonio","category":"Arquitetura","icon":"location_city","wiki":"Brasília","title":"Brasília é uma cidade moderna reconhecida como Patrimônio Mundial.","text":"Planejada por Lúcio Costa e marcada pelos edifícios de Oscar Niemeyer, Brasília foi inaugurada em 1960. Em 1987, seu conjunto urbanístico e arquitetônico entrou na lista de Patrimônio Mundial da UNESCO.","why":"Cidade e patrimônio"},{"id":"teatro-amazonas","category":"Patrimônio","icon":"theater_comedy","wiki":"Teatro Amazonas","title":"Um grande teatro do século XIX está no coração da Amazônia.","text":"Inaugurado em 1896, o Teatro Amazonas é um dos símbolos de Manaus e do ciclo da borracha. Sua arquitetura, decoração e cúpula colorida tornaram o edifício um dos cartões-postais culturais da região.","why":"Patrimônio amazônico"},{"id":"frevo","category":"Cultura popular","icon":"celebration","wiki":"Frevo","title":"O frevo nasceu do encontro entre música de rua, dança e capoeira.","text":"Surgido em Pernambuco, o frevo mistura ritmos de bandas e uma dança marcada por passos rápidos e acrobáticos. Em 2012, a expressão foi reconhecida pela UNESCO como Patrimônio Cultural Imaterial da Humanidade.","why":"Patrimônio vivo"},{"id":"capoeira","category":"Cultura afro-brasileira","icon":"sports_martial_arts","wiki":"Capoeira","title":"Na roda de capoeira, luta, música, dança e memória acontecem ao mesmo tempo.","text":"A prática afro-brasileira reúne movimentos corporais, canto, palmas e instrumentos como o berimbau. A roda de capoeira foi reconhecida pela UNESCO como Patrimônio Cultural Imaterial da Humanidade em 2014.","why":"Cultura e resistência"},{"id":"samba-roda","category":"Música","icon":"music_note","wiki":"Samba de roda","title":"O samba de roda do Recôncavo guarda raízes profundas da música brasileira.","text":"Na Bahia, canto, palmas, instrumentos e dança formam uma tradição transmitida entre gerações. A expressão foi uma das primeiras manifestações brasileiras reconhecidas pela UNESCO como patrimônio cultural imaterial.","why":"Música e tradição"},{"id":"pixinguinha-choro","category":"Música","icon":"library_music","wiki":"Pixinguinha","title":"Pixinguinha ajudou o choro a ganhar uma linguagem que atravessou gerações.","text":"Flautista, saxofonista, compositor e arranjador, Pixinguinha foi decisivo para a música popular brasileira no século XX. Suas composições e arranjos aproximaram tradição, sofisticação harmônica e música urbana.","why":"Música brasileira"},{"id":"chiquinha","category":"Música","icon":"piano","wiki":"Chiquinha Gonzaga","title":"Chiquinha Gonzaga abriu caminhos na música muito antes de isso ser comum para mulheres.","text":"Pianista, compositora e maestrina, ela construiu uma carreira profissional no fim do século XIX e início do XX. Sua obra passou pelo teatro, pelas danças populares e pelo carnaval, ajudando a moldar a música urbana brasileira.","why":"Pioneirismo musical"},{"id":"machado","category":"Literatura","icon":"menu_book","wiki":"Machado de Assis","title":"Machado de Assis transformou observação do cotidiano em literatura universal.","text":"Com ironia e narradores pouco confiáveis, o escritor explorou vaidade, ambição, relações sociais e contradições humanas. Obras como Memórias Póstumas de Brás Cubas continuam surpreendentemente modernas.","why":"Literatura brasileira"},{"id":"clarice","category":"Literatura","icon":"auto_stories","wiki":"Clarice Lispector","title":"Clarice Lispector fez da vida interior o centro de histórias aparentemente simples.","text":"Em romances e contos, a escritora transformava situações comuns em momentos de descoberta, estranhamento e reflexão. Seu estilo singular tornou Clarice uma das autoras brasileiras mais lidas e estudadas.","why":"Literatura brasileira"},{"id":"cordel","category":"Cultura popular","icon":"book_2","wiki":"Literatura de cordel","title":"O cordel transforma histórias em versos feitos para circular entre pessoas.","text":"Muito associado ao Nordeste brasileiro, o cordel reúne poesia popular, narrativa e xilogravura. Os folhetos abordam humor, acontecimentos, lendas, romances e personagens, preservando uma forte tradição de oralidade.","why":"Poesia popular"},{"id":"bumba-boi","category":"Cultura popular","icon":"festival","wiki":"Bumba meu boi","title":"No Bumba meu boi, um boi morre, renasce e reúne muitas tradições pelo caminho.","text":"A celebração combina música, teatro, dança, bordados e personagens de diferentes matrizes culturais. O complexo cultural do Bumba meu boi do Maranhão foi reconhecido pela UNESCO como patrimônio imaterial em 2019.","why":"Festa e tradição"},{"id":"queijo-minas","category":"Cultura alimentar","icon":"restaurant","wiki":"Queijo Minas artesanal","title":"Fazer queijo também pode ser uma forma de patrimônio cultural.","text":"Os modos tradicionais de produzir Queijo Minas Artesanal guardam técnicas transmitidas entre gerações e ligadas ao território. Em 2024, esse saber passou a integrar a lista de Patrimônio Cultural Imaterial da Humanidade da UNESCO.","why":"Saberes e sabores"},{"id":"aleijadinho","category":"Arte colonial","icon":"sculpture","wiki":"Aleijadinho","title":"Pedra-sabão e madeira ajudaram a criar uma das marcas do barroco brasileiro.","text":"Aleijadinho atuou em Minas Gerais entre os séculos XVIII e XIX, trabalhando como escultor, entalhador e arquiteto. Suas obras em igrejas e santuários se tornaram referências da arte colonial no Brasil.","why":"Barroco brasileiro"},{"id":"kusiwa","category":"Cultura indígena","icon":"draw","wiki":"Arte Kusiwa","title":"Para o povo Wajãpi, desenhos também carregam conhecimento e memória.","text":"A Arte Kusiwa reúne grafismos aplicados ao corpo e a objetos, ligados a narrativas e conhecimentos do povo Wajãpi do Amapá. A tradição foi reconhecida pela UNESCO como patrimônio cultural imaterial.","why":"Cultura indígena"}];
function setImage(url){image.decoding='async';image.onload=()=>poster.classList.add('has-image');image.onerror=()=>{poster.classList.remove('has-image');image.removeAttribute('src')};if(url)image.src=url;else{image.removeAttribute('src');poster.classList.remove('has-image')}}
async function wikiImage(item){if(!item.wiki)return'';const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles='+encodeURIComponent(item.wiki);try{const data=await PV.cachedJSON(url,7*24*60*60*1000,{},5000);const pages=data&&data.query&&data.query.pages?Object.values(data.query.pages):[];return pages[0]&&pages[0].thumbnail&&pages[0].thumbnail.source||''}catch(e){return''}}
async function load(){const item=pickBalancedPanelItem(items,'cultura',x=>x.category);category.textContent=item.category;title.textContent=item.title;text.textContent=item.text;why.textContent=item.why;icon.textContent=item.icon||'palette';setImage(await wikiImage(item));showLoader(220)}
load();
</script></body></html>
