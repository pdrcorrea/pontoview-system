<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f1;
  --text:#15171a;
  --muted:#6f747b;
  --pv:#08479A;
  --pv-dark:#032A61;
  --pv-cyan:#69CFF2;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;
}
.stage{
  width:100%;height:100%;
  padding:clamp(28px,3.8vw,64px) clamp(30px,4.1vw,72px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(18px,2.6vh,30px);position:relative;overflow:hidden;
  animation:panelIn .72s var(--ease) both;
}
.stage::before,.stage::after{content:"";position:absolute;pointer-events:none;opacity:.10}
.stage::before{width:clamp(130px,16vw,260px);aspect-ratio:1;right:clamp(-105px,-5vw,-52px);top:clamp(-105px,-6vw,-52px);border-radius:34%;background:linear-gradient(135deg,var(--pv-cyan),var(--pv));transform:rotate(18deg)}
.stage::after{width:clamp(90px,10vw,170px);aspect-ratio:1;left:clamp(-75px,-4vw,-34px);bottom:clamp(-72px,-4vw,-28px);border-radius:50%;background:linear-gradient(135deg,var(--pv-cyan),var(--pv-dark))}
.header{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:24px;min-width:0;animation:headerIn .55s .08s ease-out both}
.kicker{font-size:clamp(15px,1.05vw,22px);line-height:1;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.source{max-width:48%;color:var(--muted);font-size:clamp(14px,1vw,19px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.media{position:relative;z-index:2;width:100%;min-width:0;min-height:0;overflow:hidden;border-radius:clamp(18px,1.45vw,24px);background:radial-gradient(circle at 24% 24%,rgba(105,207,242,.12),transparent 18%),linear-gradient(135deg,#f3f2ef,#e8e7e2);animation:mediaIn .75s .14s var(--ease) both}
.media::after{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(0deg,rgba(255,255,255,.10),transparent 40%),linear-gradient(120deg,transparent 20%,rgba(255,255,255,.30) 20% 21%,transparent 21% 44%,rgba(255,255,255,.18) 44% 45%,transparent 45%);opacity:.58;pointer-events:none}
.photo{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;display:none;animation:imageBreath 14s ease-in-out infinite}
.media.has-image .photo{display:block}
.media.has-image::after{background:linear-gradient(180deg,rgba(255,255,255,.01),rgba(4,24,52,.06));opacity:1}
.fallback{position:absolute;z-index:1;inset:0;display:grid;place-items:center}
.media.has-image .fallback{display:none}
.pv-symbol{width:min(29%,230px);min-width:155px;filter:drop-shadow(0 12px 20px rgba(1,62,141,.08));animation:symbolIn .72s .32s cubic-bezier(.16,.84,.32,1) both}
.pv-symbol svg{display:block;width:100%;height:auto}
.bottom{position:relative;z-index:3;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(20px,2vw,36px);align-items:end;animation:bottomIn .65s .28s var(--ease) both}
.headline{margin:0;max-width:18ch;font-size:clamp(38px,3.8vw,72px);line-height:1.02;letter-spacing:-.05em;font-weight:800;text-wrap:balance;overflow-wrap:normal;word-break:normal;hyphens:none}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(6px,.65vw,10px);flex:0 0 auto}
.qr.hidden{display:none}
.qr-frame{position:relative;padding:5px;border-radius:clamp(15px,1.05vw,19px);background:linear-gradient(135deg,var(--pv-cyan),var(--pv));box-shadow:0 10px 24px rgba(8,71,154,.16),0 0 0 1px rgba(8,71,154,.08)}
.qr-frame::before{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,255,255,.68);pointer-events:none}
.qr-frame::after{content:"";position:absolute;inset:-4px;border-radius:calc(clamp(15px,1.05vw,19px) + 4px);border:1px solid rgba(8,71,154,.10);pointer-events:none}
.qr img{position:relative;z-index:1;width:clamp(82px,5.4vw,108px);height:clamp(82px,5.4vw,108px);display:block;border-radius:clamp(9px,.65vw,12px);background:#fff}
.qr-label{color:var(--muted);font-size:clamp(11px,.78vw,15px);line-height:1.2;font-weight:700;text-align:center}
.brand{position:absolute;z-index:4;right:clamp(8px,.45vw,13px);top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;color:rgba(21,23,26,.18);font-size:clamp(8px,.58vw,11px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.994)}to{opacity:1;transform:none}}
@keyframes headerIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
@keyframes mediaIn{from{opacity:0;transform:translateY(10px);clip-path:inset(0 100% 0 0 round 22px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 22px)}}
@keyframes symbolIn{from{opacity:0;transform:scale(.86) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes bottomIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes imageBreath{50%{transform:scale(1.018)}}
@media (orientation:portrait),(max-aspect-ratio:4/5){.stage{padding:clamp(28px,5vw,54px) clamp(24px,5vw,52px) clamp(24px,4vw,42px);gap:clamp(18px,2.2vh,28px)}.source{max-width:54%}.headline{max-width:15ch;font-size:clamp(38px,7.7vw,76px);line-height:1.01}.qr img{width:clamp(80px,12vw,100px);height:clamp(80px,12vw,100px)}.brand{display:none}}
@media(max-width:560px) and (orientation:portrait){.kicker,.source{font-size:14px}.bottom{gap:14px}.headline{font-size:clamp(32px,8vw,50px)}.qr img{width:76px;height:76px}.qr-label{font-size:10px}}
@media(prefers-reduced-motion:reduce){.stage,.header,.media,.pv-symbol,.bottom,.photo{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <header class="header">
    <div class="kicker">Notícias</div>
    <div class="source" id="source">Fonte</div>
  </header>
  <section class="media" id="media">
    <div class="fallback" aria-hidden="true">
      <div class="pv-symbol">
        <svg viewBox="40 30 215 205" xmlns="http://www.w3.org/2000/svg" role="presentation">
          <circle cx="144.5" cy="136.5" r="47.5" fill="#08479A"/>
          <path d="M190 45 L188 48 L189 55 L208 68 L220 83 L226 98 L228 108 L233 111 L238 110 L242 105 L240 93 L238 90 L237 85 L227 67 L213 53 L204 47 L196 43 Z" fill="#08479A"/>
          <path d="M55 144 L51 148 L52 163 L56 177 L65 194 L74 204 L89 215 L104 222 L109 221 L112 218 L113 215 L112 211 L107 207 L101 205 L91 199 L81 190 L73 179 L69 170 L66 158 L65 148 L63 145 L59 143 Z" fill="#08479A"/>
        </svg>
      </div>
    </div>
    <img class="photo" id="image" alt="">
  </section>
  <section class="bottom" id="copy">
    <h1 class="headline" id="title">Carregando notícias...</h1>
    <div class="qr hidden" id="qr">
      <div class="qr-frame"><img id="qrImg" alt="QR Code"></div>
      <div class="qr-label">Saiba mais</div>
    </div>
  </section>
  <div class="brand">PontoView</div>
</main>
<script src="../shared/pv.js?v=9"></script>
<script>
const CONTENT_FEED='https://fpdojntvnhiszagczfqr.supabase.co/functions/v1/content-feed?type=news&limit=5';
const copy=document.getElementById('copy'),title=document.getElementById('title'),source=document.getElementById('source'),media=document.getElementById('media'),image=document.getElementById('image'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg');
function clean(t){return PV.clean(t).replace(/📲|👉|🔗/g,'')}
function safeItem(x){return !!(x&&x.title)&&PV.newsEditorialCheck(x).allowed}
function normalizeImage(u){u=String(u||'').trim();if(u.startsWith('//'))u='https:'+u;return /^https?:\/\//i.test(u)?u:''}
function proxyImage(u){const v=normalizeImage(u);return v?'https://images.weserv.nl/?url='+encodeURIComponent(v.replace(/^https?:\/\//,''))+'&w=1600&h=1000&fit=cover&output=webp':''}
function setImage(u){const original=normalizeImage(u);media.classList.remove('has-image');image.removeAttribute('src');if(!original)return;const candidates=[proxyImage(original),original].filter(Boolean);let i=0;const next=()=>{if(i>=candidates.length){media.classList.remove('has-image');image.removeAttribute('src');return}image.onload=()=>{media.classList.add('has-image');image.onload=null;image.onerror=null};image.onerror=next;image.src=candidates[i++]};next()}
function headlineLines(){const style=getComputedStyle(title);const fontSize=parseFloat(style.fontSize)||32;const lineHeight=parseFloat(style.lineHeight)||fontSize*1.02;return Math.max(1,Math.round(title.scrollHeight/lineHeight))}
function preferredHeadlineSize(){const n=(title.textContent||'').trim().length;const portrait=matchMedia('(orientation: portrait)').matches;if(portrait){if(n>130)return 32;if(n>100)return 36;if(n>75)return 42;if(n>50)return 50;return 64}if(n>130)return 32;if(n>105)return 36;if(n>80)return 42;if(n>60)return 48;if(n>42)return 56;return 66}
let fitFrame=0;
function fitCopy(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(()=>{const portrait=matchMedia('(orientation: portrait)').matches;const maxLines=portrait?5:3;const minFont=28;let size=preferredHeadlineSize();const viewportMax=portrait?Math.min(76,innerWidth*.077):Math.min(72,innerWidth*.038);size=Math.min(size,Math.max(minFont,viewportMax));title.style.fontSize=size+'px';title.style.lineHeight=portrait?'1.01':'1.02';const fits=()=>headlineLines()<=maxLines&&copy.scrollHeight<=copy.clientHeight+1;while(size>minFont&&!fits()){size-=1;title.style.fontSize=size+'px'}})}
function render(x){if(!safeItem(x))throw new Error('Notícia inválida');title.textContent=clean(x.title)||'Notícia';source.textContent=x.source||x.sourceDomain||x.source_name||'Fonte';setImage(x.image||x.image_url||x.imageUrl);const link=x.public_url||x.publicUrl||x.content_url||x.contentUrl||x.link||x.url||x.sourceUrl||x.source_url||'';if(link){qrImg.src=PV.qrUrl(link);qr.classList.remove('hidden')}else{qr.classList.add('hidden');qrImg.removeAttribute('src')}requestAnimationFrame(()=>requestAnimationFrame(fitCopy))}
function newsFromPlayer(timeout=1400){return new Promise((resolve,reject)=>{if(window.parent===window){reject(new Error('standalone'));return}const requestId='pv-news-'+Date.now()+'-'+Math.random().toString(36).slice(2);let done=false;const finish=(fn,value)=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);fn(value)};const onMessage=(event)=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type!=='pv-news-response'||data.requestId!==requestId)return;finish(resolve,{items:PV.filterSafeNews(data.items||[]),source:'PontoView',fromPlayer:true})};const timer=setTimeout(()=>finish(reject,new Error('timeout')),timeout);window.addEventListener('message',onMessage);window.parent.postMessage({type:'pv-news-request',requestId},location.origin)})}
async function fetchNews(){try{const playerNews=await newsFromPlayer();if(Array.isArray(playerNews.items)&&playerNews.items.length)return playerNews}catch{}const response=await fetch(CONTENT_FEED,{headers:{Accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error('Central indisponível');const data=await response.json();const items=Array.isArray(data?.items)?data.items:[];return {source:'PontoView Content Hub',fromPlayer:false,items:PV.filterSafeNews(items.map(item=>({...item,source:item.source_name||item.source,url:item.source_url||item.url,link:item.public_url||item.publicUrl||item.content_url||item.contentUrl||item.source_url||item.link||item.url})))}}
async function load(){try{const d=await fetchNews();const items=PV.filterSafeNews(Array.isArray(d.items)?d.items:[]).filter(safeItem);if(!items.length)throw new Error('Sem notícias seguras');const item=PV.pickForRefresh(items,'noticias',x=>String(x.link||x.url||x.title));render(item)}catch{title.textContent='Novas notícias em breve';source.textContent='PontoView';media.classList.remove('has-image');image.removeAttribute('src');qr.classList.add('hidden');requestAnimationFrame(fitCopy)}}
window.addEventListener('resize',fitCopy);if('ResizeObserver' in window){new ResizeObserver(fitCopy).observe(copy)}if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitCopy).catch(()=>{})}load();
</script>
</body>
</html>
