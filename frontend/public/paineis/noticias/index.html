<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/pontoview.css?v=8">
<link rel="stylesheet" href="../shared/responsive.css?v=8">
<style>
.news-stage{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(24px,2.8vw,52px);
  align-items:stretch;
}

.copy{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  padding:clamp(4px,.7vw,20px) 0;
}

.copy-inner{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.headline{
  margin:0;
  width:100%;
  max-width:none;
  font-size:clamp(26px,2.45vw,82px);
  font-weight:700;
  line-height:1.07;
  letter-spacing:-.042em;
  text-wrap:balance;
  overflow-wrap:anywhere;
  hyphens:auto;
}

.desc{
  margin:clamp(16px,2.1vh,34px) 0 0;
  max-width:58ch;
  font-size:clamp(14px,1.02vw,38px);
  line-height:1.52;
  color:var(--pv-soft);
  text-wrap:pretty;
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  overflow:hidden;
}

.source-row{
  display:flex;
  align-items:center;
  gap:clamp(10px,.8vw,18px);
  margin-top:clamp(20px,3vh,44px);
  padding-top:clamp(14px,1.7vh,28px);
  border-top:1px solid var(--pv-line);
  color:var(--pv-soft);
  flex:0 0 auto;
}

.source-logo{
  width:clamp(28px,1.8vw,58px);
  height:clamp(28px,1.8vw,58px);
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:10px;
  background:rgba(255,255,255,.05);
}

.source-logo img{
  width:72%;
  height:72%;
  object-fit:contain;
}

.source-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.source-label{
  font-size:clamp(9px,.58vw,20px);
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
}

.source-name{
  max-width:100%;
  font-size:clamp(11px,.78vw,28px);
  font-weight:650;
  color:var(--pv-sky);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.media{
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:var(--pv-radius);
  background:
    radial-gradient(circle at 50% 42%,rgba(105,207,242,.16),transparent 38%),
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--pv-line);
}

.media img.photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  animation:pvImageBreath 14s ease-in-out infinite;
}

.media.has-image img.photo{display:block}

.fallback{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
}

.fallback-inner{
  display:grid;
  place-items:center;
  gap:clamp(10px,1vw,22px);
  color:rgba(255,255,255,.34);
}

.fallback-inner .material-symbols-outlined{
  font-size:clamp(72px,7vw,220px);
  color:rgba(105,207,242,.23);
}

.fallback-inner b{
  font-size:clamp(11px,.75vw,26px);
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
}

.media.has-image .fallback{display:none}

.media::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(3,42,97,.015) 48%,rgba(3,42,97,.42) 100%);
  pointer-events:none;
}

.qr{
  position:absolute;
  z-index:3;
  right:clamp(12px,1vw,28px);
  bottom:clamp(12px,1vw,28px);
  display:flex;
  align-items:center;
  gap:clamp(8px,.7vw,16px);
  padding:clamp(7px,.55vw,14px);
  border-radius:clamp(14px,1vw,24px);
  background:rgba(3,42,97,.78);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 32px rgba(0,0,0,.16);
}

.qr.hidden{display:none}

.qr img{
  width:clamp(62px,4.15vw,150px);
  height:clamp(62px,4.15vw,150px);
  flex:0 0 auto;
  border-radius:clamp(8px,.55vw,14px);
  background:#fff;
}

.qr-copy{
  max-width:clamp(92px,7vw,230px);
  font-size:clamp(8px,.54vw,18px);
  line-height:1.3;
  color:rgba(255,255,255,.68);
}

.qr-copy b{
  display:block;
  margin-bottom:3px;
  color:#fff;
  font-size:clamp(9px,.62vw,21px);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.news-stage{animation:newsEnter .72s var(--pv-ease) both}

@keyframes newsEnter{
  from{opacity:0;transform:translateY(10px);filter:blur(2px)}
  to{opacity:1;transform:none;filter:none}
}

@media (max-width:1100px) and (orientation:landscape){
  .news-stage{grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);gap:24px}
  .headline{font-size:clamp(26px,2.65vw,38px);max-width:none}
  .desc{font-size:clamp(13px,1.25vw,17px);-webkit-line-clamp:4}
  .source-row{margin-top:18px;padding-top:14px}
  .qr-copy{display:none}
}

@media(orientation:portrait),(max-aspect-ratio:4/5){
  .news-stage{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,48%) minmax(0,52%);
    gap:clamp(18px,2.2vh,30px)
  }
  .copy{justify-content:center;padding:0}
  .headline{max-width:none;font-size:clamp(30px,5.4vw,70px);line-height:1.08}
  .desc{font-size:clamp(14px,2.2vw,26px);-webkit-line-clamp:4}
  .source-row{margin-top:clamp(16px,2vh,28px);padding-top:clamp(12px,1.4vh,20px)}
  .media{min-height:0}
}

@media(max-width:560px) and (orientation:portrait){
  .news-stage{grid-template-rows:minmax(0,53%) minmax(0,47%);gap:16px}
  .headline{font-size:clamp(27px,6vw,40px)}
  .desc{font-size:clamp(13px,3vw,17px);-webkit-line-clamp:3}
  .source-row{margin-top:14px;padding-top:12px}
  .qr-copy{display:none}
}

@media(prefers-reduced-motion:reduce){
  .news-stage{animation:none}
  .media img.photo{animation:none}
}
</style>
</head>
<body class="pv-panel panel-noticias">
<div class="pv-ambient"></div>
<div class="pv-shell">
  <main class="news-stage pv-stage-centered">
    <section class="copy" id="copy">
      <div class="copy-inner">
        <h1 class="headline" id="title">Carregando notícias...</h1>
        <p class="desc" id="desc"></p>

        <div class="source-row">
          <span class="source-logo"><img id="favicon" alt=""></span>
          <div class="source-copy">
            <span class="source-label">Fonte</span>
            <span class="source-name" id="source">Fonte</span>
          </div>
        </div>
      </div>
    </section>

    <section class="media" id="media">
      <div class="fallback">
        <div class="fallback-inner">
          <span class="material-symbols-outlined">newspaper</span>
          <b>PontoView Notícias</b>
        </div>
      </div>
      <img class="photo" id="image" alt="">
      <div class="qr hidden" id="qr">
        <img id="qrImg" alt="QR Code">
        <div class="qr-copy">
          <b id="qrTitle">Leia a matéria</b>
          <span id="qrHint">Aponte a câmera do celular</span>
        </div>
      </div>
    </section>
  </main>
  <footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer>
</div>

<script src="../shared/pv.js?v=8"></script>
<script>
const WORKER='https://pontoview-api.pedrhc258.workers.dev/api/news';
const copy=document.getElementById('copy'),
title=document.getElementById('title'),
desc=document.getElementById('desc'),
source=document.getElementById('source'),
favicon=document.getElementById('favicon'),
media=document.getElementById('media'),
image=document.getElementById('image'),
qr=document.getElementById('qr'),
qrImg=document.getElementById('qrImg'),
qrTitle=document.getElementById('qrTitle'),
qrHint=document.getElementById('qrHint');

function clean(t){
  return PV.clean(t).replace(/📲|👉|🔗/g,'')
}

function brokenText(v){
  const s=String(v||'');
  return s.includes('\uFFFD')||/(Ã[\x80-\xBF]|Â[\x80-\xBF]|â(?:€|€™|€œ|€�|€“|€”|€¦|„|†)|ðŸ|ï¿½)/.test(s)
}

function blockedSource(x){
  const s=String(x.source||x.sourceDomain||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase();
  const u=String(x.link||x.url||x.sourceUrl||'').toLowerCase();
  return s.includes('folha de s.paulo')||
    s.includes('folha de s. paulo')||
    s.includes('folha de sao paulo')||
    s.includes('folha s.paulo')||
    u.includes('folha.uol.com.br')
}

function safeItem(x){
  return !!(x&&x.title)&&
    !blockedSource(x)&&
    !brokenText(x.title)&&
    !brokenText(x.description||x.summary)&&
    !brokenText(x.source||x.sourceDomain)
}

function summary(t){
  let s=clean(t);
  s=s.split(/(?:Notícias relacionadas|Leia também|Veja também|Saiba mais)\s*:/i)[0].trim();
  if(s.length>420)s=s.slice(0,417).replace(/\s+\S*$/,'')+'…';
  return s
}

function faviconUrl(u){
  try{return'https://www.google.com/s2/favicons?domain='+new URL(u).hostname+'&sz=128'}
  catch{return''}
}

function normalizeImage(u){
  u=String(u||'').trim();
  if(u.startsWith('//'))u='https:'+u;
  return /^https?:\/\//i.test(u)?u:''
}

function proxyImage(u){
  const v=normalizeImage(u);
  return v
    ?'https://images.weserv.nl/?url='+encodeURIComponent(v.replace(/^https?:\/\//,''))+'&w=1600&h=1200&fit=cover&output=webp'
    :''
}

function setImage(u){
  const original=normalizeImage(u);
  media.classList.remove('has-image');
  image.removeAttribute('src');
  if(!original)return;

  const candidates=[proxyImage(original),original].filter(Boolean);
  let i=0;

  const next=()=>{
    if(i>=candidates.length){
      media.classList.remove('has-image');
      image.removeAttribute('src');
      return
    }
    image.onload=()=>{
      media.classList.add('has-image');
      image.onload=null;
      image.onerror=null
    };
    image.onerror=next;
    image.src=candidates[i++]
  };

  next()
}

function headlineLines(){
  const style=getComputedStyle(title);
  const fontSize=parseFloat(style.fontSize)||32;
  const lineHeight=parseFloat(style.lineHeight)||fontSize*1.07;
  const height=title.getBoundingClientRect().height;
  return Math.max(1,Math.ceil((height+.5)/lineHeight))
}

function targetHeadlineLines(){
  const length=(title.textContent||'').trim().length;
  const portrait=matchMedia('(orientation: portrait)').matches;

  if(portrait){
    if(length<=65)return 4;
    if(length<=110)return 5;
    return 6
  }

  if(length<=65)return 3;
  if(length<=110)return 4;
  return 5
}

function fitCopy(){
  title.style.fontSize='';
  desc.style.fontSize='';
  desc.style.webkitLineClamp=matchMedia('(orientation: portrait)').matches?'4':'5';

  const initial=parseFloat(getComputedStyle(title).fontSize)||40;
  const portrait=matchMedia('(orientation: portrait)').matches;
  const minimum=portrait?26:22;
  const targetLines=targetHeadlineLines();
  const copyFits=()=>copy.scrollHeight<=copy.clientHeight+1;
  const titleFits=()=>headlineLines()<=targetLines;

  if(titleFits()&&copyFits())return;

  let lo=Math.min(minimum,initial);
  let hi=initial;
  let best=lo;

  title.style.fontSize=lo+'px';

  if(titleFits()&&copyFits()){
    best=lo;

    for(let n=0;n<14;n++){
      const mid=(lo+hi)/2;
      title.style.fontSize=mid+'px';

      if(titleFits()&&copyFits()){
        best=mid;
        lo=mid
      }else{
        hi=mid
      }

      if(Math.abs(hi-lo)<.35)break
    }

    title.style.fontSize=best+'px';
  }else{
    title.style.fontSize=minimum+'px'
  }

  if(!copyFits()&&desc.textContent){
    desc.style.webkitLineClamp='3'
  }

  if(!copyFits()&&desc.textContent){
    desc.style.webkitLineClamp='2'
  }

  if(!copyFits()&&desc.textContent){
    const current=parseFloat(getComputedStyle(desc).fontSize)||14;
    desc.style.fontSize=Math.max(12,current-1)+'px'
  }
}

function render(x){
  if(!safeItem(x))throw new Error('Notícia inválida');

  title.textContent=clean(x.title)||'Notícia';

  const body=summary(x.description||x.summary||'');
  desc.textContent=body;
  desc.style.display=body?'-webkit-box':'none';

  source.textContent=x.source||x.sourceDomain||'Fonte';

  const f=faviconUrl(x.link||x.sourceUrl||'');
  favicon.src=f;
  favicon.style.display=f?'block':'none';
  favicon.onerror=()=>favicon.style.display='none';

  setImage(x.image);

  const link=x.link||x.sourceUrl||'';
  if(link){
    qrImg.src=PV.qrUrl(link);
    qr.classList.remove('hidden');
    qrTitle.textContent=x.link?'Leia a matéria':'Acesse a fonte';
    qrHint.textContent=x.link?'Aponte a câmera do celular':'Abra o portal da fonte'
  }else{
    qr.classList.add('hidden');
    qrImg.removeAttribute('src')
  }

  requestAnimationFrame(()=>requestAnimationFrame(fitCopy))
}

async function fetchNews(){
  return PV.fromApi('/api/noticias',()=>PV.fetchJSON(WORKER))
}

async function load(){
  try{
    const d=await fetchNews();
    const items=Array.isArray(d.items)?d.items.filter(safeItem):[];
    if(!items.length)throw new Error('Sem notícias seguras');
    const item=PV.pickForRefresh(items,'noticias',x=>String(x.link||x.title));
    render(item)
  }catch{
    title.textContent='Novas notícias em breve';
    desc.style.display='none';
    source.textContent='PontoView';
    favicon.style.display='none';
    media.classList.remove('has-image');
    qr.classList.add('hidden');
    requestAnimationFrame(fitCopy)
  }
}

window.addEventListener('resize',()=>requestAnimationFrame(fitCopy));
load();
</script>
</body>
</html>
