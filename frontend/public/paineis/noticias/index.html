<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Notícias</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
.news-stage{min-height:0;display:grid;grid-template-columns:minmax(0,57%) minmax(0,43%);gap:clamp(30px,3.4vw,56px);align-items:stretch}.copy{min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:6px 0}.source-row{display:flex;align-items:center;gap:12px;margin-bottom:clamp(16px,2vh,24px);color:var(--pv-sky);font-size:clamp(11px,.9vw,14px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto}.source-logo{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto}.source-logo img{width:30px;height:30px;object-fit:contain}.headline{margin:0;max-width:20ch;font-size:clamp(32px,4vw,64px);font-weight:650;line-height:1.04;letter-spacing:-.045em;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}.desc{margin:clamp(18px,2.3vh,28px) 0 0;max-width:62ch;font-size:clamp(14px,1.2vw,19px);line-height:1.48;color:var(--pv-soft);text-wrap:pretty;overflow-wrap:anywhere}.media{min-height:0;position:relative;border-radius:var(--pv-radius);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(105,207,242,.13),transparent 38%),rgba(255,255,255,.045);border:1px solid var(--pv-line)}.media img.photo{width:100%;height:100%;object-fit:cover;display:none;animation:pvImageBreath 14s ease-in-out infinite}.media.has-image img.photo{display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center}.fallback span{font-size:clamp(100px,11vw,180px);color:rgba(105,207,242,.23)}.media.has-image .fallback{display:none}.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,42,97,.01),rgba(3,42,97,.42));pointer-events:none}.qr{position:absolute;z-index:3;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;padding:9px 11px 9px 9px;border-radius:17px;background:rgba(3,42,97,.76);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(9px)}.qr.hidden{display:none}.qr img{width:68px;height:68px;border-radius:10px;background:#fff}.qr div{font-size:9px;line-height:1.25;color:rgba(255,255,255,.7);max-width:120px}.qr b{display:block;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.news-stage{animation:newsEnter .72s var(--pv-ease) both}@keyframes newsEnter{from{opacity:0;transform:translateY(10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@media(orientation:portrait),(max-aspect-ratio:4/5){.news-stage{grid-template-columns:1fr;grid-template-rows:minmax(0,52%) minmax(0,48%);gap:22px}.headline{font-size:clamp(32px,6.6vw,58px);max-width:none}.desc{font-size:clamp(14px,2.4vw,19px)}}@media(orientation:landscape) and (max-height:760px){.news-stage{grid-template-columns:minmax(0,59%) minmax(0,41%);gap:30px}.headline{font-size:clamp(28px,3.5vw,50px)}.desc{font-size:13px;margin-top:13px}.qr img{width:56px;height:56px}}@media(prefers-reduced-motion:reduce){.news-stage{animation:none}.media img.photo{animation:none}}
</style></head><body><div class="pv-ambient"></div><div class="pv-shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">newspaper</span></div><div class="pv-title">Notícias</div></div><div class="pv-source"><span class="material-symbols-outlined">rss_feed</span><span>Central RSS</span></div></header><main class="news-stage"><section class="copy" id="copy"><div class="source-row"><span class="source-logo"><img id="favicon" alt=""></span><span id="source">Fonte</span></div><h1 class="headline" id="title">Carregando notícias...</h1><p class="desc" id="desc"></p></section><section class="media" id="media"><div class="fallback"><span class="material-symbols-outlined">article</span></div><img class="photo" id="image" alt=""><div class="qr hidden" id="qr"><img id="qrImg" alt="QR Code"><div><b id="qrTitle">Leia a matéria</b><span id="qrHint">Aponte a câmera do celular</span></div></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const WORKER='https://pontoview-api.pedrhc258.workers.dev/api/news';const copy=document.getElementById('copy'),title=document.getElementById('title'),desc=document.getElementById('desc'),source=document.getElementById('source'),favicon=document.getElementById('favicon'),media=document.getElementById('media'),image=document.getElementById('image'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg'),qrTitle=document.getElementById('qrTitle'),qrHint=document.getElementById('qrHint');function clean(t){return PV.clean(t).replace(/📲|👉|🔗/g,'')}function summary(t){let s=clean(t);s=s.split(/(?:Notícias relacionadas|Leia também|Veja também|Saiba mais)\s*:/i)[0].trim();if(s.length>520)s=s.slice(0,517).replace(/\s+\S*$/,'')+'…';return s}function faviconUrl(u){try{return'https://www.google.com/s2/favicons?domain='+new URL(u).hostname+'&sz=128'}catch{return''}}function normalizeImage(u){u=String(u||'').trim();if(u.startsWith('//'))u='https:'+u;return /^https?:\/\//i.test(u)?u:''}function proxyImage(u){const v=normalizeImage(u);return v?'https://images.weserv.nl/?url='+encodeURIComponent(v.replace(/^https?:\/\//,''))+'&w=1600&h=1200&fit=cover&output=webp':''}function setImage(u){const original=normalizeImage(u);media.classList.remove('has-image');image.removeAttribute('src');if(!original)return;const candidates=[proxyImage(original),original].filter(Boolean);let i=0;const next=()=>{if(i>=candidates.length){media.classList.remove('has-image');image.removeAttribute('src');return}image.onload=()=>{media.classList.add('has-image');image.onload=null;image.onerror=null};image.onerror=next;image.src=candidates[i++]};next()}function fitCopy(){const portrait=matchMedia('(orientation: portrait)').matches;let max=portrait?58:64,min=28;title.style.fontSize=max+'px';desc.style.display=desc.textContent?'block':'none';desc.style.fontSize='';const fits=()=>copy.scrollHeight<=copy.clientHeight+1;if(fits())return;let lo=min,hi=max,best=min;for(let n=0;n<10;n++){const mid=Math.floor((lo+hi)/2);title.style.fontSize=mid+'px';if(fits()){best=mid;lo=mid+1}else hi=mid-1}title.style.fontSize=best+'px';if(!fits()&&desc.textContent){desc.style.fontSize='13px'}if(!fits()&&desc.textContent){desc.style.display='none'}}function render(x){title.textContent=clean(x.title)||'Notícia';const body=summary(x.description||x.summary||'');desc.textContent=body;desc.style.display=body?'block':'none';source.textContent=x.source||x.sourceDomain||'Fonte';const f=faviconUrl(x.link||x.sourceUrl||'');favicon.src=f;favicon.style.display=f?'block':'none';favicon.onerror=()=>favicon.style.display='none';setImage(x.image);const link=x.link||x.sourceUrl||'';if(link){qrImg.src=PV.qrUrl(link);qr.classList.remove('hidden');qrTitle.textContent=x.link?'Leia a matéria':'Acesse a fonte';qrHint.textContent=x.link?'Aponte a câmera do celular':'Abra o portal da fonte'}else{qr.classList.add('hidden');qrImg.removeAttribute('src')}requestAnimationFrame(()=>requestAnimationFrame(fitCopy))}async function fetchNews(){return PV.fromApi('/api/noticias',()=>PV.fetchJSON(WORKER))}async function load(){try{const d=await fetchNews();const items=Array.isArray(d.items)?d.items.filter(x=>x&&x.title):[];if(!items.length)throw new Error('Sem notícias');const item=PV.pickForRefresh(items,'noticias',x=>String(x.link||x.title));render(item)}catch{title.textContent='Novas notícias em breve';desc.style.display='none';source.textContent='PontoView';favicon.style.display='none';media.classList.remove('has-image');qr.classList.add('hidden')}}window.addEventListener('resize',()=>requestAnimationFrame(fitCopy));load();
</script></body></html>
