<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView Telas • Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
<link rel="stylesheet" href="../shared/pontoview.css?v=8">
<link rel="stylesheet" href="../shared/responsive.css?v=8">
<style>
.news-stage{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,58%) minmax(0,42%);
  gap:clamp(20px,2.2vw,42px);
  align-items:stretch;
}

.copy{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  padding:clamp(4px,.7vw,20px) 0;
}

.copy-inner{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.headline{
  margin:0;
  width:100%;
  max-width:none;
  font-size:clamp(46px,5.1vw,84px);
  font-weight:650;
  line-height:.99;
  letter-spacing:-.05em;
  text-wrap:pretty;
  overflow-wrap:normal;
  word-break:normal;
  hyphens:none;
}

.desc{
  margin:clamp(12px,1.5vh,22px) 0 0;
  max-width:58ch;
  font-size:clamp(17px,1.45vw,23px);
  line-height:1.58;
  color:var(--pv-soft);
  text-wrap:pretty;
  overflow-wrap:normal;
  word-break:normal;
  hyphens:none;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  overflow:hidden;
}

.source-row{
  display:flex;
  align-items:center;
  gap:clamp(10px,.8vw,18px);
  margin-top:clamp(14px,2vh,28px);
  padding-top:clamp(10px,1.2vh,20px);
  border-top:1px solid var(--pv-line);
  color:var(--pv-soft);
  flex:0 0 auto;
}

.source-logo{
  width:clamp(28px,1.8vw,58px);
  height:clamp(28px,1.8vw,58px);
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:10px;
  background:rgba(255,255,255,.05);
}

.source-logo img{
  width:72%;
  height:72%;
  object-fit:contain;
}

.source-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.source-label{
  font-size:clamp(10px,.72vw,14px);
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
}

.source-name{
  max-width:100%;
  font-size:clamp(13px,.95vw,18px);
  font-weight:650;
  color:var(--pv-sky);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.media{
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:var(--pv-radius);
  background:
    radial-gradient(circle at 50% 42%,rgba(105,207,242,.16),transparent 38%),
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--pv-line);
}

.media img.photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  animation:pvImageBreath 14s ease-in-out infinite;
}

.media.has-image img.photo{display:block}

.fallback{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
}

.fallback-inner{
  display:grid;
  place-items:center;
  gap:clamp(10px,1vw,22px);
  color:rgba(255,255,255,.34);
}

.fallback-inner .material-symbols-outlined{
  font-size:clamp(72px,7vw,220px);
  color:rgba(105,207,242,.23);
}

.fallback-inner b{
  font-size:clamp(11px,.75vw,26px);
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
}

.media.has-image .fallback{display:none}

.media::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(3,42,97,.015) 48%,rgba(3,42,97,.42) 100%);
  pointer-events:none;
}

.qr{
  position:absolute;
  z-index:3;
  right:clamp(12px,1vw,28px);
  bottom:clamp(12px,1vw,28px);
  display:flex;
  align-items:center;
  gap:clamp(8px,.7vw,16px);
  padding:clamp(7px,.55vw,14px);
  border-radius:clamp(14px,1vw,24px);
  background:rgba(3,42,97,.78);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 32px rgba(0,0,0,.16);
}

.qr.hidden{display:none}

.qr img{
  width:clamp(62px,4.15vw,150px);
  height:clamp(62px,4.15vw,150px);
  flex:0 0 auto;
  border-radius:clamp(8px,.55vw,14px);
  background:#fff;
}

.qr-copy{
  max-width:clamp(92px,7vw,230px);
  font-size:clamp(8px,.54vw,18px);
  line-height:1.3;
  color:rgba(255,255,255,.68);
}

.qr-copy b{
  display:block;
  margin-bottom:3px;
  color:#fff;
  font-size:clamp(9px,.62vw,21px);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.news-stage{animation:newsEnter .72s var(--pv-ease) both}

@keyframes newsEnter{
  from{opacity:0;transform:translateY(10px);filter:blur(2px)}
  to{opacity:1;transform:none;filter:none}
}

@media (max-width:1100px) and (orientation:landscape){
  .news-stage{grid-template-columns:minmax(0,60%) minmax(0,40%);gap:18px}
  .headline{font-size:clamp(34px,4.2vw,54px);max-width:none}
  .desc{font-size:clamp(15px,1.7vw,20px);-webkit-line-clamp:2}
  .source-row{margin-top:12px;padding-top:10px}
  .qr-copy{display:none}
}

@media(orientation:portrait),(max-aspect-ratio:4/5){
  .news-stage{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,48%) minmax(0,52%);
    gap:clamp(18px,2.2vh,30px)
  }
  .copy{justify-content:center;padding:0}
  .headline{max-width:none;font-size:clamp(44px,8vw,72px);line-height:.99}
  .desc{font-size:clamp(16px,2.6vw,21px);line-height:1.5;-webkit-line-clamp:3}
  .source-row{margin-top:clamp(16px,2vh,28px);padding-top:clamp(12px,1.4vh,20px)}
  .media{min-height:0}
}

@media(max-width:560px) and (orientation:portrait){
  .news-stage{grid-template-rows:minmax(0,53%) minmax(0,47%);gap:16px}
  .headline{font-size:clamp(34px,7vw,48px)}
  .desc{font-size:clamp(15px,3vw,19px);-webkit-line-clamp:2}
  .source-row{margin-top:14px;padding-top:12px}
  .qr-copy{display:none}
}

@media(prefers-reduced-motion:reduce){
  .news-stage{animation:none}
  .media img.photo{animation:none}
}
</style>
</head>
<body class="pv-panel panel-noticias">
<div class="pv-ambient"></div>
<div class="pv-shell">
  <main class="news-stage pv-stage-centered">
    <section class="copy" id="copy">
      <div class="copy-inner">
        <h1 class="headline" id="title">Carregando notícias...</h1>
        <p class="desc" id="desc"></p>

        <div class="source-row">
          <span class="source-logo"><img id="favicon" alt=""></span>
          <div class="source-copy">
            <span class="source-label">Fonte</span>
            <span class="source-name" id="source">Fonte</span>
          </div>
        </div>
      </div>
    </section>

    <section class="media" id="media">
      <div class="fallback">
        <div class="fallback-inner">
          <span class="material-symbols-outlined">newspaper</span>
          <b>PontoView Notícias</b>
        </div>
      </div>
      <img class="photo" id="image" alt="">
      <div class="qr hidden" id="qr">
        <img id="qrImg" alt="QR Code">
        <div class="qr-copy">
          <b id="qrTitle">Leia a matéria</b>
          <span id="qrHint">Aponte a câmera do celular</span>
        </div>
      </div>
    </section>
  </main>
  <footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer>
</div>

<script src="../shared/pv.js?v=9"></script>
<script>
const WORKER='https://pontoview-api.pedrhc258.workers.dev/api/news';
const copy=document.getElementById('copy'),
title=document.getElementById('title'),
desc=document.getElementById('desc'),
source=document.getElementById('source'),
favicon=document.getElementById('favicon'),
media=document.getElementById('media'),
image=document.getElementById('image'),
qr=document.getElementById('qr'),
qrImg=document.getElementById('qrImg'),
qrTitle=document.getElementById('qrTitle'),
qrHint=document.getElementById('qrHint');

function clean(t){
  return PV.clean(t).replace(/📲|👉|🔗/g,'')
}

function safeItem(x){
  return !!(x&&x.title)&&PV.newsEditorialCheck(x).allowed
}

function summary(t){
  let s=clean(t);
  s=s.split(/(?:Notícias relacionadas|Leia também|Veja também|Saiba mais)\s*:/i)[0].trim();
  if(s.length>420)s=s.slice(0,417).replace(/\s+\S*$/,'')+'…';
  return s
}

function faviconUrl(u){
  try{return'https://www.google.com/s2/favicons?domain='+new URL(u).hostname+'&sz=128'}
  catch{return''}
}

function normalizeImage(u){
  u=String(u||'').trim();
  if(u.startsWith('//'))u='https:'+u;
  return /^https?:\/\//i.test(u)?u:''
}

function proxyImage(u){
  const v=normalizeImage(u);
  return v
    ?'https://images.weserv.nl/?url='+encodeURIComponent(v.replace(/^https?:\/\//,''))+'&w=1600&h=1200&fit=cover&output=webp'
    :''
}

function setImage(u){
  const original=normalizeImage(u);
  media.classList.remove('has-image');
  image.removeAttribute('src');
  if(!original)return;

  const candidates=[proxyImage(original),original].filter(Boolean);
  let i=0;

  const next=()=>{
    if(i>=candidates.length){
      media.classList.remove('has-image');
      image.removeAttribute('src');
      return
    }
    image.onload=()=>{
      media.classList.add('has-image');
      image.onload=null;
      image.onerror=null
    };
    image.onerror=next;
    image.src=candidates[i++]
  };

  next()
}

function headlineLines(){
  const style=getComputedStyle(title);
  const fontSize=parseFloat(style.fontSize)||32;
  const lineHeight=parseFloat(style.lineHeight)||fontSize*1.04;
  return Math.max(1,Math.round(title.scrollHeight/lineHeight))
}

function maxHeadlineLines(){
  return matchMedia('(orientation: portrait)').matches?5:4
}

function preferredHeadlineSize(){
  const length=(title.textContent||'').trim().length;
  const portrait=matchMedia('(orientation: portrait)').matches;
  const viewportLimit=portrait
    ?Math.max(38,Math.min(72,window.innerWidth*.08))
    :Math.max(40,Math.min(84,window.innerWidth*.051));

  let byLength;
  if(portrait){
    if(length>130)byLength=34;
    else if(length>100)byLength=38;
    else if(length>75)byLength=44;
    else if(length>50)byLength=52;
    else byLength=62
  }else{
    if(length>130)byLength=36;
    else if(length>100)byLength=40;
    else if(length>75)byLength=44;
    else if(length>55)byLength=50;
    else if(length>38)byLength=58;
    else byLength=68
  }

  return Math.min(viewportLimit,byLength)
}

let fitFrame=0;

function fitCopy(){
  cancelAnimationFrame(fitFrame);
  fitFrame=requestAnimationFrame(()=>{
    const portrait=matchMedia('(orientation: portrait)').matches;
    const minFont=portrait?30:30;
    const maxLines=maxHeadlineLines();
    let size=preferredHeadlineSize();

    title.style.fontSize=size+'px';
    title.style.lineHeight='.99';
    desc.style.fontSize='';
    desc.style.display=desc.textContent?'-webkit-box':'none';
    desc.style.webkitLineClamp=portrait?'3':'3';

    const copyFits=()=>copy.scrollHeight<=copy.clientHeight+1;
    const headlineFits=()=>headlineLines()<=maxLines;

    while(size>minFont&&(!headlineFits()||!copyFits())){
      size-=1;
      title.style.fontSize=size+'px'
    }

    if(!copyFits()&&desc.textContent){
      desc.style.webkitLineClamp='2'
    }

    while(size>minFont&&(!headlineFits()||!copyFits())){
      size-=1;
      title.style.fontSize=size+'px'
    }

    if(!copyFits()&&desc.textContent){
      desc.style.fontSize='12px'
    }

    while(size>minFont&&(!headlineFits()||!copyFits())){
      size-=1;
      title.style.fontSize=size+'px'
    }

    if(!copyFits()&&desc.textContent){
      desc.style.display='none'
    }

    while(size>minFont&&(!headlineFits()||!copyFits())){
      size-=1;
      title.style.fontSize=size+'px'
    }
  })
}
function render(x){
  if(!safeItem(x))throw new Error('Notícia inválida');

  title.textContent=clean(x.title)||'Notícia';

  const body=summary(x.description||x.summary||'');
  desc.textContent=body;
  desc.style.display=body?'-webkit-box':'none';

  source.textContent=x.source||x.sourceDomain||'Fonte';

  const f=faviconUrl(x.link||x.url||x.sourceUrl||'');
  favicon.src=f;
  favicon.style.display=f?'block':'none';
  favicon.onerror=()=>favicon.style.display='none';

  setImage(x.image||x.image_url||x.imageUrl);

  const link=x.link||x.url||x.sourceUrl||'';
  if(link){
    qrImg.src=PV.qrUrl(link);
    qr.classList.remove('hidden');
    qrTitle.textContent=(x.link||x.url)?'Leia a matéria':'Acesse a fonte';
    qrHint.textContent=(x.link||x.url)?'Aponte a câmera do celular':'Abra o portal da fonte'
  }else{
    qr.classList.add('hidden');
    qrImg.removeAttribute('src')
  }

  requestAnimationFrame(()=>requestAnimationFrame(fitCopy))
}

function newsFromPlayer(timeout=1400){
  return new Promise((resolve,reject)=>{
    if(window.parent===window){reject(new Error('standalone'));return}
    const requestId='pv-news-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    let done=false;
    const finish=(fn,value)=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      window.removeEventListener('message',onMessage);
      fn(value)
    };
    const onMessage=(event)=>{
      if(event.origin!==location.origin)return;
      const data=event.data||{};
      if(data.type!=='pv-news-response'||data.requestId!==requestId)return;
      finish(resolve,{items:PV.filterSafeNews(data.items||[]),source:'PontoView',fromPlayer:true})
    };
    const timer=setTimeout(()=>finish(reject,new Error('timeout')),timeout);
    window.addEventListener('message',onMessage);
    window.parent.postMessage({type:'pv-news-request',requestId},location.origin)
  })
}

async function fetchNews(){
  try{
    const playerNews=await newsFromPlayer();
    if(Array.isArray(playerNews.items)&&playerNews.items.length)return playerNews
  }catch{}
  const data=await PV.fromApi('/api/noticias',()=>PV.fetchJSON(WORKER));
  return {...data,items:PV.filterSafeNews(Array.isArray(data?.items)?data.items:Array.isArray(data)?data:[])}
}

async function load(){
  try{
    const d=await fetchNews();
    const items=PV.filterSafeNews(Array.isArray(d.items)?d.items:[]).filter(safeItem);
    if(!items.length)throw new Error('Sem notícias seguras');
    const item=PV.pickForRefresh(items,'noticias',x=>String(x.link||x.url||x.title));
    render(item)
  }catch{
    title.textContent='Novas notícias em breve';
    desc.style.display='none';
    source.textContent='PontoView';
    favicon.style.display='none';
    media.classList.remove('has-image');
    qr.classList.add('hidden');
    requestAnimationFrame(fitCopy)
  }
}

window.addEventListener('resize',fitCopy);

if('ResizeObserver' in window){
  new ResizeObserver(fitCopy).observe(copy)
}

if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(fitCopy).catch(()=>{})
}

load();
</script>
</body>
</html>
