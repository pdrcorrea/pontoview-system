<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView • Horário</title>
<style>
:root{
  --bg:#f4f4f1;
  --ink:#14191f;
  --muted:#69717b;
  --pv:#08479A;
  --pv-dark:#032A61;
  --pv-cyan:#69CFF2;
}

*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,"Nunito Sans","Segoe UI",Arial,sans-serif;
}

.scene{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 79% 49%, rgba(105,207,242,.16), transparent 26%),
    var(--bg);
  isolation:isolate;
}

.scene::before{
  content:"";
  position:absolute;
  width:clamp(160px,18vw,310px);
  aspect-ratio:1;
  right:clamp(-120px,-5vw,-55px);
  top:clamp(-118px,-6vw,-55px);
  border-radius:34%;
  background:linear-gradient(135deg,var(--pv-cyan),var(--pv));
  transform:rotate(18deg);
  opacity:.10;
  z-index:-1;
}

.scene::after{
  content:"";
  position:absolute;
  width:clamp(100px,11vw,190px);
  aspect-ratio:1;
  left:clamp(-82px,-4vw,-38px);
  bottom:clamp(-78px,-4vw,-32px);
  border-radius:50%;
  background:linear-gradient(135deg,var(--pv-cyan),var(--pv-dark));
  opacity:.10;
  z-index:-1;
}

.brand{
  position:absolute;
  right:clamp(8px,.45vw,13px);
  top:50%;
  transform:translateY(-50%) rotate(90deg);
  transform-origin:right center;
  color:rgba(21,23,26,.18);
  font-size:clamp(8px,.58vw,11px);
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  user-select:none;
}

.content{
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);
  align-items:center;
  gap:clamp(28px,5vw,90px);
  padding:clamp(34px,5.8vw,110px);
}

.copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  animation:intro .9s cubic-bezier(.2,.8,.2,1) both;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:.7em;
  width:max-content;
  color:var(--pv);
  font-weight:800;
  font-size:clamp(12px,1.05vw,20px);
  letter-spacing:.16em;
  text-transform:uppercase;
}

.eyebrow::before{
  content:"";
  width:2.3em;
  height:2px;
  border-radius:99px;
  background:linear-gradient(90deg,var(--pv),var(--pv-cyan));
}

.time-row{
  display:flex;
  align-items:flex-end;
  gap:clamp(10px,1.4vw,26px);
  margin-top:clamp(16px,2vh,28px);
}

#time{
  font-size:clamp(92px,14vw,270px);
  line-height:.78;
  letter-spacing:-.075em;
  font-weight:850;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  text-wrap:nowrap;
}

#seconds{
  font-size:clamp(22px,2.8vw,54px);
  line-height:1;
  font-weight:700;
  color:var(--pv);
  font-variant-numeric:tabular-nums;
  margin-bottom:.12em;
  min-width:2ch;
}

.date{
  margin-top:clamp(22px,3vh,42px);
  display:flex;
  align-items:center;
  gap:clamp(12px,1vw,18px);
  color:var(--muted);
  font-size:clamp(18px,1.55vw,30px);
  font-weight:550;
  letter-spacing:-.02em;
}

.date .dot{
  width:.34em;
  aspect-ratio:1;
  border-radius:50%;
  background:var(--pv-cyan);
  box-shadow:0 0 0 .28em rgba(105,207,242,.13);
  flex:0 0 auto;
}

.visual{
  position:relative;
  aspect-ratio:1;
  width:min(42vw,620px);
  justify-self:end;
  display:grid;
  place-items:center;
  animation:introVisual 1.1s cubic-bezier(.2,.8,.2,1) .08s both;
}

.halo{
  position:absolute;
  inset:7%;
  border-radius:50%;
  background:radial-gradient(circle at 45% 40%, rgba(255,255,255,.9), rgba(255,255,255,.18) 54%, rgba(105,207,242,.06) 72%, transparent 73%);
  border:1px solid rgba(8,71,154,.08);
}

.orbit{
  position:absolute;
  inset:13%;
  border:1px solid rgba(8,71,154,.15);
  border-radius:50%;
  animation:spin 22s linear infinite;
}

.orbit::before{
  content:"";
  position:absolute;
  width:clamp(14px,1.5vw,26px);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--pv-cyan);
  top:8%;
  right:17%;
  box-shadow:0 0 0 clamp(7px,.65vw,12px) rgba(105,207,242,.13);
}

.clock-face{
  position:relative;
  width:56%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,255,255,.54);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 24px 70px rgba(3,42,97,.07);
  backdrop-filter:blur(16px);
}

.clock-face::before{
  content:"";
  position:absolute;
  inset:10%;
  border-radius:50%;
  border:1px solid rgba(20,25,31,.06);
}

.tick{
  position:absolute;
  left:50%;
  top:50%;
  width:2px;
  height:46%;
  transform-origin:50% 0;
}
.tick::after{
  content:"";
  display:block;
  width:2px;
  height:8%;
  min-height:6px;
  border-radius:10px;
  background:rgba(20,25,31,.20);
  transform:translateY(-100%);
}
.tick.major::after{height:13%;background:rgba(8,71,154,.42)}

.hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:50% 100%;
  border-radius:99px;
  translate:-50% 0;
}
.hour{width:clamp(5px,.55vw,9px);height:24%;background:var(--ink)}
.minute{width:clamp(3px,.34vw,6px);height:34%;background:var(--pv)}
.second{width:2px;height:38%;background:var(--pv-cyan)}
.center{
  position:absolute;
  left:50%;top:50%;
  width:clamp(12px,1.2vw,20px);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--pv);
  transform:translate(-50%,-50%);
  box-shadow:0 0 0 clamp(5px,.5vw,9px) rgba(8,71,154,.10);
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes intro{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes introVisual{from{opacity:0;transform:scale(.94) translateX(18px)}to{opacity:1;transform:none}}

@media (max-aspect-ratio: 4/5){
  .content{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
    align-content:center;
    gap:clamp(20px,5vh,54px);
    padding:clamp(34px,7vw,72px) clamp(28px,7vw,64px);
  }
  .copy{align-items:center;text-align:center;padding-top:3vh}
  .time-row{justify-content:center}
  #time{font-size:clamp(88px,24vw,210px)}
  #seconds{font-size:clamp(22px,5vw,42px)}
  .date{justify-content:center;font-size:clamp(17px,3.5vw,28px)}
  .visual{justify-self:center;width:min(78vw,56vh);align-self:start}
  .brand{right:6px}
}

@media (max-height:520px){
  .content{padding:24px 46px;gap:26px}
  .date{margin-top:15px}
  .visual{width:min(35vw,350px)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="scene">
  <section class="content" aria-label="Painel de horário PontoView">
    <div class="copy">
      <div class="eyebrow">Agora</div>
      <div class="time-row">
        <div id="time">--:--</div>
        <div id="seconds">--</div>
      </div>
      <div class="date">
        <span class="dot" aria-hidden="true"></span>
        <span id="date">Carregando data...</span>
      </div>
    </div>

    <div class="visual" aria-hidden="true">
      <div class="halo"></div>
      <div class="orbit"></div>
      <div class="clock-face" id="clockFace">
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minuteHand"></div>
        <div class="hand second" id="secondHand"></div>
        <div class="center"></div>
      </div>
    </div>
  </section>
  <div class="brand">PontoView</div>
</main>

<script>
const timeEl = document.getElementById('time');
const secondsEl = document.getElementById('seconds');
const dateEl = document.getElementById('date');
const hourHand = document.getElementById('hourHand');
const minuteHand = document.getElementById('minuteHand');
const secondHand = document.getElementById('secondHand');
const face = document.getElementById('clockFace');

for(let i=0;i<12;i++){
  const tick=document.createElement('div');
  tick.className='tick'+(i%3===0?' major':'');
  tick.style.transform=`rotate(${i*30}deg)`;
  face.appendChild(tick);
}

function updateClock(){
  const now=new Date();
  const h=now.getHours();
  const m=now.getMinutes();
  const s=now.getSeconds();

  timeEl.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  secondsEl.textContent=String(s).padStart(2,'0');
  dateEl.textContent=new Intl.DateTimeFormat('pt-BR',{
    weekday:'long', day:'2-digit', month:'long'
  }).format(now).replace(/^./,c=>c.toUpperCase());

  hourHand.style.transform=`rotate(${(h%12)*30 + m*.5}deg)`;
  minuteHand.style.transform=`rotate(${m*6 + s*.1}deg)`;
  secondHand.style.transform=`rotate(${s*6}deg)`;
}

updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
