<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saudações • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--accent:#f2a84b;--accent2:#8ec9ee}
.stage{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);align-items:center;gap:4vw}
.copy{padding-bottom:4vh}.time{font-size:clamp(82px,9vw,160px);font-weight:900;max-width:7ch;color:var(--ink)}
.msg{margin:30px 0 0;max-width:31ch;font-size:clamp(19px,1.65vw,30px);font-weight:700;color:var(--muted);line-height:1.42}
.art{display:grid;place-items:center}.icon-orbit{width:min(38vw,560px);aspect-ratio:1}
.hero-icon{font-size:min(15vw,210px);color:var(--accent)}
.ray{position:absolute;inset:7%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 26%,transparent);animation:spin 30s linear infinite}
.mini{position:absolute;font-size:clamp(28px,3vw,52px);color:color-mix(in srgb,var(--accent2) 68%,white);opacity:.7}
.m1{top:15%;left:3%}.m2{right:4%;bottom:22%}.m3{right:17%;top:7%;font-size:28px}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:52% 48%;padding-bottom:70px}.copy{align-self:end}.time{font-size:clamp(72px,16vw,118px)}.msg{font-size:clamp(18px,4.3vw,27px)}.icon-orbit{width:min(70vw,450px)}}
</style></head><body><div class="app"><main class="stage"><section class="copy"><h1 class="time" id="title">Bom dia.</h1><p class="msg" id="msg"></p></section><section class="art"><div class="icon-orbit"><div class="ray"></div><span class="material-symbols-rounded mini m1">cloud</span><span class="material-symbols-rounded mini m2">air</span><span class="material-symbols-rounded mini m3">flare</span><span class="material-symbols-rounded hero-icon" id="heroIcon">wb_sunny</span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script>
const h=new Date().getHours();
let d;
if(h<11)d={title:'Bom dia.',period:'Um novo dia',icon:'wb_sunny',accent:'#f3aa4e',msg:'Que o seu dia comece com leveza, boas ideias e um pouco de tempo para você.'};
else if(h<17)d={title:'Boa tarde.',period:'No ritmo da tarde',icon:'light_mode',accent:'#e89554',msg:'Que a tarde siga tranquila, produtiva e com bons encontros pelo caminho.'};
else if(h<20)d={title:'Boa noite.',period:'Fim de tarde',icon:'wb_twilight',accent:'#d27b74',msg:'O dia desacelera. Que a sua noite comece com calma e boas notícias.'};
else d={title:'Boa noite.',period:'Uma pausa para respirar',icon:'bedtime',accent:'#7688d8',msg:'Que a noite seja tranquila e traga o descanso que o corpo e a mente pedem.'};
document.documentElement.style.setProperty('--accent',d.accent); title.textContent=d.title; heroIcon.textContent=d.icon; msg.textContent=d.msg;
</script></body></html>
