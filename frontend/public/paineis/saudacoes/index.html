<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saudações • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--accent:#f2a84b;--accent2:#8ec9ee}.stage{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);align-items:center;gap:4vw}.copy{padding-bottom:4vh}.time{font-size:clamp(82px,9vw,160px);font-weight:900;max-width:7ch;color:var(--ink)}.msg{margin:30px 0 0;max-width:31ch;font-size:clamp(19px,1.65vw,30px);font-weight:700;color:var(--muted);line-height:1.42}.art{display:grid;place-items:center}.icon-orbit{width:min(38vw,560px);aspect-ratio:1}.hero-icon{font-size:min(15vw,210px);color:var(--accent)}.ray{position:absolute;inset:7%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 26%,transparent);transform:rotate(18deg)}.mini{position:absolute;font-size:clamp(28px,3vw,52px);color:color-mix(in srgb,var(--accent2) 68%,white);opacity:.7}.m1{top:15%;left:3%}.m2{right:4%;bottom:22%}.m3{right:17%;top:7%;font-size:28px}@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:52% 48%;padding-bottom:70px}.copy{align-self:end}.time{font-size:clamp(72px,16vw,118px)}.msg{font-size:clamp(18px,4.3vw,27px)}.icon-orbit{width:min(70vw,450px)}}
</style></head><body><div class="app"><main class="stage"><section class="copy"><h1 class="time" id="title">Bom dia.</h1><p class="msg" id="msg"></p></section><section class="art"><div class="icon-orbit"><div class="ray"></div><span class="material-symbols-rounded mini m1">cloud</span><span class="material-symbols-rounded mini m2">air</span><span class="material-symbols-rounded mini m3">flare</span><span class="material-symbols-rounded hero-icon" id="heroIcon">wb_sunny</span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script>
const h=new Date().getHours();let d;if(h<11)d={title:'Bom dia.',icon:'wb_sunny',accent:'#f3aa4e',accent2:'#8ec9ee',ink:'#2d4359',muted:'#6f7984',bg1:'#f6f1df',bg2:'#eee3c9',bg3:'#e8dcc0',msg:'Que o seu dia comece com leveza, boas ideias e um pouco de tempo para você.'};else if(h<17)d={title:'Boa tarde.',icon:'light_mode',accent:'#e89554',accent2:'#9dc7da',ink:'#334d6d',muted:'#6f7a88',bg1:'#f4f1e9',bg2:'#ece5da',bg3:'#e4dccd',msg:'Que a tarde siga tranquila, produtiva e com bons encontros pelo caminho.'};else if(h<20)d={title:'Boa noite.',icon:'wb_twilight',accent:'#d27b74',accent2:'#c7989d',ink:'#69473f',muted:'#8b7069',bg1:'#f3e6d8',bg2:'#ead8c7',bg3:'#e3cbb7',msg:'O dia desacelera. Que a sua noite comece com calma e boas notícias.'};else d={title:'Boa noite.',icon:'bedtime',accent:'#7688d8',accent2:'#aab6d1',ink:'#26344a',muted:'#6f7b8d',bg1:'#eef1f6',bg2:'#e4e8f0',bg3:'#d9dfea',msg:'Que a noite seja tranquila e traga o descanso que o corpo e a mente pedem.'};
const r=document.documentElement.style;r.setProperty('--accent',d.accent);r.setProperty('--accent2',d.accent2);r.setProperty('--theme-accent',d.accent);r.setProperty('--theme-accent-2',d.accent2);r.setProperty('--theme-ink',d.ink);r.setProperty('--theme-muted',d.muted);r.setProperty('--bg1',d.bg1);r.setProperty('--bg2',d.bg2);r.setProperty('--bg3',d.bg3);const options=[{title:d.title,msg:d.msg},{title:'Bem-vindo.',msg:'Que o seu tempo aqui seja confortável, agradável e bem informado.'}];const selected=options[pickPanelIndex(options.length,'saudacoes')];title.textContent=selected.title;msg.textContent=selected.msg;heroIcon.textContent=d.icon;
</script></body></html>
