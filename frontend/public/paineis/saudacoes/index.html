<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saudações • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--accent:#f2a84b;--accent2:#8ec9ee}.stage{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);align-items:center;gap:4vw}.copy{padding-bottom:4vh}.time{font-size:clamp(82px,9vw,160px);font-weight:900;max-width:7ch;color:var(--ink)}.msg{margin:30px 0 0;max-width:31ch;font-size:clamp(19px,1.65vw,30px);font-weight:700;color:var(--muted);line-height:1.42}.art{display:grid;place-items:center}.icon-orbit{width:min(38vw,560px);aspect-ratio:1}.hero-icon{font-size:min(15vw,210px);color:var(--accent)}.ray{position:absolute;inset:7%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 26%,transparent);transform:rotate(18deg)}.mini{position:absolute;font-size:clamp(28px,3vw,52px);color:color-mix(in srgb,var(--accent2) 68%,white);opacity:.7}.m1{top:15%;left:3%}.m2{right:4%;bottom:22%}.m3{right:17%;top:7%;font-size:28px}@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:52% 48%;padding-bottom:70px}.copy{align-self:end}.time{font-size:clamp(72px,16vw,118px)}.msg{font-size:clamp(18px,4.3vw,27px)}.icon-orbit{width:min(70vw,450px)}}
body.night{background:radial-gradient(circle at 79% 16%,rgba(119,144,202,.13),transparent 25%),radial-gradient(circle at 12% 85%,rgba(65,95,161,.16),transparent 34%),linear-gradient(135deg,#101a31 0%,#172641 56%,#203454 100%);color:var(--ink)}body.night .icon-orbit{background:rgba(207,221,255,.075);border-color:rgba(194,213,255,.15);box-shadow:0 16px 55px rgba(3,10,28,.14)}body.night .icon-orbit::before,body.night .icon-orbit::after{border-color:rgba(185,207,255,.15)}body.night .pv-orb.a{background:rgba(105,137,224,.09)}body.night .pv-orb.b{background:rgba(115,161,232,.08)}body.night .pv-wave{opacity:.55}body.night .mini{color:#9bb8e8}body.night .ray{border-color:rgba(160,188,245,.23)}
</style></head><body><div class="app"><main class="stage"><section class="copy"><h1 class="time" id="title">Bom dia.</h1><p class="msg" id="msg"></p></section><section class="art"><div class="icon-orbit"><div class="ray"></div><span class="material-symbols-rounded mini m1">cloud</span><span class="material-symbols-rounded mini m2">air</span><span class="material-symbols-rounded mini m3">flare</span><span class="material-symbols-rounded hero-icon" id="heroIcon">wb_sunny</span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script>
const greetings={
 morning:{title:'Bom dia.',icon:'wb_sunny',accent:'#f3aa4e',accent2:'#8ec9ee',ink:'#2d4359',muted:'#6f7984',msg:'Que o seu dia comece com leveza, boas ideias e um pouco de tempo para você.'},
 afternoon:{title:'Boa tarde.',icon:'light_mode',accent:'#e89554',accent2:'#9dc7da',ink:'#334d6d',muted:'#6f7a88',msg:'Que a tarde siga tranquila, produtiva e com bons encontros pelo caminho.'},
 evening:{title:'Boa noite.',icon:'bedtime',accent:'#c8d8ff',accent2:'#8ca9e6',ink:'#f2f6ff',muted:'#b9c7df',msg:'Que a noite seja tranquila e traga o descanso que o corpo e a mente pedem.'}
};
const selectedIndex=pickPanelIndex(2,'saudacoes');
const root=document.documentElement;
function refreshGreeting(){
 const hour=new Date().getHours();
 const period=hour>=18||hour<5?'evening':hour<12?'morning':'afternoon';
 const d=greetings[period];
 document.body.classList.toggle('night',period==='evening');
 const vars={'--accent':d.accent,'--accent2':d.accent2,'--theme-accent':d.accent,'--theme-accent-2':d.accent2,'--theme-ink':d.ink,'--theme-muted':d.muted};
 for(const [key,value] of Object.entries(vars))root.style.setProperty(key,value);
 const selected=selectedIndex===0?{title:d.title,msg:d.msg}:{title:'Bem-vindo.',msg:'Que o seu tempo aqui seja confortável, agradável e bem informado.'};
 document.getElementById('title').textContent=selected.title;
 document.getElementById('msg').textContent=selected.msg;
 document.getElementById('heroIcon').textContent=d.icon;
}
refreshGreeting();
setInterval(refreshGreeting,60*1000);
</script></body></html>
