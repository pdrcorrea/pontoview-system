<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conhecendo o Brasil • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#22352d;--theme-muted:#66746d;--theme-accent:#5d805f;--theme-accent-2:#8ea78f;--theme-soft:#c9d6c8;--bg1:#fbfbf8;--bg2:#f5f3ed;--bg3:#ebe7dd;--gold:#bc9751}
.stage{grid-template-columns:minmax(0,1.5fr) minmax(340px,.72fr);gap:clamp(26px,3vw,54px);align-items:stretch}.visual{position:relative;min-width:0;overflow:hidden;border-radius:clamp(28px,2.5vw,42px);box-shadow:var(--shadow);border:1px solid var(--line);background:linear-gradient(155deg,#dce7df,#cfdccf)}.slides{position:absolute;inset:0}.slide{position:absolute;inset:0;opacity:0;transform:scale(1.014);transition:opacity 1.3s var(--ease),transform 2.4s var(--ease)}.slide.active{opacity:1;transform:scale(1)}.slide img{width:100%;height:100%;display:block;object-fit:cover}.visual:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,28,21,.01) 42%,rgba(14,28,21,.43) 100%)}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 68% 25%,rgba(188,151,81,.15),transparent 28%),linear-gradient(145deg,#e6eee7,#cfdccc);color:rgba(61,91,68,.38)}.fallback .material-symbols-rounded{font-size:min(18vw,250px);font-variation-settings:'wght' 300}.visual.has-images .fallback{display:none}.pager{position:absolute;left:24px;top:24px;z-index:5;display:none;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;background:rgba(20,33,26,.31);backdrop-filter:blur(7px)}.visual.has-many .pager{display:flex}.dots{display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.86);background:transparent;transition:all .45s ease}.dot.active{width:12px;height:12px;border-color:#fff;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}.caption{position:absolute;left:24px;right:24px;bottom:24px;z-index:5;display:none;align-items:center;gap:10px;max-width:min(72%,760px);padding:13px 16px;border-radius:18px;background:rgba(21,33,27,.37);color:#fff;backdrop-filter:blur(7px);font-size:clamp(14px,1.08vw,19px);font-weight:700}.visual.has-images .caption{display:flex}.caption .material-symbols-rounded{font-size:21px}.info{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,1vw,20px) 0}.panel-label{display:inline-flex;align-items:center;gap:8px;width:max-content;color:#55735a;font-size:clamp(12px,.92vw,14px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.panel-label .material-symbols-rounded{font-size:1.4em}.eyebrow{display:inline-flex;align-items:center;width:max-content;margin-top:30px;padding:9px 13px;border-radius:999px;background:rgba(93,128,95,.10);color:#4f7254;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.title{margin:22px 0 0;font-size:clamp(58px,5.35vw,102px);line-height:.92;letter-spacing:-.055em;font-weight:900;max-width:9ch}.location{margin-top:22px;display:flex;align-items:center;gap:9px;color:#596860;font-size:clamp(15px,1.2vw,21px);font-weight:800}.location .material-symbols-rounded{font-size:21px;color:var(--gold)}.description{margin:32px 0 0;color:#56635d;font-size:clamp(17px,1.3vw,23px);line-height:1.5;font-weight:700;max-width:34ch}.source{margin-top:28px;color:rgba(74,86,79,.54);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.thumb-strip{margin-top:26px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-width:430px}.thumb{aspect-ratio:1.18/1;border-radius:14px;overflow:hidden;border:2px solid transparent;background:rgba(93,128,95,.08);opacity:.55;transition:border-color .45s ease,opacity .45s ease,transform .45s ease}.thumb.active{border-color:var(--gold);opacity:1;transform:translateY(-2px)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb-strip:empty{display:none}
@media(orientation:portrait),(max-aspect-ratio:4/5){.stage{grid-template-columns:1fr;grid-template-rows:minmax(0,57%) minmax(0,43%);gap:22px;padding:22px}.info{justify-content:flex-start;padding:0}.panel-label{display:none}.eyebrow{margin-top:0}.title{font-size:clamp(48px,10vw,82px);margin-top:16px;max-width:12ch}.location{margin-top:13px}.description{font-size:clamp(16px,3.35vw,22px);margin-top:18px;max-width:42ch}.source{margin-top:18px}.thumb-strip{display:none}.caption{max-width:calc(100% - 48px)}}
@media(max-width:700px){.stage{padding:15px;gap:15px}.visual{border-radius:24px}.pager{left:14px;top:14px}.caption{left:14px;right:14px;bottom:14px;max-width:calc(100% - 28px)}}
@media(prefers-reduced-motion:reduce){.slide,.dot,.thumb{transition:none!important}}
</style></head><body><div class="app"><div class="boot"><div class="loader-card"><div class="loader-mark" aria-hidden="true"><svg viewBox="40 30 215 205"><circle class="core" cx="144.5" cy="136.5" r="47.5" fill="currentColor"/><g class="arcs" fill="currentColor"><path d="M190 45 L188 48 L189 55 L208 68 L220 83 L226 98 L228 108 L233 111 L238 110 L242 105 L240 93 L238 90 L237 85 L227 67 L213 53 L204 47 L196 43 Z"/><path d="M55 144 L51 148 L52 163 L56 177 L65 194 L74 204 L89 215 L104 222 L109 221 L112 218 L113 215 L112 211 L107 207 L101 205 L91 199 L81 190 L73 179 L69 170 L66 158 L65 148 L63 145 L59 143 Z"/></g></svg></div><strong>Preparando Conteúdo</strong><div class="loader-bar"></div></div></div><main class="stage"><section class="visual" id="visual"><div class="fallback"><span class="material-symbols-rounded">landscape</span></div><div class="slides" id="slides"></div><div class="pager"><div class="dots" id="dots"></div></div><div class="caption"><span class="material-symbols-rounded">photo_camera</span><span id="captionText">Um novo olhar sobre este destino.</span></div></section><section class="info"><div class="panel-label"><span class="material-symbols-rounded">travel_explore</span><span>Conhecendo o Brasil</span></div><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><div class="location"><span class="material-symbols-rounded">location_on</span><span id="location"></span></div><p class="description" id="description"></p><div class="thumb-strip" id="thumbs" aria-hidden="true"></div><div class="source">Imagens e referência • Wikipedia / Wikimedia</div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div><script src="../shared/panel-v2.js"></script><script src="../shared/pv.js?v=8"></script><script>
const destinations=[
{id:'pedra-azul',region:'Sudeste',kind:'Natureza',title:'Pedra Azul',location:'Domingos Martins • Espírito Santo',wiki:'Parque Estadual da Pedra Azul',text:'Na serra capixaba, a formação de granito e gnaisse se eleva sobre a Mata Atlântica e cria uma das paisagens mais conhecidas do Espírito Santo. A região também é marcada pelo clima de montanha e por trilhas em meio à vegetação.'},
{id:'lencois',region:'Nordeste',kind:'Natureza',title:'Lençóis Maranhenses',location:'Maranhão',wiki:'Parque Nacional dos Lençóis Maranhenses',text:'Dunas brancas se estendem por uma enorme área próxima ao litoral. Durante a estação chuvosa, lagoas de água doce se formam entre elas, criando uma paisagem que muda bastante ao longo do ano.'},
{id:'alter',region:'Norte',kind:'Natureza',title:'Alter do Chão',location:'Santarém • Pará',wiki:'Alter do Chão (Santarém)',text:'Às margens do rio Tapajós, Alter do Chão combina águas claras, praias de rio e floresta amazônica. Na época de vazante, bancos de areia aparecem e transformam completamente o desenho da paisagem.'},
{id:'ouro-preto',region:'Sudeste',kind:'História',title:'Ouro Preto',location:'Minas Gerais',wiki:'Ouro Preto',text:'Entre ladeiras, igrejas e casarios coloniais, Ouro Preto preserva um conjunto urbano ligado ao ciclo do ouro e ao barroco mineiro. Seu centro histórico foi um dos primeiros bens brasileiros reconhecidos pela UNESCO.'},
{id:'iguacu',region:'Sul',kind:'Natureza',title:'Cataratas do Iguaçu',location:'Foz do Iguaçu • Paraná',wiki:'Cataratas do Iguaçu',text:'Na fronteira entre Brasil e Argentina, centenas de quedas formam um dos maiores sistemas de cataratas do planeta. A paisagem está cercada por áreas protegidas de Mata Atlântica.'},
{id:'chapada-diamantina',region:'Nordeste',kind:'Natureza',title:'Chapada Diamantina',location:'Bahia',wiki:'Chapada Diamantina',text:'Montanhas, vales, cânions, grutas e cachoeiras compõem uma das regiões naturais mais variadas da Bahia. O relevo elevado guarda mirantes e trilhas que atravessam diferentes tipos de vegetação.'},
{id:'noronha',region:'Nordeste',kind:'Natureza',title:'Fernando de Noronha',location:'Pernambuco',wiki:'Fernando de Noronha',text:'O arquipélago reúne praias, falésias e águas transparentes em pleno Atlântico. Parte importante do território é protegida para conservar ecossistemas marinhos e terrestres de grande biodiversidade.'},
{id:'teatro-amazonas',region:'Norte',kind:'Patrimônio',title:'Teatro Amazonas',location:'Manaus • Amazonas',wiki:'Teatro Amazonas',text:'Inaugurado no fim do século XIX, o teatro se tornou um dos símbolos de Manaus. Sua cúpula colorida e a decoração interna lembram o período em que a economia da borracha transformou a cidade.'},
{id:'bonito',region:'Centro-Oeste',kind:'Natureza',title:'Bonito',location:'Mato Grosso do Sul',wiki:'Bonito (Mato Grosso do Sul)',text:'Rios de águas transparentes, cavernas e nascentes fazem de Bonito um dos principais destinos de natureza do Centro-Oeste. A geologia calcária da região ajuda a explicar a clareza incomum de muitos rios.'},
{id:'missoes',region:'Sul',kind:'História',title:'São Miguel das Missões',location:'Rio Grande do Sul',wiki:'Sítio Arqueológico de São Miguel Arcanjo',text:'As ruínas da antiga redução jesuítica de São Miguel Arcanjo preservam parte da história das missões guaranis no sul do continente. O conjunto integra um patrimônio cultural reconhecido internacionalmente.'},
{id:'veadeiros',region:'Centro-Oeste',kind:'Natureza',title:'Chapada dos Veadeiros',location:'Goiás',wiki:'Parque Nacional da Chapada dos Veadeiros',text:'Planaltos, cânions, rios e cachoeiras formam a paisagem da Chapada dos Veadeiros. O parque protege extensas áreas de Cerrado e abriga espécies adaptadas a esse bioma tão característico do Brasil central.'},
{id:'salvador',region:'Nordeste',kind:'Patrimônio',title:'Centro Histórico de Salvador',location:'Bahia',wiki:'Centro Histórico de Salvador',text:'Casarios coloridos, igrejas, ladeiras e praças contam capítulos importantes da formação do Brasil. O centro histórico reúne influências africanas, europeias e indígenas em uma paisagem urbana muito própria.'},
{id:'serra-capivara',region:'Nordeste',kind:'Arqueologia',title:'Serra da Capivara',location:'Piauí',wiki:'Parque Nacional da Serra da Capivara',text:'O parque reúne formações rochosas, paisagens da Caatinga e uma das maiores concentrações de sítios arqueológicos das Américas. Muitas paredes preservam pinturas rupestres produzidas há milhares de anos.'},
{id:'marajo',region:'Norte',kind:'Natureza',title:'Ilha de Marajó',location:'Pará',wiki:'Ilha de Marajó',text:'Na foz do Amazonas, Marajó reúne campos alagáveis, manguezais, praias e comunidades com tradições próprias. A ilha também é conhecida pela criação de búfalos e pela cerâmica inspirada em antigas culturas amazônicas.'},
{id:'paraty',region:'Sudeste',kind:'Patrimônio',title:'Paraty',location:'Rio de Janeiro',wiki:'Paraty',text:'Entre mar e serra, Paraty preserva ruas de pedra e arquitetura colonial cercadas pela Mata Atlântica. A relação entre patrimônio cultural e paisagem natural é uma das marcas mais fortes do destino.'},
{id:'aparados',region:'Sul',kind:'Natureza',title:'Aparados da Serra',location:'Rio Grande do Sul • Santa Catarina',wiki:'Parque Nacional de Aparados da Serra',text:'Grandes cânions cortam o planalto na divisa entre Rio Grande do Sul e Santa Catarina. Paredões verticais, campos de altitude e neblina frequente dão à região uma aparência quase cinematográfica.'},
{id:'brasilia',region:'Centro-Oeste',kind:'Arquitetura',title:'Brasília',location:'Distrito Federal',wiki:'Brasília',text:'Planejada no século XX, Brasília combina o desenho urbano de Lúcio Costa com edifícios marcantes de Oscar Niemeyer. A cidade se tornou um dos principais símbolos da arquitetura moderna brasileira.'},
{id:'monte-roraima',region:'Norte',kind:'Natureza',title:'Monte Roraima',location:'Roraima',wiki:'Monte Roraima',text:'O enorme tepui de topo quase plano se ergue na tríplice fronteira entre Brasil, Venezuela e Guiana. Suas paredes rochosas, nuvens e vegetação adaptada à altitude criam uma paisagem muito diferente do restante da Amazônia.'},
{id:'vila-velha-pr',region:'Sul',kind:'Geologia',title:'Vila Velha',location:'Ponta Grossa • Paraná',wiki:'Parque Estadual de Vila Velha',text:'A erosão esculpiu grandes formações de arenito em formatos que lembram torres, taças e muralhas. O parque também reúne furnas e lagoas, revelando milhões de anos de história geológica.'},
{id:'jalapao',region:'Norte',kind:'Natureza',title:'Jalapão',location:'Tocantins',wiki:'Jalapão',text:'Dunas douradas, rios, cachoeiras e fervedouros aparecem em meio ao Cerrado do Tocantins. A combinação de areia, água transparente e vegetação cria uma paisagem singular no interior do país.'}
];
const visual=document.getElementById('visual'),slidesEl=document.getElementById('slides'),dotsEl=document.getElementById('dots'),thumbsEl=document.getElementById('thumbs'),captionText=document.getElementById('captionText'),eyebrow=document.getElementById('eyebrow'),title=document.getElementById('title'),locationEl=document.getElementById('location'),description=document.getElementById('description');
const ROTATE_MS=12000;let images=[],index=0,timer=0;
function cleanName(v){return String(v||'').replace(/^File:/i,'').toLowerCase()}
function acceptableFile(title){const n=cleanName(title);if(!/\.(jpe?g|png|webp)$/i.test(n))return false;return !/(logo|flag|bandeira|bras[aã]o|coat.of.arms|mapa|map |map\.|locator|localiza|icon|pictogram|symbol|seal|escudo|diagrama|diagram|grafico|gráfico|route|rodovia|highway|svg)/i.test(n)}
async function fetchImages(item){const articleUrl='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|images&piprop=thumbnail&pithumbsize=1500&imlimit=40&titles='+encodeURIComponent(item.wiki);try{const data=await PV.cachedJSON(articleUrl,7*24*60*60*1000,{},6500);const pages=data&&data.query&&data.query.pages?Object.values(data.query.pages):[];const page=pages[0]||{};const urls=[];if(page.thumbnail&&page.thumbnail.source)urls.push(page.thumbnail.source);const names=(page.images||[]).map(x=>x.title).filter(acceptableFile).slice(0,12);if(names.length){const mediaUrl='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=1500&titles='+encodeURIComponent(names.join('|'));const media=await PV.cachedJSON(mediaUrl,7*24*60*60*1000,{},6500);const mediaPages=media&&media.query&&media.query.pages?Object.values(media.query.pages):[];for(const p of mediaPages){const info=p.imageinfo&&p.imageinfo[0];const u=info&&(info.thumburl||info.url);if(u)urls.push(u)}}return [...new Set(urls)].slice(0,4)}catch(e){return[]}}
function renderSlides(){slidesEl.innerHTML='';dotsEl.innerHTML='';thumbsEl.innerHTML='';visual.classList.toggle('has-images',images.length>0);visual.classList.toggle('has-many',images.length>1);images.forEach((url,i)=>{const slide=document.createElement('div');slide.className='slide'+(i===0?' active':'');const img=document.createElement('img');img.src=url;img.alt='';img.decoding='async';slide.appendChild(img);slidesEl.appendChild(slide);const dot=document.createElement('span');dot.className='dot'+(i===0?' active':'');dotsEl.appendChild(dot);const thumb=document.createElement('div');thumb.className='thumb'+(i===0?' active':'');const ti=document.createElement('img');ti.src=url;ti.alt='';ti.decoding='async';thumb.appendChild(ti);thumbsEl.appendChild(thumb)});index=0;captionText.textContent=images.length>1?'Uma nova perspectiva do mesmo destino.':'Uma paisagem para conhecer com calma.'}
function show(next){if(images.length<2)return;index=(next+images.length)%images.length;[...slidesEl.children].forEach((el,i)=>el.classList.toggle('active',i===index));[...dotsEl.children].forEach((el,i)=>el.classList.toggle('active',i===index));[...thumbsEl.children].forEach((el,i)=>el.classList.toggle('active',i===index));captionText.textContent=index===0?'Vista principal do destino.':index===1?'Outro ângulo revela novos detalhes da paisagem.':index===2?'A paisagem muda quando o enquadramento muda.':'Mais um olhar sobre este lugar.'}
function startRotation(){clearInterval(timer);if(images.length>1)timer=setInterval(()=>show(index+1),ROTATE_MS)}
async function load(){const item=pickBalancedPanelItem(destinations,'conhecendo-brasil',x=>x.region);eyebrow.textContent=item.region+' • '+item.kind;title.textContent=item.title;locationEl.textContent=item.location;description.textContent=item.text;images=await fetchImages(item);renderSlides();showLoader(300);startRotation()}
load();
</script></body></html>
