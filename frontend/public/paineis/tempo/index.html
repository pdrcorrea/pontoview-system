<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Previsão do Tempo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f6fbff;background:#071a2d;--line:rgba(173,211,238,.14);--soft:#9eb4c6;--sky:#69cff2;--panel:rgba(255,255,255,.055)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 15% 5%,rgba(53,139,199,.16),transparent 30%),linear-gradient(145deg,#071a2d,#0b2741 60%,#0b2035)}
    .shell{height:100%;padding:clamp(28px,4.2vw,74px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(22px,3vh,42px)}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}header small{display:block;color:var(--sky);font-size:clamp(10px,.85vw,15px);font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}header h1{margin:0;font-size:clamp(25px,2.4vw,46px);line-height:1.05;letter-spacing:-.04em}#place{color:var(--soft);font-size:clamp(11px,.9vw,16px);margin-top:9px}.state{font-size:clamp(9px,.7vw,12px);color:var(--soft);padding:8px 11px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.state.stale:before{content:'●';color:#f4c76d;margin-right:6px}.state.live:before{content:'●';color:#6fd7a6;margin-right:6px}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,70px)}
    .current{min-width:0;display:flex;flex-direction:column;justify-content:center}.hero{display:grid;grid-template-columns:minmax(125px,190px) minmax(0,1fr);align-items:center;gap:clamp(14px,2vw,30px)}.weather-icon{width:min(14vw,190px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.14),rgba(105,207,242,.06) 55%,transparent)}.weather-icon span{font-size:clamp(66px,7vw,110px);color:#d9f3ff}.temp{font-size:clamp(76px,8.5vw,140px);font-weight:300;line-height:.82;letter-spacing:-.075em}.condition{font-size:clamp(17px,1.5vw,27px);font-weight:700;margin-top:18px}.range{display:flex;gap:20px;color:var(--soft);font-size:clamp(11px,.9vw,16px);margin-top:11px}.range b{color:#fff}.range .min{color:var(--sky)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:clamp(25px,4vh,44px)}.metric{padding:clamp(13px,1.4vw,21px);border-radius:18px;background:var(--panel);border:1px solid var(--line)}.metric small{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:clamp(8px,.65vw,11px);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.metric small span{font-size:1.55em;color:var(--sky)}.metric b{display:block;margin-top:10px;font-size:clamp(17px,1.6vw,29px)}
    .forecast{min-width:0;display:flex;flex-direction:column;justify-content:center}.forecast-title{color:var(--soft);font-size:clamp(10px,.8vw,14px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}.days{min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}.day{display:grid;grid-template-columns:minmax(78px,.8fr) 50px minmax(0,1.4fr) auto;align-items:center;gap:12px;padding:clamp(12px,1.4vw,20px);border-radius:19px;background:var(--panel);border:1px solid var(--line)}.day:first-child{border-color:rgba(105,207,242,.3);background:rgba(105,207,242,.07)}.day-name{font-size:clamp(12px,1vw,17px);font-weight:800;text-transform:uppercase}.day-date{color:var(--soft);font-size:clamp(8px,.62vw,11px);margin-top:4px}.day-icon{font-size:clamp(28px,2.5vw,43px);color:#d9f3ff}.day-desc{font-size:clamp(11px,.9vw,16px);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rain{color:var(--soft);font-size:clamp(8px,.62vw,11px);margin-top:4px}.temps{display:flex;gap:13px;font-size:clamp(14px,1.15vw,20px);font-weight:750}.temps .min{color:var(--sky)}
    .error{display:none;position:absolute;inset:0;background:#071a2d;place-items:center;text-align:center;padding:40px}.error.show{display:grid}.error span{font-size:54px;color:var(--sky)}.error h2{margin:12px 0 6px}.error p{margin:0;color:var(--soft);max-width:460px;line-height:1.5}
    @media(orientation:portrait),(max-aspect-ratio:4/5){.shell{padding:clamp(28px,6vw,64px)}main{grid-template-columns:1fr;grid-template-rows:minmax(0,.44fr) minmax(0,.56fr);gap:20px}.current{justify-content:flex-start}.hero{grid-template-columns:minmax(105px,180px) 1fr}.weather-icon{width:min(30vw,180px)}.metrics{margin-top:20px}.forecast{justify-content:stretch}.days{gap:8px}.day{grid-template-columns:72px 42px minmax(0,1fr) auto;padding:11px 13px}}
    @media(max-width:650px){.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:10px}.day{grid-template-columns:62px 34px minmax(0,1fr) 72px;gap:7px}.temps{gap:7px}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><small>Clima</small><h1>Previsão do Tempo</h1><div id="place">Carregando localização…</div></div>
      <div id="state" class="state">Atualizando dados…</div>
    </header>
    <main>
      <section class="current">
        <div class="hero">
          <div class="weather-icon"><span class="material-symbols-outlined" id="wx">cloud</span></div>
          <div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Atualizando…</div><div class="range"><span>mín <b class="min" id="min">--°</b></span><span>máx <b id="max">--°</b></span></div></div>
        </div>
        <div class="metrics">
          <div class="metric"><small><span class="material-symbols-outlined">device_thermostat</span>Sensação</small><b id="feel">--°</b></div>
          <div class="metric"><small><span class="material-symbols-outlined">air</span>Vento</small><b id="wind">--</b></div>
          <div class="metric"><small><span class="material-symbols-outlined">opacity</span>Umidade</small><b id="humidity">--</b></div>
        </div>
      </section>
      <section class="forecast"><div class="forecast-title">Próximos dias</div><div class="days" id="days"></div></section>
    </main>
  </div>
  <div class="error" id="error"><div><span class="material-symbols-outlined">cloud_off</span><h2>Previsão temporariamente indisponível</h2><p>O painel tentará novamente automaticamente na próxima exibição.</p></div></div>
<script>
const WEATHER_ENDPOINT='https://fpdojntvnhiszagczfqr.supabase.co/functions/v1/screens-weather';
const $=id=>document.getElementById(id);const el={place:$('place'),state:$('state'),wx:$('wx'),temp:$('temp'),condition:$('condition'),min:$('min'),max:$('max'),feel:$('feel'),wind:$('wind'),humidity:$('humidity'),days:$('days'),error:$('error')};
const qs=(name,fallback='')=>new URLSearchParams(location.search).get(name)||fallback;
const icon=c=>{c=Number(c);if(c<=1)return'wb_sunny';if(c===2)return'partly_cloudy_day';if(c===3)return'cloud';if([45,48].includes(c))return'blur_on';if([51,53,55].includes(c))return'grain';if([61,63,65,80,81,82].includes(c))return'umbrella';if([71,73,75].includes(c))return'ac_unit';if([95,96,99].includes(c))return'thunderstorm';return'cloud'};
async function locate(){let lat=Number(qs('lat','NaN')),lon=Number(qs('lon','NaN')),name=qs('cidade','');if(Number.isFinite(lat)&&Number.isFinite(lon))return{latitude:lat,longitude:lon,name:name||'Local configurado'};try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),3500);const r=await fetch('https://ipwho.is/?lang=pt',{signal:ctrl.signal});clearTimeout(timer);const d=await r.json();lat=Number(d.latitude);lon=Number(d.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon))return{latitude:lat,longitude:lon,name:name||[d.city,d.region_code].filter(Boolean).join(', ')}}catch{}return{latitude:-19.5394,longitude:-40.6306,name:name||'Colatina, ES'}}
function render(d){el.error.classList.remove('show');el.place.textContent=d.name||'Local configurado';el.state.className='state '+(d.stale?'stale':'live');el.state.textContent=d.stale?'Último dado disponível':'Dados atualizados';el.wx.textContent=icon(d.weather_code);el.temp.textContent=d.temperature!=null?Math.round(d.temperature)+'°':'—';el.condition.textContent=d.condition||'Tempo variável';el.min.textContent=d.temp_min!=null?Math.round(d.temp_min)+'°':'—';el.max.textContent=d.temp_max!=null?Math.round(d.temp_max)+'°':'—';el.feel.textContent=d.apparent_temperature!=null?Math.round(d.apparent_temperature)+'°':'—';el.wind.textContent=d.wind_speed!=null?Math.round(d.wind_speed)+' km/h':'—';el.humidity.textContent=d.humidity!=null?Math.round(d.humidity)+'%':'—';const list=Array.isArray(d.forecast)?d.forecast.slice(0,4):[];el.days.innerHTML='';list.forEach((day,i)=>{const date=new Date(day.date+'T12:00:00');const row=document.createElement('div');row.className='day';const label=i===0?'Hoje':i===1?'Amanhã':date.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');row.innerHTML=`<div><div class="day-name">${label}</div><div class="day-date">${date.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')}</div></div><span class="material-symbols-outlined day-icon">${icon(day.weather_code)}</span><div><div class="day-desc">${day.condition||'Tempo variável'}</div><div class="rain">Chuva: ${Math.round(Number(day.precipitation_probability||0))}%</div></div><div class="temps"><span class="min">${day.temp_min!=null?Math.round(day.temp_min)+'°':'—'}</span><span>${day.temp_max!=null?Math.round(day.temp_max)+'°':'—'}</span></div>`;el.days.appendChild(row)});if(!list.length)el.days.innerHTML='<div class="day"><div><div class="day-name">Previsão</div><div class="day-date">aguardando dados</div></div></div>'}
async function load(){const loc=await locate();el.place.textContent=loc.name;try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);const response=await fetch(WEATHER_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(loc),signal:ctrl.signal});clearTimeout(timer);if(!response.ok)throw new Error('HTTP '+response.status);render(await response.json())}catch(error){console.error(error);el.state.className='state stale';el.state.textContent='Sem atualização';el.error.classList.add('show')}}
load();
</script>
</body>
</html>
