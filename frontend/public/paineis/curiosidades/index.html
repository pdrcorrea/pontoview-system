<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curiosidades • PontoView</title><link rel="stylesheet" href="../shared/panel-v2.css"><style>
:root{--theme-ink:#2f251d;--theme-muted:#7b6855;--theme-accent:#b89058;--theme-accent-2:#d1ad76;--theme-soft:#ead5a9;--bg1:#fdfbf7;--bg2:#f8f2e8;--bg3:#efe4cf}
.stage{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:4vw;align-items:center}.copy{transition:opacity .28s ease,transform .28s ease}.copy.changing{opacity:0;transform:translateY(6px)}
.copy h1{font-size:clamp(52px,5.8vw,100px);margin-top:18px;max-width:11ch}.copy p{font-size:clamp(18px,1.45vw,25px);max-width:48ch;margin:25px 0 0;font-weight:700}
.media{height:min(76vh,730px);border-radius:clamp(28px,3vw,44px);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;position:relative;overflow:hidden}.media:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 65% 28%,rgba(184,144,88,.18),transparent 28%),linear-gradient(155deg,rgba(184,144,88,.06),rgba(184,144,88,.12))}.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}.media.has-image img{opacity:1}.media.has-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,26,18,.02),rgba(35,26,18,.35))}.big-icon{position:absolute;inset:0;display:grid;place-items:center;font-size:min(20vw,270px);color:rgba(184,144,88,.20);font-variation-settings:'wght' 350}.media.has-image .big-icon{opacity:0}.media-footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:20px}.tag{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-weight:900;color:var(--blue);font-size:12px;text-transform:uppercase;letter-spacing:.09em}.counter{font-weight:900;color:rgba(47,37,29,.55);padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.72)}.progress{margin-top:30px;max-width:430px}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:56% 44%;gap:22px;padding-bottom:72px}.copy h1{font-size:clamp(44px,9vw,74px)}.copy p{font-size:clamp(16px,3.5vw,22px)}.media{height:100%}}
</style></head><body><div class="app"><div class="boot"><div class="loader-card"><div class="loader-mark" aria-hidden="true"><svg viewBox="40 30 215 205"><circle class="core" cx="144.5" cy="136.5" r="47.5" fill="#aebbc5"/><g class="arcs" fill="#8f9ca6"><path d="M190 45 L188 48 L189 55 L208 68 L220 83 L226 98 L228 108 L233 111 L238 110 L242 105 L240 93 L238 90 L237 85 L227 67 L213 53 L204 47 L196 43 Z"/><path d="M55 144 L51 148 L52 163 L56 177 L65 194 L74 204 L89 215 L104 222 L109 221 L112 218 L113 215 L112 211 L107 207 L101 205 L91 199 L81 190 L73 179 L69 170 L66 158 L65 148 L63 145 L59 143 Z"/></g></svg></div><strong>Preparando Conteúdo</strong><div class="loader-bar"></div></div></div>
<main class="stage"><section class="copy" id="copy"><div class="kicker"><span class="material-symbols-rounded">lightbulb</span><span>Curiosidades</span></div><h1 id="title"></h1><p class="body" id="text"></p><div class="progress"><span id="prog"></span></div></section><section class="media glass" id="media"><img id="image" alt=""><span class="material-symbols-rounded big-icon" id="icon">auto_awesome</span><div class="media-footer"><span class="tag" id="tag"></span><span class="counter" id="count"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script src="../shared/pv.js?v=8"></script><script>
const copy=document.getElementById('copy'),media=document.getElementById('media'),image=document.getElementById('image'),title=document.getElementById('title'),text=document.getElementById('text'),tag=document.getElementById('tag'),icon=document.getElementById('icon'),count=document.getElementById('count');
const fallback=[{title:'O polvo tem três corações',text:'Dois corações bombeiam sangue para as brânquias e um terceiro envia sangue para o restante do corpo. Durante a natação, o coração responsável pelo corpo reduz sua atividade. Por isso, polvos costumam preferir deslocamentos pelo fundo.',tag:'Natureza',icon:'water',image:''},{title:'A luz do Sol leva cerca de oito minutos até a Terra',text:'Mesmo viajando a aproximadamente 300 mil quilômetros por segundo, a luz precisa de alguns minutos para percorrer a distância média entre o Sol e o nosso planeta. Isso significa que sempre vemos o Sol alguns minutos no passado.',tag:'Ciência',icon:'wb_sunny',image:''},{title:'Pontes podem mudar de tamanho ao longo do dia',text:'Materiais se expandem com o calor e se contraem no frio. Grandes pontes usam juntas de dilatação justamente para acomodar esses pequenos movimentos sem danificar a estrutura.',tag:'Engenharia',icon:'architecture',image:''}];
let items=[],itemIndex=0,pages=[],pageIndex=0,timer=null;const PAGE_MS=14000;
function clean(t){return PV.clean(t||'').replace(/\s+/g,' ').trim()}
function splitText(t){const s=clean(t).match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean(t)];const out=[];let p='';for(const x of s){if((p+x).length>330&&p){out.push(p.trim());p=x}else p+=x}if(p.trim())out.push(p.trim());return out.slice(0,3)}
function setImage(item){tag.textContent=item.tag||'Conhecimento';icon.textContent=item.icon||'auto_awesome';image.decoding='async';image.onload=()=>media.classList.add('has-image');image.onerror=()=>media.classList.remove('has-image');if(item.image){image.src=item.image}else{image.removeAttribute('src');media.classList.remove('has-image')}}
function setItem(index){itemIndex=index%items.length;const item=items[itemIndex];pages=splitText(item.text);pageIndex=0;setImage(item);renderPage(false)}
function renderPage(animate=true){const item=items[itemIndex],doRender=()=>{title.textContent=item.title;text.textContent=pages[pageIndex]||item.text;count.textContent=(pageIndex+1)+' / '+pages.length;setProgress('prog',pageIndex,pages.length)};if(!animate){doRender();return}copy.classList.add('changing');setTimeout(()=>{doRender();copy.classList.remove('changing')},190)}
function step(){if(pages.length<=1)return;pageIndex=(pageIndex+1)%pages.length;renderPage(true);timer=setTimeout(step,PAGE_MS)}
async function directData(){const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=8&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1100&inprop=url';const data=await PV.fetchJSON(url);const wikiPages=data&&data.query&&data.query.pages?Object.values(data.query.pages):[];const banned=/(desambig|lista de|eleição|partido|porn|crime|assassin|guerra|morte|doença rara)/i;return wikiPages.map(p=>({title:clean(p.title),text:clean(p.extract),image:p.thumbnail&&p.thumbnail.source||'',tag:'Conhecimento',icon:'auto_awesome'})).filter(x=>x.title&&x.text.length>140&&!banned.test(x.title+' '+x.text)).slice(0,6)}
async function load(){try{const data=await PV.fromApi('/api/curiosidades',async()=>({items:await directData()}));items=Array.isArray(data.items)&&data.items.length?data.items:fallback}catch(e){try{items=await directData()}catch(_){items=fallback}}if(!items.length)items=fallback;setItem(pickPanelIndex(items.length,'curiosidades'));showLoader(350);if(pages.length>1)timer=setTimeout(step,PAGE_MS)}
load();
</script></body></html>
