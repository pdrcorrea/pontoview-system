<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PontoView Telas • Curiosidades</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,300..700,0,0" rel="stylesheet"><link rel="stylesheet" href="../shared/pontoview.css"><style>
body{background:linear-gradient(145deg,#0a4ea5,#043775 58%,#082a57)}.discovery{min-height:0;display:grid;grid-template-columns:minmax(0,58%) minmax(0,42%);gap:clamp(26px,3.2vw,52px);align-items:stretch}.fact{min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}.fact-number{position:absolute;top:2%;left:-1%;font-size:clamp(130px,17vw,270px);font-weight:800;line-height:1;color:rgba(255,255,255,.035);letter-spacing:-.08em;pointer-events:none}.fact-kicker{display:flex;align-items:center;gap:11px;color:var(--pv-sky);font-size:clamp(11px,.95vw,15px);font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:clamp(18px,2.5vh,30px);position:relative}.fact-title{margin:0;font-size:clamp(48px,5.35vw,88px);line-height:1.01;letter-spacing:-.055em;font-weight:650;text-wrap:balance;position:relative}.fact-text{margin:clamp(24px,3.2vh,38px) 0 0;font-size:clamp(18px,1.5vw,24px);line-height:1.58;color:rgba(247,251,255,.80);max-width:60ch;text-wrap:pretty;position:relative}.fact-footer{margin-top:clamp(26px,4vh,44px);display:flex;align-items:center;gap:14px}.page{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,251,255,.48)}.track{height:4px;flex:1;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pv-sky),#fff)}.discovery-card{min-height:0;position:relative;border-radius:clamp(26px,2.7vw,40px);overflow:hidden;border:1px solid rgba(255,255,255,.13);background:radial-gradient(circle at 38% 32%,rgba(105,207,242,.20),transparent 38%),rgba(255,255,255,.055)}.discovery-card::before,.discovery-card::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08);z-index:1}.discovery-card::before{width:72%;aspect-ratio:1;right:-18%;top:-12%;animation:pvRing 30s linear infinite}.discovery-card::after{width:48%;aspect-ratio:1;left:-12%;bottom:-9%;animation:pvRing 22s linear infinite reverse}.fact-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s ease;transform:scale(1.04)}.discovery-card.has-image .fact-image{opacity:1}.discovery-card.has-image::before,.discovery-card.has-image::after{opacity:.25}.discovery-card.has-image .visual-icon{opacity:0}.discovery-card.has-image .shade{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,30,70,.02),rgba(3,30,70,.68));opacity:0;z-index:2}.visual-icon{position:absolute;inset:0;display:grid;place-items:center;z-index:1}.visual-icon span{font-size:clamp(120px,13vw,210px);color:rgba(105,207,242,.32);animation:floatIcon 5s ease-in-out infinite}.visual-meta{position:absolute;z-index:3;left:20px;right:20px;bottom:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.topic{padding:9px 12px;border-radius:999px;background:rgba(3,42,97,.74);border:1px solid rgba(255,255,255,.15);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.qr{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:16px;background:rgba(3,42,97,.76);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}.qr.hidden{display:none}.qr img{width:62px;height:62px;border-radius:9px;background:#fff}.qr span{font-size:10px;line-height:1.25;color:var(--pv-soft);max-width:100px}.qr b{display:block;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}@keyframes floatIcon{50%{transform:translateY(-8px) rotate(-3deg)}}.discovery{transition:opacity .62s var(--pv-ease),transform .62s var(--pv-ease),filter .62s var(--pv-ease)}.pv-shell.is-leaving .discovery{opacity:0;transform:translateY(12px) scale(.994);filter:blur(3px)}.pv-shell.is-entering .discovery{animation:pvEnterCopy .74s var(--pv-ease) both}@media (orientation:portrait),(max-aspect-ratio:4/5){.discovery{grid-template-columns:1fr;grid-template-rows:minmax(0,55%) minmax(0,45%);gap:22px}.fact-title{font-size:clamp(44px,8vw,72px)}.fact-text{font-size:clamp(16px,2.6vw,21px);line-height:1.52}.fact-number{font-size:34vw}.discovery-card{min-height:280px}}@media (orientation:landscape) and (max-height:760px){.discovery{grid-template-columns:minmax(0,60%) minmax(0,40%);gap:30px}.fact-title{font-size:clamp(38px,4.2vw,62px)}.fact-text{font-size:15px;margin-top:16px;line-height:1.48}.fact-footer{margin-top:18px}.qr img{width:52px;height:52px}}
</style></head><body><div class="pv-ambient" aria-hidden="true"></div><div class="pv-shell" id="shell"><header class="pv-header"><div class="pv-brand"><div class="pv-badge"><span class="material-symbols-outlined">lightbulb</span></div><div class="pv-title">Curiosidades</div></div><div class="pv-source"><span class="material-symbols-outlined">public</span><span>Conhecimento aberto</span></div></header><main class="discovery"><section class="fact"><div class="fact-number" id="factNumber">?</div><div class="fact-kicker"><span class="material-symbols-outlined" id="kickerIcon">lightbulb</span><span id="kicker">Você sabia?</span></div><h1 class="fact-title" id="title">Descobrindo algo interessante...</h1><p class="fact-text" id="text"></p><div class="fact-footer"><span class="page" id="page">1 / 1</span><div class="track"><div class="fill" id="progress"></div></div></div></section><section class="discovery-card" id="media"><img class="fact-image" id="image" alt=""><div class="shade"></div><div class="visual-icon"><span class="material-symbols-outlined" id="visualIcon">auto_awesome</span></div><div class="visual-meta"><span class="topic" id="topic">Conhecimento</span><div class="qr hidden" id="qr"><img id="qrImg" alt="QR Code"><span><b>Saiba mais</b>Abra a fonte no celular</span></div></div></section></main><footer class="pv-footer"><div class="pv-footer-brand">PontoView</div></footer></div><script src="../shared/pv.js"></script><script>
const shell=document.getElementById('shell'),title=document.getElementById('title'),text=document.getElementById('text'),topic=document.getElementById('topic'),media=document.getElementById('media'),image=document.getElementById('image'),visualIcon=document.getElementById('visualIcon'),kicker=document.getElementById('kicker'),kickerIcon=document.getElementById('kickerIcon'),page=document.getElementById('page'),progress=document.getElementById('progress'),qr=document.getElementById('qr'),qrImg=document.getElementById('qrImg'),factNumber=document.getElementById('factNumber');const PAGE_MS=24000;let pages=[],pageIndex=0,timer=null,stopProgress=null;const fallback=[{title:'O polvo tem três corações',text:'Dois corações bombeiam sangue para as brânquias e um terceiro envia sangue para o restante do corpo. Durante a natação, o coração responsável pelo corpo reduz sua atividade, uma das razões pelas quais esses animais preferem se deslocar pelo fundo.',topic:'Natureza',icon:'water',link:''},{title:'A luz do Sol leva cerca de oito minutos até a Terra',text:'Mesmo viajando a aproximadamente 300 mil quilômetros por segundo, a luz precisa de alguns minutos para percorrer a distância média entre o Sol e o nosso planeta. Isso significa que sempre vemos o Sol alguns minutos no passado.',topic:'Ciência',icon:'wb_sunny',link:''},{title:'O Brasil abriga uma das maiores biodiversidades do planeta',text:'A combinação de Amazônia, Cerrado, Mata Atlântica, Caatinga, Pantanal e Pampa cria ambientes muito diferentes entre si. Essa variedade ajuda a explicar o enorme número de espécies encontradas no território brasileiro.',topic:'Brasil',icon:'forest',link:''}];function cleanExtract(t){t=PV.clean(t);return t.length>760?t.slice(0,757).replace(/\s+\S*$/,'')+'…':t}function splitText(t){const clean=cleanExtract(t);if(clean.length<310)return[clean];const s=clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean];const out=[];let p='';for(const x of s){if((p+x).length>340&&p){out.push(p.trim());p=x}else p+=x}if(p.trim())out.push(p.trim());return out.slice(0,3)}async function directData(){const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=12&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=1400&inprop=url';const data=await PV.fetchJSON(url);const list=Object.values(data?.query?.pages||{}).map(p=>({title:PV.clean(p.title),text:cleanExtract(p.extract),image:p.thumbnail?.source||'',link:p.fullurl||'',topic:'Conhecimento',icon:'auto_awesome'})).filter(p=>p.title&&p.text.length>=120&&!/^(Lista|Anexo|Categoria|Wikipédia:)/i.test(p.title));return{items:list.length?list:fallback}}function setImage(url){image.onload=()=>media.classList.add('has-image');image.onerror=()=>media.classList.remove('has-image');if(url)image.src=url;else{image.removeAttribute('src');media.classList.remove('has-image')}}function buildPages(item){const chunks=splitText(item.text);return chunks.map((chunk,i)=>({item,chunk,index:i,total:chunks.length}))}function render(p){const item=p.item;title.textContent=item.title;text.textContent=p.chunk;topic.textContent=item.topic||'Conhecimento';visualIcon.textContent=item.icon||'auto_awesome';factNumber.textContent=String(Math.abs((item.title||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%99+1).padStart(2,'0');setImage(item.image);page.textContent=`${p.index+1} / ${p.total}`;kicker.textContent=p.index===0?'Você sabia?':'Mais um detalhe';kickerIcon.textContent=p.index===0?'lightbulb':'psychology_alt';if(item.link&&p.index===p.total-1){qrImg.src=PV.qrUrl(item.link);qr.classList.remove('hidden')}else qr.classList.add('hidden')}function schedule(){clearTimeout(timer);if(stopProgress)stopProgress();if(pages.length<=1){progress.style.width='100%';return}stopProgress=PV.startProgress(progress,PAGE_MS);timer=setTimeout(step,PAGE_MS)}async function step(){if(!pages.length)return;pageIndex=(pageIndex+1)%pages.length;await PV.transition(shell,async()=>render(pages[pageIndex]));schedule()}async function load(){let items=fallback;try{const data=await PV.fromApi('/api/curiosidades',directData);if(Array.isArray(data.items)&&data.items.length)items=data.items}catch{}const item=PV.pickForRefresh(items,'curiosidades',x=>String(x.link||x.title));pages=buildPages(item||fallback[0]);pageIndex=0;render(pages[0]);shell.classList.add('is-entering');schedule()}load();
</script></body></html>
