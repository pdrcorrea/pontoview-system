<main class="stage"><section class="copy"><div class="kicker"><span class="material-symbols-rounded">lightbulb</span><span>Curiosidades</span></div><h1 id="title"></h1><p class="body" id="text"></p></section><section class="media glass" id="media"><img id="image" alt=""><span class="material-symbols-rounded big-icon" id="icon">auto_awesome</span><div class="media-footer"><span class="tag" id="tag"></span></div></section></main><div class="pv-orb a"></div><div class="pv-orb b"></div><div class="pv-wave"></div></div>
<script src="../shared/panel-v2.js"></script><script src="../shared/pv.js?v=8"></script><script>
const media=document.getElementById('media'),image=document.getElementById('image'),title=document.getElementById('title'),text=document.getElementById('text'),tag=document.getElementById('tag'),icon=document.getElementById('icon');
const items=[{"id":"venus-dia-ano","tag":"Espaço","icon":"public","wiki":"Vênus (planeta)","title":"Em Vênus, um dia dura mais que um ano.","text":"Vênus leva cerca de 243 dias terrestres para completar uma rotação, mas apenas 225 dias para dar uma volta ao redor do Sol. E há outro detalhe curioso: o planeta gira no sentido oposto ao da maioria dos planetas."},{"id":"luz-sol","tag":"Espaço","icon":"wb_sunny","wiki":"Sol","title":"A luz do Sol leva pouco mais de oito minutos para chegar até nós.","text":"O Sol está a cerca de 150 milhões de quilômetros da Terra. Mesmo viajando a quase 300 mil quilômetros por segundo, sua luz demora aproximadamente oito minutos e vinte segundos para alcançar o nosso planeta."},{"id":"beija-flor-re","tag":"Natureza","icon":"flutter_dash","wiki":"Beija-flor","title":"O beija-flor consegue voar para trás.","text":"A estrutura das asas permite ao beija-flor pairar quase parado no ar e também fazer algo incomum entre as aves: voar em marcha a ré. Algumas espécies ultrapassam dezenas de batidas de asa por segundo."},{"id":"polvo-camuflagem","tag":"Natureza","icon":"water","wiki":"Polvo","title":"Polvos mudam de aparência em poucos instantes.","text":"Células especiais na pele permitem que muitos polvos alterem cor e padrões rapidamente. A habilidade ajuda na camuflagem, na comunicação e até na hora de surpreender uma presa."},{"id":"torre-eiffel-sol","tag":"Engenharia","icon":"architecture","wiki":"Torre Eiffel","title":"O Sol consegue deslocar o topo da Torre Eiffel.","text":"Quando um lado da estrutura metálica aquece mais que o outro, o ferro se expande de maneira desigual. Esse efeito térmico pode fazer o topo da torre se afastar alguns centímetros do lado iluminado."},{"id":"filtro-barro","tag":"Brasil","icon":"water_drop","wiki":"Filtro de barro","title":"O tradicional filtro de barro brasileiro nasceu no interior de São Paulo.","text":"O modelo se desenvolveu no início do século XX combinando recipientes de cerâmica feitos com argila local e velas filtrantes. Ele se espalhou pelo país por ser simples, barato e funcionar sem eletricidade."},{"id":"lua-programacao","tag":"Tecnologia","icon":"code","wiki":"Lua (linguagem de programação)","title":"Uma linguagem de programação usada no mundo inteiro nasceu no Brasil.","text":"Lua foi criada na PUC-Rio na década de 1990. Leve e flexível, passou a ser usada em jogos, sistemas embarcados e diversos programas que precisam incorporar uma linguagem de scripts."},{"id":"santos-dumont-14bis","tag":"Brasil","icon":"flight","wiki":"14-bis","title":"O 14-bis fez história diante de uma plateia em Paris.","text":"Em 1906, Santos-Dumont realizou voos públicos com o 14-bis na França. A aeronave decolou por seus próprios meios e seus voos foram oficialmente observados por entidades aeronáuticas da época."},{"id":"amazonia-chuva","tag":"Natureza","icon":"forest","wiki":"Rios voadores","title":"A Amazônia ajuda a transportar umidade para regiões distantes.","text":"A água liberada pela floresta por evapotranspiração entra na atmosfera e pode ser carregada pelos ventos. Esses fluxos de vapor, popularmente chamados de rios voadores, influenciam chuvas em outras partes da América do Sul."},{"id":"ano-bissexto","tag":"Ciência","icon":"calendar_month","wiki":"Ano bissexto","title":"O ano bissexto existe porque a Terra não leva exatamente 365 dias para orbitar o Sol.","text":"A volta completa dura aproximadamente 365 dias e um quarto. Sem ajustes no calendário, as datas se afastariam aos poucos das estações do ano, por isso acrescentamos um dia em determinados anos."},{"id":"brasil-biodiversidade","tag":"Brasil","icon":"eco","wiki":"Biodiversidade do Brasil","title":"Poucos países reúnem tantos ambientes naturais diferentes quanto o Brasil.","text":"Amazônia, Cerrado, Mata Atlântica, Caatinga, Pantanal e Pampa formam paisagens muito distintas. Essa variedade de ambientes ajuda a explicar a enorme diversidade de plantas e animais encontrada no país."},{"id":"jupiter-dia","tag":"Espaço","icon":"planet","wiki":"Júpiter (planeta)","title":"Júpiter tem o dia mais curto entre os planetas do Sistema Solar.","text":"Apesar de ser o maior planeta do Sistema Solar, Júpiter gira muito rápido. Uma rotação completa leva cerca de dez horas, criando dias bem mais curtos que os nossos."},{"id":"papel-reciclagem","tag":"Cotidiano","icon":"recycling","wiki":"Papel","title":"O papel pode ganhar várias novas vidas antes de virar resíduo.","text":"Fibras de celulose podem ser reaproveitadas em diferentes ciclos de reciclagem, embora fiquem menores a cada processo. Por isso, a produção de papel reciclado normalmente mistura fibras recuperadas e novas."},{"id":"fotografia-hercules","tag":"Brasil","icon":"photo_camera","wiki":"Hercule Florence","title":"Experimentos pioneiros de fotografia também aconteceram no Brasil.","text":"Na década de 1830, Hercule Florence realizou experiências com processos de reprodução de imagens em Campinas. Seus trabalhos ocorreram de forma independente de outros pioneiros da fotografia na Europa."},{"id":"nuvens-peso","tag":"Ciência","icon":"cloud","wiki":"Nuvem","title":"Uma nuvem pode conter uma quantidade enorme de água sem cair de uma vez.","text":"A água de uma nuvem está distribuída em incontáveis gotículas minúsculas ou cristais de gelo suspensos no ar. Elas só formam chuva quando crescem o suficiente para vencer as correntes de ar que as sustentam."},{"id":"som-espaco","tag":"Espaço","icon":"volume_off","wiki":"Som","title":"No espaço, ninguém ouviria uma explosão do jeito que acontece no cinema.","text":"O som precisa de um meio material, como ar, água ou metal, para se propagar. No quase vácuo do espaço não há partículas suficientes para transportar ondas sonoras como acontece na atmosfera terrestre."},{"id":"capivara-roedor","tag":"Natureza","icon":"pets","wiki":"Capivara","title":"A capivara é o maior roedor vivo do mundo.","text":"Nativa da América do Sul, ela é muito adaptada à vida próxima da água. Seus olhos, orelhas e narinas ficam posicionados no alto da cabeça, ajudando o animal a permanecer parcialmente submerso."},{"id":"cristais-neve","tag":"Ciência","icon":"ac_unit","wiki":"Floco de neve","title":"Flocos de neve seguem a mesma simetria básica, mas raramente são idênticos.","text":"A estrutura molecular do gelo favorece formas com seis lados. Durante a queda, pequenas diferenças de temperatura e umidade alteram o crescimento do cristal e produzem desenhos extremamente variados."}];
function setImage(url){image.decoding='async';image.onload=()=>media.classList.add('has-image');image.onerror=()=>{media.classList.remove('has-image');image.removeAttribute('src')};if(url)image.src=url;else{image.removeAttribute('src');media.classList.remove('has-image')}}
async function wikiImage(item){if(!item.wiki)return'';const url='https://pt.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles='+encodeURIComponent(item.wiki);try{const data=await PV.cachedJSON(url,7*24*60*60*1000,{},5000);const pages=data&&data.query&&data.query.pages?Object.values(data.query.pages):[];return pages[0]&&pages[0].thumbnail&&pages[0].thumbnail.source||''}catch(e){return''}}
async function load(){const item=pickBalancedPanelItem(items,'curiosidades',x=>x.tag);title.textContent=item.title;text.textContent=item.text;tag.textContent=item.tag;icon.textContent=item.icon||'auto_awesome';setImage(await wikiImage(item));showLoader(220)}
load();
</script></body></html>
